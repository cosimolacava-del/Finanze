name: Patch index BPER columns

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-index-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch BPER parser using PDF columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('Build index: 2026.08.27-01','Build index: 2026.08.27-02',1)
          s=s.replace('pdf.mjs?v=20260827-01','pdf.mjs?v=20260827-02',1)
          s=s.replace('const APP_VERSION = "2.3-bper-20260827-01";','const APP_VERSION = "2.4-bper-columns-20260827-02";',1)

          start=s.index('async function estraiOperazioniPdf(')
          end=s.index('\nlet pdfjsPromise=null;',start)
          new_func=r'''async function estraiOperazioniPdf(file,annoDefault,meseDefault){
  const pdfjsLib=await caricaPdfJs();
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const ops=[],righe=[];
  const dataCompleta=/^\d{1,2}\/\d{1,2}\/\d{4}$/;
  const importoCompleto=/^[+\-]?(?:\d{1,3}(?:\.\d{3})*|\d+),\d{2}(?:€|EUR)?$/i;
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),content=await contenutoTestoPaginaCompat(page),byY={};
    content.items.forEach(it=>{
      const y=Math.round((it.transform&&it.transform[5])||0);
      (byY[y]=byY[y]||[]).push(it);
    });
    Object.keys(byY).sort((a,b)=>b-a).forEach(y=>{
      const items=byY[y].sort((a,b)=>(a.transform?.[4]||0)-(b.transform?.[4]||0));
      const riga=items.map(x=>x.str).join(" ").replace(/\s+/g," ").trim();
      if(riga)righe.push(riga);

      // BPER: una vera operazione ha la data operazione nella prima colonna.
      const dataItem=items.find(it=>Number(it.transform?.[4]||0)<80&&dataCompleta.test(String(it.str||"").trim()));
      if(!dataItem)return;
      const [giorno,mese,anno]=String(dataItem.str).trim().split('/').map(Number);
      if(!(giorno>=1&&giorno<=31&&mese>=1&&mese<=12&&anno>=2000))return;
      if(meseDefault&&mese!==Number(meseDefault))return;

      // Nel layout BPER gli importi sono in colonne distinte: Entrate ~x=296-344,
      // Uscite ~x=373-409. Non deduciamo più il segno dalla descrizione e non
      // prendiamo più "l'ultimo numero" della riga.
      const soldi=items.map(it=>({it,x:Number(it.transform?.[4]||0),t:String(it.str||"").replace(/\s/g,"").trim()}))
        .filter(z=>importoCompleto.test(z.t));
      const entrata=soldi.find(z=>z.x>=285&&z.x<365);
      const uscita=soldi.find(z=>z.x>=365&&z.x<435);
      if(!entrata&&!uscita)return;

      const scelto=uscita||entrata;
      const valore=numeroItaliano(scelto.t);
      if(valore===null||Math.abs(valore)<0.01)return;
      const importo=uscita?-Math.abs(valore):Math.abs(valore);
      const descrizione=items.filter(it=>{
        const x=Number(it.transform?.[4]||0);return x>=130&&x<285;
      }).map(it=>it.str).join(' ').replace(/\s+/g,' ').trim();
      ops.push({giorno,mese,anno,importo,descrizione:descrizione||riga,riga,pending:/da contabilizzare/i.test(riga)});
    });
  }
  return {ops,righeTotali:righe.length,pagine:pdf.numPages};
}'''
          s=s[:start]+new_func+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -F 'Build index: 2026.08.27-02' index.html
          grep -F 'pdf.mjs?v=20260827-02' index.html
          grep -F 'x>=285&&z.x<365' index.html
          grep -F 'x>=365&&z.x<435' index.html

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Index v2026.08.27-02: parser BPER basato sulle colonne Entrate/Uscite'
          git push