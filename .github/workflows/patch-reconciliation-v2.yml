name: Patch riconciliazione movimenti v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-reconciliation-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: python .github/scripts/patch_reconciliation_v2.py
      - name: Verify
        run: |
          grep -F 'Build index: 2026.08.28-09' index.html
          grep -F 'function abbinaMovimentiEstratto' index.html
          grep -F 'Movimenti non abbinati — uscite' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Index v2026.08.28-09: riconciliazione movimento per movimento'
          git push
