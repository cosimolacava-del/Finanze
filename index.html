<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilancio Familiare</title>
<meta name="description" content="Bilancio familiare personale — entrate, uscite, budget e saldo conto">
<style>
:root{
  --navy:#1F2D3D; --cream:#F7F4EC; --green:#2E7D4F; --rust:#A34A3D; --gold:#B8860B;
  --border:#E5E0D3; --border-soft:#D8D3C4; --muted:#7A7362;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--navy);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}
h1{font-family:ui-serif,Georgia,serif;font-size:28px;font-weight:700;margin:0;letter-spacing:-0.5px;}
.sub{color:var(--muted);font-size:13px;margin:4px 0 24px;}
.header-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tab-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--border-soft);background:transparent;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;}
.card h3{font-family:ui-serif,Georgia,serif;font-size:16px;font-weight:700;margin:0 0 14px;color:var(--navy);}
.month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:24px;}
.nav-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-soft);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.big-select{font-family:ui-serif,Georgia,serif;font-size:19px;font-weight:700;border:none;background:transparent;color:var(--navy);cursor:pointer;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:26px;}
.summary-card{display:flex;flex-direction:column;gap:6px;}
.summary-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.summary-value{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;}
.two-col{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;align-items:start;}
.three-col{display:grid;grid-template-columns:0.85fr 1fr 1fr;gap:16px;align-items:start;}
@media (max-width:900px){.three-col{grid-template-columns:1fr 1fr;}}
@media (max-width:820px){.two-col{grid-template-columns:1fr;} .summary-grid{grid-template-columns:1fr;} .three-col{grid-template-columns:1fr;}}
.cat-row{margin-bottom:12px;}
.cat-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.cat-name{font-weight:600;}
.cat-amt{font-family:ui-monospace,Menlo,monospace;}
.bar-bg{height:6px;background:#EAE6D9;border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.tx-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tx-search{position:relative;flex:1;}
.tx-search input{width:100%;padding:7px 8px 7px 26px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;box-sizing:border-box;font-family:inherit;}
.tx-search .icon{position:absolute;left:8px;top:9px;color:var(--muted);font-size:12px;}
select, input{font-family:inherit;}
.tx-controls select{padding:7px 8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.tx-list{max-height:380px;overflow-y:auto;}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin-bottom:6px;border-radius:6px;}
.tx-item.entrata{background:#E9F3E4;}
.tx-item.uscita{background:#FBEEEC;}
.tx-desc{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.tx-cat{font-size:11px;color:var(--muted);}
.tx-amt{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;}
.tx-amt.entrata{color:var(--green);}
.tx-amt.uscita{color:var(--rust);}
.tx-del{border:none;background:none;cursor:pointer;color:#B9B2A0;font-size:14px;padding:2px 6px;}
.add-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.empty{color:#9C9585;font-size:13px;}
.modal-bg{position:fixed;inset:0;background:rgba(31,45,61,0.4);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:#fff;border-radius:12px;padding:24px;width:340px;max-width:90vw;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-close{border:none;background:none;cursor:pointer;font-size:18px;}
.form-grid{display:grid;gap:10px;}
.form-grid input, .form-grid select{padding:9px 10px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;width:100%;box-sizing:border-box;}
.form-row{display:flex;gap:8px;}
.hidden{display:none !important;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:6px 4px;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;}
td{padding:8px 4px;border-bottom:1px solid #EFEBDF;}
.esito{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;}
.range-toggle{display:flex;gap:6px;}
.range-btn{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:#EAE6D9;color:var(--navy);font-family:inherit;}
.range-btn.active{background:var(--navy);color:#fff;}
.budget-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EFEBDF;}
.budget-per-month{font-size:12px;color:#9C9585;font-family:ui-monospace,Menlo,monospace;}
.budget-input-wrap{position:relative;}
.budget-input-wrap span{position:absolute;left:8px;top:8px;font-size:13px;color:#9C9585;}
.budget-input-wrap input{width:120px;padding:6px 8px 6px 20px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;text-align:right;}
.budget-total{display:flex;justify-content:space-between;padding-top:14px;font-weight:700;}
.saldo-input{width:100px;padding:4px 6px;border-radius:5px;border:1px solid var(--border-soft);font-size:12px;}
.footer-note{color:var(--muted);font-size:12px;margin-top:30px;text-align:center;}
.chart-canvas{width:100%;height:280px;display:block;}
.admin-cat-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #EFEBDF;}
.admin-cat-row input[type="text"]{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.admin-cat-row label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
.admin-del{border:none;background:none;cursor:pointer;color:var(--rust);font-size:14px;padding:2px 8px;}
.admin-add-row{display:flex;gap:8px;margin-top:14px;}
.admin-add-row input{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.warn-box{background:#FCEFCB;border:1px solid #E8D28A;border-radius:8px;padding:10px 12px;font-size:12px;color:#8A6D1F;margin-bottom:14px;}
.danger-zone{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);}
.danger-btn{padding:8px 14px;border-radius:6px;border:1px solid var(--rust);background:#fff;color:var(--rust);font-size:12px;font-weight:600;cursor:pointer;}
#printReport{display:none;}
#lockScreen.hidden{display:none;}
#lockScreen{position:fixed;inset:0;background:var(--cream);z-index:200;display:flex;align-items:center;justify-content:center;}
.lock-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px;width:320px;max-width:90vw;text-align:center;}
.lock-box h2{font-family:ui-serif,Georgia,serif;margin:0 0 6px;color:var(--navy);}
.lock-box p{font-size:12px;color:var(--muted);margin:0 0 18px;}
.lock-box input{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border-soft);font-size:15px;text-align:center;box-sizing:border-box;margin-bottom:10px;}
.lock-box button{width:100%;padding:10px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.lock-error{color:var(--rust);font-size:12px;min-height:16px;margin-top:6px;}
#reminderBanner{background:#FCEFCB;border:1px solid #E8D28A;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#8A6D1F;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
#reminderBanner button{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;}
#reminderBanner .send-btn{background:var(--navy);color:#fff;}
#reminderBanner .dismiss-btn{background:transparent;color:#8A6D1F;text-decoration:underline;}
.report-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:20px;}
.report-header h1{font-family:ui-serif,Georgia,serif;font-size:24px;margin:0;}
.report-header .meta{font-size:11px;color:var(--muted);text-align:right;}
.report-summary{display:flex;gap:20px;margin-bottom:22px;}
.report-summary div{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.report-summary .lbl{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;}
.report-summary .val{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;}
.report-section-title{font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:700;margin:22px 0 8px;color:var(--navy);}
.report-table{width:100%;border-collapse:collapse;font-size:12px;}
.report-table th{text-align:left;padding:5px 6px;border-bottom:2px solid var(--navy);font-size:10px;text-transform:uppercase;color:var(--muted);}
.report-table td{padding:5px 6px;border-bottom:1px solid #EFEBDF;}
.report-table tr.tot td{border-top:2px solid var(--navy);border-bottom:none;font-weight:700;padding-top:8px;}
@media print{
  body *{visibility:hidden;}
  #printReport, #printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;}
  .footer-note{display:none;}
}
</style>
</head>

// Restituisce il valore applicabile a un dato anno da un elenco di scaglioni
// {anno, val}: prende l'ultimo scaglione con "anno" <= anno richiesto (oltre
// l'ultimo scaglione noto, resta fisso su quel valore per mancanza di dati più recenti).
function valoreScaglione(tiers, anno){
  const ordinati = tiers.slice().sort((a,b)=>a.anno-b.anno);
  let scelto = ordinati[0];
  ordinati.forEach(t => { if (t.anno <= anno) scelto = t; });
  return scelto.val;
}

function migraStipendiRpd(){
  if (!state.stipendi) return;
  let cambiato = false;
  ["persona1","persona2"].forEach(k => {
    const p = state.stipendi[k];
    if (p && p.tipo === "scuola" && !p.rpd) {
      p.rpd = JSON.parse(JSON.stringify(DEFAULT_RPD_SCUOLA));
      if (p.tredicesima === undefined) p.tredicesima = true;
      cambiato = true;
    }
    if (p && p.tipo === "scuola" && !p.aumentoCCNL) {
      p.aumentoCCNL = {annoEffetto: 2027, tabellarePct: 5.9, rpdDeltaMensile: 10.70};
      cambiato = true;
    }
    // Aggiorna con i dati ufficiali del CCNL Istruzione e Ricerca 2025-2027 (ARAN,
    // sottoscritto 1° luglio 2026) le tabelle che erano ancora nel vecchio formato
    // a valore fisso (stime precedenti), sostituendole con gli scaglioni reali
    // 2025/2026/2027. Non tocca tabelle già passate a scaglioni (es. modificate a mano).
    if (p && p.tipo === "scuola" && p.tabella && p.tabella.length && !p.tabella[0].tiers) {
      p.tabella = JSON.parse(JSON.stringify(DEFAULT_FASCE_SCUOLA));
      cambiato = true;
    }
    if (p && p.tipo === "scuola" && p.rpd && p.rpd.length && !p.rpd[0].tiers) {
      p.rpd = JSON.parse(JSON.stringify(DEFAULT_RPD_SCUOLA));
      cambiato = true;
    }
  });
  if (state.stipendi && !state.stipendi.detrazioneRistrutturazione) {
    state.stipendi.detrazioneRistrutturazione = {
      attiva: true, importoSpesa: 96000, percentuale: 50, anniRateizzazione: 10,
      annoInizio: 2026, applicaA: "persona1"
    };
    cambiato = true;
  }
  if (state.stipendi && !state.stipendi.detrazioneMutuo) {
    state.stipendi.detrazioneMutuo = {
      attiva: true, importoMutuo: 300000, tassoAnnuo: 3, durataAnni: 25,
      annoInizio: 2026, tettoInteressiAnnui: 4000, percentuale: 19, applicaA: "persona1",
      estinzioniAnticipate: []
    };
    cambiato = true;
  }
  if (state.stipendi && state.stipendi.detrazioneMutuo && !state.stipendi.detrazioneMutuo.estinzioniAnticipate) {
    state.stipendi.detrazioneMutuo.estinzioniAnticipate = [];
    cambiato = true;
  }
  if (cambiato) saveStipendi();
}

// ============================================================
// RICORRENTI: genera automaticamente i movimenti mancanti per ogni
// regola ricorrente attiva, dal mese di inizio fino al mese corrente
// (o fino al mese di fine, se la regola è stata chiusa).
// ============================================================
function monthsBetweenInclusive(y1,m1,y2,m2){
  const out = [];
  let y=y1, m=m1;
  while (y<y2 || (y===y2 && m<=m2)){
    out.push([y,m]);
    m++; if (m>12){ m=1; y++; }
  }
  return out;
}

function generaMovimentiRicorrenti(){
  if (!state.ricorrenti || state.ricorrenti.length===0) return;
  const now = new Date();
  let curY = now.getFullYear(), curM = now.getMonth()+1;
  // estendi la generazione almeno fino al mese che l'utente sta navigando (permette di vedere le ricorrenze anche nei mesi futuri)
  if (state.selYear != null && state.selMonth != null) {
    if (state.selYear > curY || (state.selYear===curY && state.selMonth > curM)) { curY = state.selYear; curM = state.selMonth; }
  }
  const nuoviGenerati = [];

  state.ricorrenti.forEach(rule => {
    const endY = rule.alAnno || curY, endM = rule.alAnno ? rule.alMese : curM;
    // non generare oltre il mese limite (oggi, o il mese navigato se più avanti), anche se la regola è ancora aperta
    let cappedEndY = endY, cappedEndM = endM;
    if (endY > curY || (endY===curY && endM > curM)) { cappedEndY = curY; cappedEndM = curM; }
    if (rule.dalAnno > cappedEndY || (rule.dalAnno===cappedEndY && rule.dalMese > cappedEndM)) return;

    const months = monthsBetweenInclusive(rule.dalAnno, rule.dalMese, cappedEndY, cappedEndM);
    months.forEach(([y,m]) => {
      // id deterministico (gruppo+anno+mese): se due dispositivi generano la
      // stessa ricorrenza per lo stesso mese prima di sincronizzarsi, ottengono
      // comunque lo stesso id, quindi la sincronizzazione non può duplicarla.
      const idDeterministico = "ric-" + rule.gruppoId + "-" + y + "-" + m;
      const saltato = (rule.mesiSaltati||[]).some(s => s.anno===y && s.mese===m);
      if (saltato) return; // l'utente ha cancellato apposta questo mese: non ricrearlo
      const exists = state.transazioni.some(t => t.id===idDeterministico || (t.ricorrenteGruppo===rule.gruppoId && t.anno===y && t.mese===m));
      if (!exists){
        const nuovo = {
          id: idDeterministico, anno:y, mese:m, categoria:rule.categoria, descrizione:rule.descrizione,
          importo: rule.importo, ricorrenteGruppo: rule.gruppoId, createdAt: Date.now(), updatedAt: Date.now()
        };
        state.transazioni.push(nuovo);
        nuoviGenerati.push(nuovo);
      }
    });
  });

  if (nuoviGenerati.length > 0) salvaMovimentiBulk(nuoviGenerati, []);
}

function getYears(){
  const s = new Set(state.transazioni.map(t=>t.anno));
  const arr = Array.from(s);
  const minY = arr.length ? Math.min(...arr) : 2019;
  const maxY = arr.length ? Math.max(...arr) : 2026;
  const out = [];
  for (let y=minY; y<=maxY+2; y++) out.push(y);
  return out;
}

// Alcune spese (es. il mutuo) vengono registrate/previste ogni mese ma la banca
// le addebita davvero solo ogni 3 mesi in un'unica rata. Per il confronto col
// saldo conto reale (Saldo Conto) serve il ritmo VERO di addebito, non quello
// registrato — questa funzione calcola la differenza da applicare mese per mese.
function aggiustamentoTrimestraleUscite(anno, mese){
  if (!state.speseTrimestrali || state.speseTrimestrali.length === 0) return 0;
  let delta = 0;
  state.speseTrimestrali.forEach(cfg => {
    const match = (cfg.descrizioneMatch || "").toLowerCase();
    if (!match) return;
    const registrato = state.transazioni
      .filter(t => t.anno===anno && t.mese===mese && t.categoria!=="Entrate" && t.descrizione.toLowerCase().includes(match))
      .reduce((s,t)=>s+t.importo, 0);
    // mesi trascorsi dal mese di riferimento (può essere negativo se anno/mese precede l'ancora)
    const diffMesi = (anno*12+mese) - (cfg.prossimaRataAnno*12+cfg.prossimaRataMese);
    const isMesePagamento = ((diffMesi % 3) + 3) % 3 === 0;
    const realeDelMese = isMesePagamento ? registrato*3 : 0;
    delta += (realeDelMese - registrato);
  });
  return delta;
}

// Calcola il ritmo medio di risparmio usando SOLO mesi effettivamente conclusi
// (esclude il mese in corso, che è parziale e falserebbe la media).
function paceMedioRisparmioRecente(nMesi){
  const now = new Date();
  const oggiAnno = now.getFullYear(), oggiMese = now.getMonth()+1;
  const mesiConclusi = getMonthlySummary().filter(m => m.anno < oggiAnno || (m.anno===oggiAnno && m.mese < oggiMese));
  const ultimi = mesiConclusi.slice(-nMesi);
  return ultimi.length ? ultimi.reduce((s,m)=>s+m.risparmio,0)/ultimi.length : 0;
}

function getMonthlySummary(){
  const map = {};
  state.transazioni.forEach(t => {
    const k = monthKey(t.anno, t.mese);
    if (!map[k]) map[k] = {anno:t.anno, mese:t.mese, entrate:0, uscite:0};
    if (t.categoria === "Entrate") map[k].entrate += t.importo; else map[k].uscite += t.importo;
  });
  const arr = Object.values(map).sort((a,b)=> a.anno-b.anno || a.mese-b.mese);
  const reset = state.risparmioReset; // {anno, mese, valore} oppure null
  let cum = 0;
  return arr.map(m => {
    const risparmio = m.entrate - m.uscite;
    if (reset && m.anno===reset.anno && m.mese===reset.mese) {
      cum = (reset.valore || 0) + risparmio;
    } else {
      cum += risparmio;
    }
    return {...m, risparmio, cumulato:cum, key:monthKey(m.anno,m.mese), label: MESI[m.mese-1].slice(0,3)+" "+String(m.anno).slice(2)};
  });
}

// ============================================================
// CANVAS CHARTS (zero external dependencies)
// ============================================================
function setupCanvas(canvas){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = rect.width || canvas.parentElement.clientWidth || 600;
  const h = parseInt(canvas.dataset.h || "280", 10);
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  return {ctx, w, h};
}

function niceStep(range){
  if (range <= 0) return 1;
  const rough = range / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1; else if (norm < 3) step = 2; else if (norm < 7) step = 5; else step = 10;
  return step * mag;
}

function drawLineChart(canvas, labels, datasets, opts){
  opts = opts || {};
  const {ctx, w, h} = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL = 54, padR = 14, padT = 14, padB = labels.length ? 46 : 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let allVals = [];
  datasets.forEach(ds => ds.data.forEach(v => { if (v!=null) allVals.push(v); }));
  if (allVals.length === 0) allVals = [0,1];
  let min = Math.min(0, ...allVals), max = Math.max(...allVals);
  if (max === min) max = min + 1;
  const step = niceStep(max - min);
  min = Math.floor(min/step)*step; max = Math.ceil(max/step)*step;

  const xForIdx = i => padL + (labels.length<=1 ? plotW/2 : (plotW * i/(labels.length-1)));
  const yForVal = v => padT + plotH - ((v-min)/(max-min))*plotH;

  // gridlines + y labels
  ctx.strokeStyle = GRID; ctx.fillStyle = MUTED; ctx.font = "11px ui-sans-serif,sans-serif"; ctx.lineWidth=1;
  const nLines = Math.round((max-min)/step);
  for (let i=0;i<=nLines;i++){
    const v = min + i*step;
    const y = yForVal(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.textAlign="right"; ctx.fillText(fmtCompact(v), padL-8, y+4);
  }
  // x labels (sparse if many)
  const maxLabels = Math.floor(plotW/55);
  const labelStep = Math.max(1, Math.ceil(labels.length/Math.max(1,maxLabels)));
  ctx.textAlign="center"; ctx.fillStyle = MUTED;
  labels.forEach((lab,i) => {
    if (i % labelStep === 0 || i===labels.length-1){
      ctx.fillText(lab, xForIdx(i), h-padB+16);
    }
  });

  // lines
  datasets.forEach(ds => {
    ctx.strokeStyle = ds.color; ctx.lineWidth = ds.width || 2;
    if (ds.dash) ctx.setLineDash(ds.dash); else ctx.setLineDash([]);
    ctx.beginPath();
    let started = false;
    ds.data.forEach((v,i) => {
      if (v==null) { started=false; return; }
      const x = xForIdx(i), y = yForVal(v);
      if (!started){ ctx.moveTo(x,y); started=true; } else { ctx.lineTo(x,y); }
    });
    ctx.stroke();
  });

  // legend
  if (opts.legend !== false){
    let lx = padL, ly = 8;
    ctx.font = "11px ui-sans-serif,sans-serif";
    datasets.forEach(ds => {
      ctx.fillStyle = ds.color;
      ctx.fillRect(lx, ly-8, 10, 10);
      ctx.fillStyle = NAVY; ctx.textAlign="left";
      ctx.fillText(ds.label, lx+14, ly+1);
      lx += 14 + ctx.measureText(ds.label).width + 16;
    });
  }
}

function fmtCompact(v){
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v%1000===0?0:1)+"k";
  return String(Math.round(v));
}

function drawAndamentoCharts(){
  const data = getMonthlySummary();
  const shown = state.andamentoRange === "12m" ? data.slice(-12) : data;

  // proiezione: estende il risparmio cumulato di 6 mesi nel futuro usando il ritmo medio recente
  // (solo mesi effettivamente conclusi, per non falsare la media col mese in corso)
  const MESI_PROIEZIONE = 6;
  const paceMedioRisparmio = paceMedioRisparmioRecente(6);
  const ultimoDato = data[data.length-1];
  const labelsProiezione = [];
  let py = ultimoDato ? ultimoDato.anno : new Date().getFullYear();
  let pm = ultimoDato ? ultimoDato.mese : new Date().getMonth()+1;
  for (let i=0;i<MESI_PROIEZIONE;i++){
    pm++; if (pm>12){pm=1; py++;}
    labelsProiezione.push(MESI[pm-1].slice(0,3)+" "+String(py).slice(2));
  }
  const cumulatoProiezione = [];
  let cum = ultimoDato ? ultimoDato.cumulato : 0;
  for (let i=0;i<MESI_PROIEZIONE;i++){ cum += paceMedioRisparmio; cumulatoProiezione.push(cum); }

  const allLabels = shown.map(d=>d.label).concat(labelsProiezione);
  const padStorico = (arr) => arr.concat(new Array(MESI_PROIEZIONE).fill(null));
  const proiezioneSerie = new Array(shown.length-1).fill(null).concat([ultimoDato?ultimoDato.cumulato:null]).concat(cumulatoProiezione);

  const c1 = document.getElementById("trendChart");
  if (c1) drawLineChart(c1, allLabels, [
    {label:"Entrate", data:padStorico(shown.map(d=>d.entrate)), color:GREEN},
    {label:"Uscite", data:padStorico(shown.map(d=>d.uscite)), color:RUST},
    {label:"Risparmio cumulato", data:padStorico(shown.map(d=>d.cumulato)), color:GOLD},
    {label:`Proiezione (${paceMedioRisparmio>=0?'+':''}${eur(paceMedioRisparmio)}/mese)`, data:proiezioneSerie, color:NAVY, width:2, dash:[5,4]}
  ]);

  const allYears = Array.from(new Set(data.map(d=>d.anno))).sort();
  if (state.andamentoYears === null) state.andamentoYears = [...allYears];

  const filterRow = document.getElementById("yearFilterRow");
  if (filterRow) {
    filterRow.innerHTML = allYears.map((y,i) => {
      const checked = state.andamentoYears.includes(y);
      const color = FALLBACK_PALETTE[i % FALLBACK_PALETTE.length];
      return `<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;cursor:pointer">
        <input type="checkbox" class="year-filter-chk" data-year="${y}" ${checked?'checked':''}>
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span>${y}
      </label>`;
    }).join('') + `<button class="range-btn" id="yearFilterAll">Tutti</button><button class="range-btn" id="yearFilterNone">Nessuno</button><button class="range-btn ${state.andamentoShowMedia?'active':''}" id="mediaToggle">&#8213; Media</button>`;

    filterRow.querySelectorAll(".year-filter-chk").forEach(chk => {
      chk.onchange = () => {
        const y = Number(chk.dataset.year);
        if (chk.checked) { if (!state.andamentoYears.includes(y)) state.andamentoYears.push(y); }
        else { state.andamentoYears = state.andamentoYears.filter(v=>v!==y); }
        drawYearCompareChart(data, allYears);
      };

    const allBtn = document.getElementById("yearFilterAll");
    if (allBtn) allBtn.onclick = () => { state.andamentoYears = [...allYears]; drawAndamentoCharts(); };
    const noneBtn = document.getElementById("yearFilterNone");

  }

  drawYearCompareChart(data, allYears);
}

function percentile(sortedArr, p){
  if (sortedArr.length === 0) return null;
  if (sortedArr.length === 1) return sortedArr[0];
  const idx = p * (sortedArr.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi]-sortedArr[lo]) * (idx-lo);
}

// ============================================================
// CONSIGLI: suggerimenti generati dai dati reali (categorie in
// crescita, risparmio sotto obiettivo, margini di risparmio)
// ============================================================
function generaConsigli(){
  const consigli = [];
  const data = getMonthlySummary();
  if (data.length < 2) return consigli;

  const recenti = data.slice(-3);
  const nRecenti = recenti.length;
  const annoCorrente = data[data.length-1].anno;

  const storico = data.slice(0, -3);
  state.categorieBudget.forEach(cat => {
    const speseRecenti = recenti.map(m => state.transazioni.filter(t=>t.anno===m.anno && t.mese===m.mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0));
    const mediaRecente = speseRecenti.reduce((s,v)=>s+v,0)/nRecenti;
    if (mediaRecente < 30) return;
    const speseStoriche = storico.map(m => state.transazioni.filter(t=>t.anno===m.anno && t.mese===m.mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0)).filter(v=>v>0);
    if (speseStoriche.length < 3) return;
    const mediaStorica = trimmedMean95(speseStoriche);
    if (mediaStorica > 0 && mediaRecente > mediaStorica * 1.25) {
      const pct = ((mediaRecente - mediaStorica) / mediaStorica) * 100;
      consigli.push({tipo:"warn", testo: `La spesa in <b>${escapeHtml(cat)}</b> è cresciuta del ${pct.toFixed(0)}% rispetto alla tua media storica (${eur(mediaRecente)}/mese contro ${eur(mediaStorica)}/mese).`});
    }
  });

  const budgetAnno = state.budgetAnnuale[annoCorrente] || {};
  const entratePreviste = state.vociEntrata.reduce((s,v)=>s+(budgetAnno["ENT::"+v]||0),0)/12;
  const uscitePreviste = state.categorieBudget.reduce((s,c)=>s+(budgetAnno[c]||0),0)/12;
  const risparmioPrevisto = entratePreviste - uscitePreviste;
  const risparmioMedioRecente = recenti.reduce((s,m)=>s+m.risparmio,0)/nRecenti;
  if (risparmioPrevisto > 0 && risparmioMedioRecente < risparmioPrevisto * 0.8) {
    consigli.push({tipo:"warn", testo: `Il risparmio medio degli ultimi ${nRecenti} mesi (${eur(risparmioMedioRecente)}) è sotto l'obiettivo di budget (${eur(risparmioPrevisto)}/mese).`});
  } else if (risparmioPrevisto > 0 && risparmioMedioRecente > risparmioPrevisto * 1.1) {
    consigli.push({tipo:"good", testo: `Stai risparmiando più del previsto: ${eur(risparmioMedioRecente)}/mese in media contro un obiettivo di ${eur(risparmioPrevisto)}.`});
  }

  let peggiore = null;
  state.categorieBudget.forEach(cat => {
    const previstoMensile = (budgetAnno[cat]||0)/12;
    if (!previstoMensile) return;
    const speseRecenti = recenti.map(m => state.transazioni.filter(t=>t.anno===m.anno && t.mese===m.mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0));
    const mediaRecente = speseRecenti.reduce((s,v)=>s+v,0)/nRecenti;
    const eccesso = mediaRecente - previstoMensile;
    if (eccesso > 0 && (!peggiore || eccesso > peggiore.eccesso)) peggiore = {cat, eccesso, mediaRecente, previstoMensile};
  });
  if (peggiore) {
    consigli.push({tipo:"tip", testo: `La voce con più margine di risparmio è <b>${escapeHtml(peggiore.cat)}</b>: in media ${eur(peggiore.eccesso)}/mese oltre il budget previsto.`});
  }

  return consigli.slice(0, 5);
}

// ============================================================
// CALCOLATORE STIPENDIO NETTO — motore di calcolo
// Stima IRPEF, contributi, regime "rientro dei cervelli" (art. 44
// DL 78/2010, 90% esente 2019-2030), detrazioni lavoro dipendente.
// I parametri (aliquote, tabelle stipendiali) sono tutti modificabili
// in Admin: questi sono valori indicativi, non consulenza fiscale.
// ============================================================
function calcolaIrpefScaglioni(imponibile){
  if (imponibile <= 0) return 0;
  if (imponibile <= 28000) return imponibile * 0.23;
  if (imponibile <= 50000) return 28000*0.23 + (imponibile-28000)*0.35;
  return 28000*0.23 + 22000*0.35 + (imponibile-50000)*0.43;
}

// Formula indicativa delle detrazioni da lavoro dipendente (Art. 13 TUIR, semplificata)
function calcolaDetrazioniLavoroDipendente(imponibile){
  if (imponibile <= 0) return 0;
  if (imponibile <= 15000) return Math.max(690, imponibile>0 ? 1955 * (imponibile/15000) : 0);
  if (imponibile <= 28000) return 1910 + 1190 * (28000-imponibile)/13000;
  if (imponibile <= 50000) return 1910 * (50000-imponibile)/22000;
  return 0;
}

// Scompone il lordo annuo nelle sue componenti. Per la scuola il tabellare è su
// 12 mensilità, la tredicesima è 1/12 del tabellare, e la RPD è una voce a sé
// (12 mensilità, fasce di anzianità proprie, esclusa dalla tredicesima).
function componentiLordo(persona, anno){
  const anniServizio = Math.max(0, anno - persona.annoInizioRuolo);
  if (persona.tipo === "universita") {
    const classe = Math.floor(anniServizio / (persona.scattoIntervallo||2));
    const riga = persona.tabella[Math.min(classe, persona.tabella.length-1)];
    const tabellare = riga ? riga.lordoAnnuo : 0;
    return {anniServizio, tabellare, tredicesima: 0, rpdAnnuo: 0, totale: tabellare};
  }
  const riga = persona.tabella.find(f => anniServizio >= f.da && anniServizio <= f.a) || persona.tabella[persona.tabella.length-1];
  let tabellare = riga ? (riga.tiers ? valoreScaglione(riga.tiers, anno) : riga.lordoAnnuo) : 0;
  const tabellaRpd = persona.rpd || DEFAULT_RPD_SCUOLA;
  const rigaRpd = tabellaRpd.find(f => anniServizio >= f.da && anniServizio <= f.a) || tabellaRpd[tabellaRpd.length-1];
  let rpdMensile = rigaRpd ? (rigaRpd.tiers ? valoreScaglione(rigaRpd.tiers, anno) : rigaRpd.mensile) : 0;
  // Il vecchio meccanismo "aumentoCCNL" (stima approssimata) si applica solo alle
  // righe che NON hanno ancora gli scaglioni ufficiali (dati precedenti al CCNL
  // caricato) — per le righe con "tiers" i numeri reali sono già corretti per anno.
  const aum = persona.aumentoCCNL;
  if (aum && anno >= aum.annoEffetto && !(riga && riga.tiers)) {
    tabellare = tabellare * (1 + (aum.tabellarePct||0)/100);
  }
  if (aum && anno >= aum.annoEffetto && !(rigaRpd && rigaRpd.tiers)) {
    rpdMensile = rpdMensile + (aum.rpdDeltaMensile||0);
  }
  const tredicesima = persona.tredicesima === false ? 0 : tabellare/12;
  const rpdAnnuo = rpdMensile * 12;
  return {anniServizio, tabellare, tredicesima, rpdAnnuo, totale: tabellare + tredicesima + rpdAnnuo};
}

function trovaLordoAnnuo(persona, anno){
  return componentiLordo(persona, anno).totale;
}

function calcolaAnnoStipendio(persona, anno, cfg){
  const comp = componentiLordo(persona, anno);
  const lordoAnnuo = comp.totale;
  const contributiInps = lordoAnnuo * (cfg.inpsAliquota/100);
  const imponibilePieno = lordoAnnuo - contributiInps;
  const agevolato = anno >= cfg.rientroCervelli.annoInizio && anno <= cfg.rientroCervelli.annoFine;
  const imponibileIrpef = agevolato ? imponibilePieno * (1 - cfg.rientroCervelli.percentuale/100) : imponibilePieno;
  const irpefLorda = calcolaIrpefScaglioni(imponibileIrpef);
  const detrazioni = calcolaDetrazioniLavoroDipendente(imponibileIrpef);
  const irpefNetta = Math.max(0, irpefLorda - detrazioni);
  const addizionali = imponibileIrpef * ((cfg.addizionaleRegionale + cfg.addizionaleComunale)/100);
  const nettoAnnuo = lordoAnnuo - contributiInps - irpefNetta - addizionali;
  return {
    anno, anniServizio: comp.anniServizio, lordoAnnuo, contributiInps, imponibileIrpef, irpefNetta, addizionali,
    nettoAnnuo, nettoMensile12: nettoAnnuo/12, agevolato,
    tabellare: comp.tabellare, tredicesima: comp.tredicesima, rpdAnnuo: comp.rpdAnnuo
  };
}

// Detrazione ristrutturazione edilizia (o altro bonus casa a rate fisse): la quota
// annua è fissa per legge (spesa × % / n. rate), ma si può recuperare solo fino alla
// capienza IRPEF di quell'anno — l'eventuale eccedenza NON si riporta agli anni
// successivi oltre alle rate previste: va persa in modo definitivo.
// Piano di ammortamento "alla francese" (rata costante), simulato mese per mese
// per poter gestire le estinzioni anticipate parziali (che ricalcolano la rata
// o accorciano la durata a seconda della modalità scelta).
function pianoAmmortamentoDettagliato(det){
  const tassoMensile = (det.tassoAnnuo/100)/12;
  let mesiResiduiTotali = det.durataAnni*12;
  let rata = tassoMensile===0 ? det.importoMutuo/mesiResiduiTotali : det.importoMutuo * tassoMensile / (1-Math.pow(1+tassoMensile,-mesiResiduiTotali));
  let capitale = det.importoMutuo;
  const eventi = (det.estinzioniAnticipate||[]).slice().sort((a,b)=> (a.anno*12+a.mese)-(b.anno*12+b.mese));
  let eventoIdx = 0;
  const righe = [];
  let anno = det.annoInizio, mese = 1;
  let mesiTrascorsi = 0;
  const limiteSicurezza = det.durataAnni*12 + 12; // evita loop infiniti in casi limite
  while (capitale > 0.5 && mesiTrascorsi < limiteSicurezza){
    const interesse = capitale * tassoMensile;
    let quotaCapitale = rata - interesse;
    if (quotaCapitale > capitale) quotaCapitale = capitale;
    capitale = Math.max(0, capitale - quotaCapitale);
    let estinzioneExtra = 0, modalitaApplicata = null;
    while (eventoIdx < eventi.length && eventi[eventoIdx].anno===anno && eventi[eventoIdx].mese===mese){
      const ev = eventi[eventoIdx];
      const extra = Math.min(ev.importo, capitale);
      capitale = Math.max(0, capitale - extra);
      estinzioneExtra += extra;
      modalitaApplicata = ev.modalita;
      if (capitale > 0.5){
        const mesiResiduiDopo = mesiResiduiTotali - (mesiTrascorsi+1);
        if (ev.modalita === "riduci_rata" && mesiResiduiDopo > 0){
          rata = tassoMensile===0 ? capitale/mesiResiduiDopo : capitale * tassoMensile / (1-Math.pow(1+tassoMensile,-mesiResiduiDopo));
        }
        // "riduci_durata": la rata resta invariata, il piano si accorcia da sé
      }
      eventoIdx++;
    }
    righe.push({anno, mese, rata, interesse, quotaCapitale, estinzioneExtra, modalitaApplicata, capitaleResiduo: capitale});
    mesiTrascorsi++;
    mese++; if (mese>12){ mese=1; anno++; }
  }
  return righe;
}

// Aggrega il piano mensile per anno solare.
function pianoAmmortamentoAnnuale(det){
  const mensile = pianoAmmortamentoDettagliato(det);
  const map = {};
  mensile.forEach(r => {
    if (!map[r.anno]) map[r.anno] = {anno:r.anno, interessi:0, capitaleRimborsato:0, estinzioniExtra:0, rateMensili:[], capitaleResiduoFine:0};
    map[r.anno].interessi += r.interesse;
    map[r.anno].capitaleRimborsato += r.quotaCapitale;
    map[r.anno].estinzioniExtra += r.estinzioneExtra;
    map[r.anno].rateMensili.push(r.rata);
    map[r.anno].capitaleResiduoFine = r.capitaleResiduo;
  });
  return Object.values(map).sort((a,b)=>a.anno-b.anno).map(a => ({
    ...a, rataMediaMensile: a.rateMensili.reduce((s,v)=>s+v,0)/a.rateMensili.length
  }));
}

function pianoAmmortamentoMutuo(det){
  return pianoAmmortamentoAnnuale(det).map(a => a.interessi);
}

function interessiMutuoAnno(det, annoReale){
  if (annoReale < det.annoInizio) return 0;
  const riga = pianoAmmortamentoAnnuale(det).find(a => a.anno === annoReale);
  return riga ? riga.interessi : 0;
}

// Elenca le quote "lorde" (prima del limite di capienza IRPEF) di tutte le
// detrazioni attive in un dato anno.
function calcolaQuoteDetrazioni(anno, cfg){
  const voci = [];
  const r = cfg.detrazioneRistrutturazione;
  if (r && r.attiva) {
    const annoFine = r.annoInizio + r.anniRateizzazione - 1;
    if (anno >= r.annoInizio && anno <= annoFine) {
      voci.push({tipo:'ristrutturazione', label:'Ristrutturazione', quota: (r.importoSpesa*(r.percentuale/100))/r.anniRateizzazione, applicaA: r.applicaA});
    }
  }
  const m = cfg.detrazioneMutuo;
  if (m && m.attiva) {
    const interessiAnno = interessiMutuoAnno(m, anno);
    if (interessiAnno > 0.5) {
      const base = Math.min(interessiAnno, m.tettoInteressiAnnui);
      voci.push({tipo:'mutuo', label:'Interessi mutuo', quota: base*(m.percentuale/100), applicaA: m.applicaA, interessiAnno});
    }
  }
  return voci;
}

// Applica il limite di capienza IRPEF a tutte le detrazioni attive quell'anno,
// condividendo correttamente la capienza tra voci a carico della stessa persona
// (altrimenti si conterebbe due volte la stessa capacità di detrarre).
function calcolaRecuperoDetrazioni(anno, cfg, capienzaP1, capienzaP2){
  const voci = calcolaQuoteDetrazioni(anno, cfg);
  let residuoP1 = capienzaP1, residuoP2 = capienzaP2;
  const dettaglio = voci.map(v => {
    let capienzaDisp;
    if (v.applicaA === "persona1") capienzaDisp = residuoP1;
    else if (v.applicaA === "persona2") capienzaDisp = residuoP2;
    else capienzaDisp = residuoP1 + residuoP2;
    const recuperato = Math.min(v.quota, Math.max(0, capienzaDisp));
    const perso = v.quota - recuperato;
    if (v.applicaA === "persona1") residuoP1 -= recuperato;
    else if (v.applicaA === "persona2") residuoP2 -= recuperato;
    else {
      const daP1 = Math.min(residuoP1, recuperato);
      residuoP1 -= daP1;
      residuoP2 -= (recuperato - daP1);
    }
    return {...v, recuperato, perso};
  });
  const totaleRecuperato = dettaglio.reduce((s,d)=>s+d.recuperato,0);
  const totalePerso = dettaglio.reduce((s,d)=>s+d.perso,0);
  const totaleQuota = dettaglio.reduce((s,d)=>s+d.quota,0);
  return {dettaglio, totaleRecuperato, totalePerso, totaleQuota, attiva: dettaglio.length>0};
}

// Quota del recupero detrazioni attribuibile a una persona (se "entrambi", 50/50).
function recuperoPerPersona(dettaglio, personaKey){
  return dettaglio.reduce((s,d) => {
    if (d.applicaA === personaKey) return s + d.recuperato;
    if (d.applicaA === "entrambi") return s + d.recuperato/2;
    return s;
  }, 0);
}

function trimmedMean95(vals){
  const clean = vals.filter(v => v!=null);
  if (clean.length === 0) return null;
  if (clean.length <= 3) return clean.reduce((s,v)=>s+v,0)/clean.length;
  const sorted = [...clean].sort((a,b)=>a-b);
  const lower = percentile(sorted, 0.025), upper = percentile(sorted, 0.975);
  const inRange = clean.filter(v => v>=lower && v<=upper);
  const use = inRange.length ? inRange : clean;
  return use.reduce((s,v)=>s+v,0)/use.length;
}

function prevMonth(y,m){ m--; if (m<1){m=12;y--;} return [y,m]; }

function aggiornaImportoRicorrente(gid, nuovoImporto, daAnno, daMese){
  const segs = state.ricorrenti.filter(r => r.gruppoId===gid);
  const open = segs.find(r => !r.alAnno);
  if (open) {
    const [py, pm] = prevMonth(daAnno, daMese);
    if (py < open.dalAnno || (py===open.dalAnno && pm < open.dalMese)) {
      // il nuovo inizio è prima o uguale al segmento aperto: aggiorna direttamente l'importo del segmento aperto
      open.importo = nuovoImporto;
    } else {
      open.alAnno = py; open.alMese = pm;
      state.ricorrenti.push({id:uid(), gruppoId:gid, categoria:open.categoria, descrizione:open.descrizione,
        importo:nuovoImporto, dalAnno:daAnno, dalMese:daMese, alAnno:null, alMese:null});
    }
  } else {
    state.ricorrenti.push({id:uid(), gruppoId:gid, categoria:segs[0].categoria, descrizione:segs[0].descrizione,
      importo:nuovoImporto, dalAnno:daAnno, dalMese:daMese, alAnno:null, alMese:null});
  }
  // rimuove eventuali movimenti auto-generati futuri con importo vecchio che ricadono nel nuovo segmento
  const idsRimossi = [];
  state.transazioni = state.transazioni.filter(t => {
    if (t.ricorrenteGruppo !== gid) return true;
    const afterStart = t.anno > daAnno || (t.anno===daAnno && t.mese >= daMese);
    const daRimuovere = afterStart && t.importo !== nuovoImporto;
    if (daRimuovere) idsRimossi.push(t.id);
    return !daRimuovere;
  });
  saveRicorrenti();
  salvaMovimentiBulk([], idsRimossi);
  generaMovimentiRicorrenti();
}

function interrompiRicorrente(gid, alAnno, alMese){
  const segs = state.ricorrenti.filter(r => r.gruppoId===gid);
  const open = segs.find(r => !r.alAnno);
  if (open) { open.alAnno = alAnno; open.alMese = alMese; }
  // rimuove i movimenti auto-generati oltre la data di stop
  const idsRimossi = [];
  state.transazioni = state.transazioni.filter(t => {
    if (t.ricorrenteGruppo !== gid) return true;
    const afterStop = t.anno > alAnno || (t.anno===alAnno && t.mese > alMese);
    if (afterStop) idsRimossi.push(t.id);
    return !afterStop;
  });
  saveRicorrenti();
  salvaMovimentiBulk([], idsRimossi);
}

  const oggiAnno = new Date().getFullYear();
  const p1 = cfg.persona1, p2 = cfg.persona2;
  const oggi1 = calcolaAnnoStipendio(p1, oggiAnno, cfg);
  const oggi2 = calcolaAnnoStipendio(p2, oggiAnno, cfg);
  const totaleOggi = oggi1.nettoMensile12 + oggi2.nettoMensile12;
  const detrOggi = calcolaRecuperoDetrazioni(oggiAnno, cfg, oggi1.irpefNetta, oggi2.irpefNetta);
  const recuperoOggiP1 = recuperoPerPersona(detrOggi.dettaglio, "persona1");
  const recuperoOggiP2 = recuperoPerPersona(detrOggi.dettaglio, "persona2");
  const oggi1ConDetrazioni = oggi1.nettoMensile12 + recuperoOggiP1/12;
  const oggi2ConDetrazioni = oggi2.nettoMensile12 + recuperoOggiP2/12;

  const anniProiezione = [];
  for (let i=0; i<cfg.orizzonteAnni; i++) anniProiezione.push(oggiAnno+i);
  const righe = anniProiezione.map(anno => {
    const rp1 = calcolaAnnoStipendio(p1, anno, cfg);
    const rp2 = calcolaAnnoStipendio(p2, anno, cfg);
    const detr = calcolaRecuperoDetrazioni(anno, cfg, rp1.irpefNetta, rp2.irpefNetta);
    return {anno, p1: rp1, p2: rp2, detr};
  });

  const agevolazioneAttiva = oggiAnno >= cfg.rientroCervelli.annoInizio && oggiAnno <= cfg.rientroCervelli.annoFine;
  const anniRimastiAgevolazione = agevolazioneAttiva ? cfg.rientroCervelli.annoFine - oggiAnno + 1 : 0;

  const det = cfg.detrazioneRistrutturazione;
  const detTotaleDetraibile = det && det.attiva ? det.importoSpesa * (det.percentuale/100) : 0;
  const soloRistr = (r) => r.detr.dettaglio.filter(d=>d.tipo==='ristrutturazione');
  const detTotaleRecuperato = righe.reduce((s,r)=>s+soloRistr(r).reduce((a,d)=>a+d.recuperato,0), 0);
  const detTotalePerso = righe.reduce((s,r)=>s+soloRistr(r).reduce((a,d)=>a+d.perso,0), 0);

  const mut = cfg.detrazioneMutuo;
  const soloMutuo = (r) => r.detr.dettaglio.filter(d=>d.tipo==='mutuo');
  const mutTotaleQuota = righe.reduce((s,r)=>s+soloMutuo(r).reduce((a,d)=>a+d.quota,0), 0);
  const mutTotaleRecuperato = righe.reduce((s,r)=>s+soloMutuo(r).reduce((a,d)=>a+d.recuperato,0), 0);
  const mutTotalePerso = righe.reduce((s,r)=>s+soloMutuo(r).reduce((a,d)=>a+d.perso,0), 0);
  const pianoMutuo = mut && mut.attiva ? pianoAmmortamentoMutuo(mut) : [];
  const interessiTotaliMutuo = pianoMutuo.reduce((s,v)=>s+v,0);

  return `
  <div class="card" style="margin-bottom:20px">
    <h3>Stipendio netto — situazione ${oggiAnno}</h3>
    <p class="sub" style="margin-top:-8px;margin-bottom:16px">Stima calcolata su tabelle stipendiali e aliquote indicative (modificabili in Admin). Non sostituisce il cedolino ufficiale o una consulenza fiscale.</p>
    <div class="summary-grid">
      <div class="card summary-card"><div class="summary-label">${escapeHtml(p1.nome)} — ${escapeHtml(p1.ruolo)}</div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <div class="summary-value" style="font-size:20px;color:${NAVY}">${eur(oggi1.nettoMensile12)}/mese</div>
          ${recuperoOggiP1>0.5 ? `<div style="font-size:13px;color:${GREEN}">+ detrazioni = <b>${eur(oggi1ConDetrazioni)}</b>/mese</div>` : ''}
        </div>
        <div class="sub">Lordo ${eur(oggi1.lordoAnnuo)}/anno · anzianità ${oggi1.anniServizio} anni ${oggi1.agevolato?'· 🎓 rientro cervelli attivo':''}</div>
      </div>
      <div class="card summary-card"><div class="summary-label">${escapeHtml(p2.nome)} — ${escapeHtml(p2.ruolo)}</div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <div class="summary-value" style="font-size:20px;color:${NAVY}">${eur(oggi2.nettoMensile12)}/mese</div>
          ${recuperoOggiP2>0.5 ? `<div style="font-size:13px;color:${GREEN}">+ detrazioni = <b>${eur(oggi2ConDetrazioni)}</b>/mese</div>` : ''}
        </div>
        <div class="sub">Lordo ${eur(oggi2.lordoAnnuo)}/anno · anzianità ${oggi2.anniServizio} anni ${oggi2.agevolato?'· 🎓 rientro cervelli attivo':''}</div>
        <div class="sub" style="font-size:11px;margin-top:4px">Tabellare ${eur(oggi2.tabellare)} + 13ª ${eur(oggi2.tredicesima)} + RPD ${eur(oggi2.rpdAnnuo)} (${eur(oggi2.rpdAnnuo/12)}/mese)</div>
      </div>
      <div class="card summary-card"><div class="summary-label">Totale famiglia</div>
        <div class="summary-value" style="font-size:20px;color:${GREEN}">${eur(totaleOggi)}/mese</div>
        <div class="sub">Netto combinato, su 12 mensilità</div>
      </div>
    </div>
    ${agevolazioneAttiva ? `<p class="sub" style="margin-top:14px;margin-bottom:0">🎓 Regime "rientro dei cervelli" attivo fino al ${cfg.rientroCervelli.annoFine} (ancora ${anniRimastiAgevolazione} anni), poi la tassazione torna piena.</p>` : ''}
  </div>

  ${det && det.attiva ? `
  <div class="card" style="margin-bottom:20px">
    <h3>Detrazione ristrutturazione edilizia</h3>
    <p class="sub" style="margin-top:-8px;margin-bottom:14px">Spesa ${eur(det.importoSpesa)} al ${det.percentuale}% = ${eur(detTotaleDetraibile)} detraibili in ${det.anniRateizzazione} rate annuali fisse da ${eur(detTotaleDetraibile/det.anniRateizzazione)} (${det.annoInizio}–${det.annoInizio+det.anniRateizzazione-1}), a carico di ${det.applicaA==="entrambi"?"entrambi (capienza sommata)":escapeHtml(cfg[det.applicaA].nome)}.</p>
    <div class="summary-card" style="max-width:260px">
      <div class="summary-label">Recuperabile stimato (totale)</div>
      <div class="summary-value" style="font-size:18px;color:${GREEN}">${eur(detTotaleRecuperato)}</div>
      <div class="sub">su ${eur(detTotaleDetraibile)} totali</div>
    </div>
  </div>` : ''}

  ${mut && mut.attiva ? `
  <div class="card" style="margin-bottom:20px">
    <div class="card-title-row"><h3 style="margin-bottom:0">Detrazione interessi mutuo prima casa</h3>
      <button class="range-btn" id="toggleDettaglioMutuo">${state.mostraDettaglioMutuo ? 'Nascondi dettaglio' : 'Vedi dettaglio mutuo'}</button></div>
    <p class="sub" style="margin-top:-8px;margin-bottom:14px">Mutuo ${eur(mut.importoMutuo)} al ${mut.tassoAnnuo}% su ${mut.durataAnni} anni dal ${mut.annoInizio}, piano di ammortamento a rata costante — gli interessi (e quindi la detrazione) calano di anno in anno. Detraibile il ${mut.percentuale}% degli interessi, fino a un tetto di ${eur(mut.tettoInteressiAnnui)}/anno (quindi max ${eur(mut.tettoInteressiAnnui*mut.percentuale/100)}/anno), a carico di ${mut.applicaA==="entrambi"?"entrambi (capienza sommata)":escapeHtml(cfg[mut.applicaA].nome)}.</p>
    <div class="summary-grid">
      <div class="card summary-card" style="box-shadow:none;border:1px solid var(--border)">
        <div class="summary-label">Interessi totali sul mutuo</div>
        <div class="summary-value" style="font-size:18px;color:${NAVY}">${eur(interessiTotaliMutuo)}</div>
        <div class="sub">su tutta la durata effettiva</div>
      </div>
      <div class="card summary-card" style="box-shadow:none;border:1px solid var(--border)">
        <div class="summary-label">Recuperabile stimato (${cfg.orizzonteAnni} anni proiettati)</div>
        <div class="summary-value" style="font-size:18px;color:${GREEN}">${eur(mutTotaleRecuperato)}</div>
        <div class="sub">su ${eur(mutTotaleQuota)} potenzialmente detraibili</div>
      </div>
    </div>
    ${state.mostraDettaglioMutuo ? renderDettaglioMutuo(mut, cfg) : ''}
  </div>` : ''}

  <div class="card">
    <h3>Evoluzione anno per anno</h3>
    <p class="sub" style="margin-top:-8px;margin-bottom:14px">Proiezione su ${cfg.orizzonteAnni} anni in base agli scatti di anzianità previsti e al regime fiscale applicabile in ciascun anno.</p>
    <table class="report-table">
      <thead><tr><th>Anno</th><th>${escapeHtml(p1.nome)}<br>lordo/anno</th><th>${escapeHtml(p1.nome)}<br>netto/mese</th><th>${escapeHtml(p2.nome)}<br>lordo/anno<br><span style="font-weight:400">(tabellare + 13ª + RPD)</span></th><th>${escapeHtml(p2.nome)}<br>netto/mese</th><th>Totale netto/mese</th><th>Recupero<br>detrazioni</th><th>Regime</th></tr></thead>
      <tbody>
        ${righe.map(r => {
          const tot = r.p1.nettoMensile12 + r.p2.nettoMensile12;
          const ccnlAttivo = p2.aumentoCCNL && r.anno >= p2.aumentoCCNL.annoEffetto;
          let regime = r.p1.agevolato || r.p2.agevolato ? '🎓 agevolato' : '—';
          if (ccnlAttivo && r.anno === p2.aumentoCCNL.annoEffetto) regime += '<br>📈 CCNL 2027';
          const detCell = r.detr.attiva ? `<span style="color:${GREEN}">${eur(r.detr.totaleRecuperato)}</span>` : '<span class="sub">—</span>';
          const recP1 = recuperoPerPersona(r.detr.dettaglio, "persona1");
          const recP2 = recuperoPerPersona(r.detr.dettaglio, "persona2");
          const p1NettoCell = recP1>0.5 ? `${eur(r.p1.nettoMensile12)}<br><span class="sub" style="color:${GREEN}">${eur(r.p1.nettoMensile12+recP1/12)} con detr.</span>` : eur(r.p1.nettoMensile12);
          const p2NettoCell = recP2>0.5 ? `${eur(r.p2.nettoMensile12)}<br><span class="sub" style="color:${GREEN}">${eur(r.p2.nettoMensile12+recP2/12)} con detr.</span>` : eur(r.p2.nettoMensile12);
          return `<tr>
            <td style="font-weight:600">${r.anno}</td>
            <td>${eur(r.p1.lordoAnnuo)}</td><td>${p1NettoCell}</td>
            <td title="Tabellare ${eur(r.p2.tabellare)} + 13ª ${eur(r.p2.tredicesima)} + RPD ${eur(r.p2.rpdAnnuo)}">${eur(r.p2.lordoAnnuo)}</td><td>${p2NettoCell}</td>
            <td style="font-weight:700;color:${GREEN}">${eur(tot)}</td>
            <td style="font-size:12px">${detCell}</td>
            <td style="font-size:11px">${regime}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <p class="sub" style="margin-top:12px;margin-bottom:0">Passa il mouse sull'importo recuperato per il dettaglio per voce. Per modificare tabelle stipendiali, aliquote, il regime agevolato o le detrazioni, vai in Admin → "Configurazione stipendi".</p>
  </div>
  `;
}


function renderRicorrentiView(){
  const groups = {};
  state.ricorrenti.forEach(r => {
    if (!groups[r.gruppoId]) groups[r.gruppoId] = [];
    groups[r.gruppoId].push(r);
  });
  const groupIds = Object.keys(groups).sort((a,b) => {
    const fa = groups[a][0], fb = groups[b][0];
    return (fa.descrizione||"").localeCompare(fb.descrizione||"");
  });

  return `
  <div class="card" style="margin-bottom:20px">
    <div class="card-title-row"><h3 style="margin-bottom:0">Spese ed entrate ricorrenti</h3>
      <button class="add-btn" id="openAddRicorrente">+ Nuova ricorrenza</button></div>
    <p class="sub" style="margin-top:-8px;margin-bottom:16px">Le voci ricorrenti si riportano da sole ogni mese con lo stesso importo, fino ad oggi. Se l'importo cambia, usa "Aggiorna importo": lo storico resta invariato, solo i mesi da lì in poi useranno il nuovo valore.</p>
    ${groupIds.length===0 ? '<p class="empty">Nessuna voce ricorrente configurata.</p>' : groupIds.map(gid => {
      const segs = groups[gid].sort((a,b)=> a.dalAnno-b.dalAnno || a.dalMese-b.dalMese);
      const first = segs[0];
      const isEntrata = first.categoria === "Entrate";
      return `<div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div><span style="font-weight:700">${escapeHtml(first.descrizione)}</span>
            <span class="sub" style="margin-left:8px">${escapeHtml(first.categoria)}</span></div>
          <div style="display:flex;gap:6px">
            <button class="range-btn" data-update-gruppo="${gid}">Aggiorna importo</button>
            <button class="range-btn" data-stop-gruppo="${gid}">Interrompi</button>
            <button class="admin-del" data-delete-gruppo="${gid}">&#128465;</button>
          </div>
        </div>
        ${segs.map(s => `<div style="font-size:12px;color:var(--muted);padding:2px 0">
          ${meseAnnoLabel(s.dalAnno,s.dalMese)} &rarr; ${s.alAnno ? meseAnnoLabel(s.alAnno,s.alMese) : 'in corso'}
          <span style="font-family:ui-monospace,monospace;font-weight:700;color:${isEntrata?GREEN:RUST};margin-left:8px">${eur(s.importo)}</span>
        </div>`).join('')}
      </div>`;
    }).join('')}
  </div>
  <div id="ricorrentiModalRoot"></div>
  `;
}

const ALLEGATO_MAX_BYTES = 700000; // ~700KB: resta sotto il limite di 1MB per documento Firestore una volta convertito in base64

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // già in formato data: URL
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function salvaAllegato(file){
  if (!db) throw new Error("Cloud non disponibile");
  const dataUrl = await fileToBase64(file);
  const id = uid();
  await db.collection("bilancio_familiare_allegati").doc(id).set({
    data: dataUrl, nome: file.name, createdAt: Date.now()
  });
  return id;
}

async function eliminaAllegato(id){
  if (!db || !id) return;
  try { await db.collection("bilancio_familiare_allegati").doc(id).delete(); } catch(e) { console.error("Errore eliminazione allegato", e); }
}

function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(",");
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : "application/pdf";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type: mime});
}

async function apriAllegato(id){
  if (!db) { alert("Cloud non disponibile: impossibile aprire l'allegato."); return; }
  try {
    const doc = await db.collection("bilancio_familiare_allegati").doc(id).get();
    if (!doc.exists) { alert("Allegato non trovato (potrebbe essere stato rimosso)."); return; }
    const blob = dataUrlToBlob(doc.data().data);
    const blobUrl = URL.createObjectURL(blob);
    window.open(blobUrl, "_blank");
    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
  } catch(e) { alert("Errore nell'apertura dell'allegato: " + e.message); }
}

function aggiornaSuggerimentiDescrizione(){
  const catSel = document.getElementById("formCategoria");
  const datalist = document.getElementById("descrizioneSuggestions");
  if (!catSel || !datalist) return;
  const cat = catSel.value;
  const counts = {};
  state.transazioni.forEach(t => {
    if (t.categoria !== cat) return;
    const key = t.descrizione.trim();
    if (!key) return;
    counts[key] = (counts[key]||0) + 1;
  });
  const suggestions = Object.keys(counts).sort((a,b) => counts[b]-counts[a]).slice(0, 20);
  datalist.innerHTML = suggestions.map(s => `<option value="${escapeHtml(s)}"></option>`).join('');
}

function checkBudgetLive(excludeId){
  const catSel = document.getElementById("formCategoria");
  const impInput = document.getElementById("formImporto");
  const meseSel = document.getElementById("formMese");
  const annoInput = document.getElementById("formAnno");
  const warnDiv = document.getElementById("formBudgetWarning");
  if (!catSel || !warnDiv) return;
  const cat = catSel.value;
  const importo = parseImporto(impInput.value) || 0;
  const mese = Number(meseSel.value), anno = Number(annoInput.value);
  if (!state.categorieBudget.includes(cat) || !importo) { warnDiv.innerHTML = ""; return; }
  const previsto = ((state.budgetAnnuale[anno]||{})[cat] || 0) / 12;
  if (!previsto) { warnDiv.innerHTML = ""; return; }
  const speso = state.transazioni.filter(t => t.anno===anno && t.mese===mese && t.categoria===cat && t.id!==excludeId).reduce((s,t)=>s+t.importo,0);
  const totale = speso + importo;
  if (totale > previsto) {
    warnDiv.innerHTML = `<div style="background:#FBEEEC;border:1px solid ${RUST};border-radius:6px;padding:8px 10px;font-size:12px;color:${RUST}">
      &#9888; Con questo movimento, "${escapeHtml(cat)}" arriva a ${eur(totale)} contro un budget di ${eur(previsto)}/mese (${eur(totale-previsto)} in più).
    </div>`;
  } else {
    warnDiv.innerHTML = "";
  }
}

function attachHandlers(){

    if (filterSel) filterSel.onchange = e => { state.filterCat = e.target.value; render(); };

    if (allHistChk) allHistChk.onchange = e => { state.searchAllHistory = e.target.checked; render(); };
    document.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = () => {
        const id = b.dataset.del;
        if (state.pendingDeleteId === id) {
          clearTimeout(window._timeoutConfermaCancellazione);
          const t = state.transazioni.find(x => x.id === id);
          if (t && t.ricorrenteGruppo) {
            const rule = state.ricorrenti.find(r => r.gruppoId === t.ricorrenteGruppo);
            if (rule) {
              if (!rule.mesiSaltati) rule.mesiSaltati = [];
              if (!rule.mesiSaltati.some(s => s.anno===t.anno && s.mese===t.mese)) rule.mesiSaltati.push({anno: t.anno, mese: t.mese});
              saveRicorrenti();
            }
          }
          state.pendingDeleteId = null;
          cancellaMovimento(id);
          render();
          return;
        }
        // Prima pressione: chiedo conferma tramite lo stato dell'app (non una modifica
        // diretta del bottone), così sopravvive anche se nel frattempo arriva un
        // ridisegno automatico dovuto alla sincronizzazione col cloud.
        state.pendingDeleteId = id;
        render();
        clearTimeout(window._timeoutConfermaCancellazione);
        window._timeoutConfermaCancellazione = setTimeout(() => {
          if (state.pendingDeleteId === id) { state.pendingDeleteId = null; render(); }
        }, 4000);
      };
    });
    document.querySelectorAll("[data-mark-recurrent]").forEach(b => b.onclick = () => {
      const t = state.transazioni.find(x => x.id === b.dataset.markRecurrent);
      if (!t) { alert("Movimento non trovato, riprova."); return; }
      const gruppoId = uid();
      t.ricorrenteGruppo = gruppoId;
      state.ricorrenti.push({id:uid(), gruppoId, categoria:t.categoria, descrizione:t.descrizione, importo:t.importo, dalAnno:t.anno, dalMese:t.mese, alAnno:null, alMese:null});
      salvaMovimento(t); saveRicorrenti();
      generaMovimentiRicorrenti();
      render();
      alert(`Fatto: "${t.descrizione}" (${eur(t.importo)}) è ora ricorrente. La trovi anche nel tab \u{1F501} Ricorrenti.`);
    });

    const openModalFor = (editTx) => {
      document.getElementById("modalRoot").innerHTML = renderAddModal(editTx);
      document.getElementById("closeModal").onclick = () => { document.getElementById("modalRoot").innerHTML = ""; };
      document.getElementById("modalBg").onclick = (e) => { if (e.target.id==="modalBg") document.getElementById("modalRoot").innerHTML=""; };
      const excludeId = editTx ? editTx.id : null;
      document.getElementById("formCategoria").onchange = () => { checkBudgetLive(excludeId); aggiornaSuggerimentiDescrizione(); };
      document.getElementById("formImporto").oninput = () => checkBudgetLive(excludeId);

      let allegatoRimosso = false;
      let vecchioAllegatoId = null;
      const rimuoviBtn = document.getElementById("rimuoviAllegatoBtn");
      if (rimuoviBtn) rimuoviBtn.onclick = () => {
        allegatoRimosso = true;
        vecchioAllegatoId = rimuoviBtn.dataset.oldAllegatoId || null;

        const categoria = document.getElementById("formCategoria").value;
        const descrizione = document.getElementById("formDescrizione").value.trim();
        const importo = parseImporto(document.getElementById("formImporto").value);
        if (!descrizione) { alert("Scrivi una descrizione."); return; }
        if (!importo || isNaN(importo)) { alert("Inserisci un importo valido (es. 50,00)."); return; }
        const editId = document.getElementById("submitAdd").dataset.editId;

        const file = fileInput && fileInput.files[0];

          target = state.transazioni.find(x => x.id === editId);

        } else {
          target = {id:uid(), anno, mese, categoria, descrizione, importo, createdAt: Date.now(), updatedAt: Date.now()};
          state.transazioni.push(target);
        }
        if (allegatoRimosso) {
          delete target.allegatoId; delete target.allegatoNome;

        }

        if (file) {
          if (!db) {
            alert("Il salvataggio degli allegati richiede la connessione cloud, non disponibile ora. Il movimento è stato salvato senza allegato.");
          } else if (file.type !== "application/pdf") {
            alert("Puoi allegare solo file PDF. Il movimento è stato salvato senza allegato.");

            alert(`Il file è troppo grande (${Math.round(file.size/1024)}KB). Il limite è circa ${Math.round(ALLEGATO_MAX_BYTES/1024)}KB — prova a comprimere il PDF o scansionarlo a risoluzione più bassa. Il movimento è stato salvato senza allegato.`);
          } else {
            if (statusDiv) statusDiv.textContent = "Caricamento allegato...";

              const id = await salvaAllegato(file);

              target.allegatoNome = file.name;

function renameCategoria(oldName, newName){
  const idx = state.categorie.indexOf(oldName);
  if (idx>-1) state.categorie[idx] = newName;
  const bidx = state.categorieBudget.indexOf(oldName);
  if (bidx>-1) state.categorieBudget[bidx] = newName;
  const modificati = [];
  state.transazioni.forEach(t => { if (t.categoria===oldName) { t.categoria = newName; t.updatedAt = Date.now(); modificati.push(t); } });
  Object.keys(state.budgetAnnuale).forEach(y => {
    const yr = state.budgetAnnuale[y];
    if (yr && Object.prototype.hasOwnProperty.call(yr, oldName)) { yr[newName] = yr[oldName]; delete yr[oldName]; }
  });
  if (state.filterCat === oldName) state.filterCat = newName;
  saveCategorie(); saveCategorieBudget(); saveBudget();
  salvaMovimentiBulk(modificati, []);
  render();
}

// Riporta i movimenti "storici" (senza createdAt) agli id canonici "seed-N" in
// base al contenuto (anno/mese/categoria/descrizione/importo), e individua le
// copie IN ECCESSO rispetto a quante volte quel contenuto compare davvero
// nell'elenco originale TX_SEED — così, a differenza di un semplice conteggio
// "più di uno = duplicato", non tocca mai spese genuinamente identiche per
// coincidenza che erano già presenti nello storico originale. Non tocca mai le
// voci inserite/modificate dall'utente (hanno sempre createdAt).
function analizzaStoricoENormalizza(lista){
  const indiceSeed = {};
  TX_SEED.forEach((t,i) => {
    const chiave = `${t[0]}|${t[1]}|${t[2]}|${t[3]}|${t[4]}`;
    (indiceSeed[chiave] = indiceSeed[chiave] || []).push("seed-"+i);
  });
  const usati = new Set();
  lista.forEach(t => { if (t.id && t.id.indexOf("seed-")===0) usati.add(t.id); });
  const rinominati = []; // {vecchioId, oggetto}
  const daRimuovere = [];
  lista.forEach(t => {
    if (t.createdAt) return;
    if (t.id && t.id.indexOf("seed-")===0) return;
    const chiave = `${t.anno}|${t.mese}|${t.categoria}|${t.descrizione}|${t.importo}`;
    const candidati = indiceSeed[chiave];
    if (!candidati) return; // non fa parte dello storico originale (es. da una ricorrenza): non toccare
    const libero = candidati.find(id => !usati.has(id));
    if (libero) { const vecchioId = t.id; t.id = libero; usati.add(libero); rinominati.push({vecchioId, oggetto:t}); }
    else { daRimuovere.push(t.id); } // tutti i posti "legittimi" per questo contenuto sono gia occupati: copia in eccesso
  });
  return {rinominati, daRimuovere};
}

// Stesso principio applicato alle voci generate dalle ricorrenze: se esistono
// piu righe con lo stesso gruppo ricorrente + anno + mese (create da dispositivi
// diversi con id vecchi non deterministici), ne tiene solo una - quella con
// createdAt piu vecchio, cioe la "prima" mai creata - e riporta il suo id alla
// forma deterministica cosi non puo piu ri-duplicarsi in futuro.
// Se in passato si sono duplicate le REGOLE ricorrenti stesse (non solo le
// transazioni che generano) - es. due regole "Stipendio Chiara" con id diversi,
// create indipendentemente da due dispositivi prima che la sincronizzazione
// delle regole fosse sicura - ogni regola genera le proprie transazioni "gemelle"
// con ricorrenteGruppo diversi: la riconciliazione per mese non le riconosce
// come collegate. Qui le regole duplicate vengono unificate PRIMA: si tiene una
// sola regola "canonica" e le transazioni delle regole scartate vengono
// ri-agganciate ad essa, cosi la riconciliazione successiva le collassa insieme.
function unificaRegoleRicorrentiDuplicate(lista){
  const gruppi = {};
  state.ricorrenti.forEach(r => {
    const chiave = `${r.categoria}|${r.descrizione}|${r.importo}|${r.dalAnno}|${r.dalMese}`;
    (gruppi[chiave] = gruppi[chiave] || []).push(r);
  });
  let cambiato = false;
  const modificati = [];
  Object.values(gruppi).forEach(arr => {
    if (arr.length <= 1) return;
    arr.sort((a,b) => a.id < b.id ? -1 : 1); // ordine deterministico: stesso risultato su ogni dispositivo
    const canonica = arr[0];
    arr.slice(1).forEach(duplicata => {
      lista.forEach(t => { if (t.ricorrenteGruppo === duplicata.gruppoId) { t.ricorrenteGruppo = canonica.gruppoId; t.updatedAt = Date.now(); modificati.push(t); } });
    });
    state.ricorrenti = state.ricorrenti.filter(r => r === canonica || !arr.includes(r));
    cambiato = true;
  });
  return {cambiato, modificati};
}

function riconciliaRicorrenzeDuplicate(lista){
  const gruppi = {};
  lista.forEach(t => {
    if (!t.ricorrenteGruppo) return;
    const chiave = `${t.ricorrenteGruppo}|${t.anno}|${t.mese}`;
    (gruppi[chiave] = gruppi[chiave] || []).push(t);
  });
  const rinominati = [];
  const daRimuovere = [];
  Object.entries(gruppi).forEach(([chiave, arr]) => {
    if (arr.length <= 1) return;
    arr.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    const [gruppoId, anno, mese] = chiave.split("|");
    const idCanonico = "ric-" + gruppoId + "-" + anno + "-" + mese;
    const sopravvissuto = arr.find(t => t.id === idCanonico) || arr[0];
    if (sopravvissuto.id !== idCanonico) { const vecchioId = sopravvissuto.id; sopravvissuto.id = idCanonico; rinominati.push({vecchioId, oggetto:sopravvissuto}); }
    arr.forEach(t => { if (t !== sopravvissuto) daRimuovere.push(t.id); });
  });
  return {rinominati, daRimuovere};
}

// Calcola tutta la pulizia necessaria su un elenco di movimenti (id storici da
// normalizzare, doppioni da rimuovere, regole ricorrenti duplicate da unificare)
// SENZA toccare lo stato globale ne la rete: restituisce l'elenco pulito piu le
// operazioni da applicare. Usata sia dal controllo manuale in Admin sia dalla
// migrazione una tantum al nuovo formato "un documento per movimento".
function calcolaPuliziaCompleta(listaOriginale){
  let lista = listaOriginale.slice();
  const daScrivere = [];
  const daCancellareSet = new Set();

  const {rinominati, daRimuovere} = analizzaStoricoENormalizza(lista);
  rinominati.forEach(({vecchioId, oggetto}) => { daCancellareSet.add(vecchioId); daScrivere.push(oggetto); });
  daRimuovere.forEach(id => daCancellareSet.add(id));
  lista = lista.filter(t => !daRimuovere.includes(t.id));

  const {modificati} = unificaRegoleRicorrentiDuplicate(lista);
  modificati.forEach(t => daScrivere.push(t));

  const {rinominati: rinominatiRic, daRimuovere: daRimuovereRic} = riconciliaRicorrenzeDuplicate(lista);
  rinominatiRic.forEach(({vecchioId, oggetto}) => { daCancellareSet.add(vecchioId); daScrivere.push(oggetto); });
  daRimuovereRic.forEach(id => daCancellareSet.add(id));
  lista = lista.filter(t => !daRimuovereRic.includes(t.id));

  return {lista, daScrivere, daCancellare: Array.from(daCancellareSet)};
}

// Controllo manuale da Admin: applica la pulizia completa allo stato attuale e
// pubblica le modifiche sul cloud (documento per documento). Con l'archiviazione
// "un documento per movimento" i doppioni non possono piu formarsi da soli in
// modo strutturale: questo resta come rete di sicurezza per casi rari (es. doppio
// clic su "Aggiungi" prima che l'app disabiliti il bottone).
function eseguiPuliziaManuale(){
  const regolePrima = state.ricorrenti.length;
  const risultato = calcolaPuliziaCompleta(state.transazioni);
  state.transazioni = risultato.lista;
  localStorage.setItem("bilancio_transazioni", JSON.stringify(state.transazioni));
  saveRicorrenti();
  salvaMovimentiBulk(risultato.daScrivere, risultato.daCancellare);
  return {
    cambiato: risultato.daScrivere.length > 0 || risultato.daCancellare.length > 0,
    rimossi: risultato.daCancellare.length,
    regoleUnificate: regolePrima - state.ricorrenti.length
  };
}

function esportaCSV(year){
  const rows = [["Anno","Mese","Categoria","Descrizione","Tipo","Importo"]];
  state.transazioni.filter(t => year==="tutti" || t.anno===year)
    .slice().sort((a,b)=> a.anno-b.anno || a.mese-b.mese)
    .forEach(t => {
      rows.push([t.anno, MESI[t.mese-1], t.categoria, t.descrizione, t.categoria==="Entrate"?"Entrata":"Uscita", t.importo.toFixed(2).replace(".",",")]);
    });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `bilancio-${year==="tutti"?"tutti-gli-anni":year}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function importBackup(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!confirm("Importare questo backup? Sovrascriverà i dati attuali su questo dispositivo.")) return;
      state.transazioni = data.transazioni || [];
      state.budgetAnnuale = data.budgetAnnuale || {};
      state.saldoConto = data.saldoConto || {};
      state.categorie = data.categorie || [...DEFAULT_CATEGORIE];
      state.categorieBudget = data.categorieBudget || [...DEFAULT_CATEGORIE_BUDGET];
      state.vociEntrata = data.vociEntrata || [...DEFAULT_VOCI_ENTRATA];
      state.ricorrenti = data.ricorrenti || [];
      state.speseTrimestrali = data.speseTrimestrali || [];
      state.risparmioReset = data.risparmioReset || null;
      state.stipendi = data.stipendi || defaultStipendiConfig();
      localStorage.setItem("bilancio_transazioni", JSON.stringify(state.transazioni));
      saveBudget(); saveSaldo(); saveCategorie(); saveCategorieBudget(); saveVociEntrata(); saveRicorrenti(); saveSpeseTrimestrali(); saveRisparmioReset(); saveStipendi();
      salvaMovimentiBulk(state.transazioni, []); // ripubblica tutti i movimenti importati sulla collezione cloud
      alert("Backup importato con successo.");
      render();
    } catch(err){ alert("File non valido: " + err.message); }
  };
  reader.readAsText(file);
}

function generateReport(){
  const tx = currentTx();
  const entrate = tx.filter(t=>t.categoria==="Entrate").reduce((s,t)=>s+t.importo,0);
  const uscite = tx.filter(t=>t.categoria!=="Entrate").reduce((s,t)=>s+t.importo,0);
  const risparmio = entrate - uscite;

  const scostamenti = calcolaScostamenti(state.selYear, state.selMonth);

// ============================================================
// SICUREZZA: schermo di blocco con password (deterrente base,
// non è crittografia: i dati restano in chiaro nel localStorage)
// ============================================================
async function sha256(text){
  const enc = new TextEncoder().encode("bilancio-salt::" + text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

      <p>Inserisci la password per continuare.</p>
      <input type="password" id="lockPassword" placeholder="Password" autofocus>
      <button id="lockSubmit">Sblocca</button>
      <div class="lock-error" id="lockError"></div>
    </div>`;
  const tryUnlock = async () => {
    const val = document.getElementById("lockPassword").value;
    const hash = localStorage.getItem("bilancio_password_hash");

}

function calcolaScostamenti(year, mese){
  const current = state.budgetAnnuale[year] || {};
  const out = [];
  state.categorieBudget.forEach(cat => {
    const previsto = (current[cat]||0)/12;
    if (!previsto) return;
    const reale = state.transazioni.filter(t=>t.anno===year && t.mese===mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0);
    const diff = reale - previsto; // positivo = hai speso più del previsto (male)
    const soglia = Math.max(50, previsto*0.2);
    if (diff > soglia) out.push({voce:cat, tipo:"uscita", previsto, reale, diff, pct: (diff/previsto)*100});
  });
  state.vociEntrata.forEach(v => {
    const previsto = (current["ENT::"+v]||0)/12;
    if (!previsto) return;
    const reale = state.transazioni.filter(t=>t.anno===year && t.mese===mese && t.categoria==="Entrate" && t.descrizione.toLowerCase().includes(v.toLowerCase())).reduce((s,t)=>s+t.importo,0);
    const diff = reale - previsto; // negativo = hai incassato meno del previsto (male)
    const soglia = Math.max(50, previsto*0.2);
    if (diff < -soglia) out.push({voce:v, tipo:"entrata", previsto, reale, diff, pct: (diff/previsto)*100});
  });
  out.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));
  return out;
}

function maybeShowReminder(){
  const last = localStorage.getItem("bilancio_ultimo_invio");

  if (!banner) return;
