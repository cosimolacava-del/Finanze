<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilancio Familiare</title>
<meta name="description" content="Bilancio familiare personale — entrate, uscite, budget e saldo conto">
<style>
:root{
  --navy:#1F2D3D; --cream:#F7F4EC; --green:#2E7D4F; --rust:#A34A3D; --gold:#B8860B;
  --border:#E5E0D3; --border-soft:#D8D3C4; --muted:#7A7362;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--navy);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}
h1{font-family:ui-serif,Georgia,serif;font-size:28px;font-weight:700;margin:0;letter-spacing:-0.5px;}
.sub{color:var(--muted);font-size:13px;margin:4px 0 24px;}
.header-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tab-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--border-soft);background:transparent;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn:focus-visible,.nav-btn:focus-visible,.add-btn:focus-visible,.range-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(184,134,11,.35);outline-offset:2px;}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;}
.card h3{font-family:ui-serif,Georgia,serif;font-size:16px;font-weight:700;margin:0 0 14px;color:var(--navy);}
.month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:24px;}
.nav-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-soft);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.big-select{font-family:ui-serif,Georgia,serif;font-size:19px;font-weight:700;border:none;background:transparent;color:var(--navy);cursor:pointer;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:26px;}
.summary-card{display:flex;flex-direction:column;gap:6px;}
.summary-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.summary-value{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;}
.two-col{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;align-items:start;}
.three-col{display:grid;grid-template-columns:0.85fr 1fr 1fr;gap:16px;align-items:start;}
@media (max-width:900px){.three-col{grid-template-columns:1fr 1fr;}}
@media (max-width:820px){.two-col{grid-template-columns:1fr;} .summary-grid{grid-template-columns:1fr;} .three-col{grid-template-columns:1fr;}}
@media (max-width:700px){
  .wrap{padding:18px 12px 64px;}
  .header-row{display:block;}
  h1{font-size:25px;margin-bottom:12px;}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{flex:0 0 auto;white-space:nowrap;}
  .card{padding:14px;overflow-x:auto;}
  .month-nav{gap:10px;margin-bottom:18px;}
  .summary-value{font-size:23px;}
  table{min-width:620px;}
  .tx-list{max-height:460px;overscroll-behavior:contain;}
  .tx-desc{max-width:180px;}
  #reminderBanner{align-items:flex-start;}
}
.cat-row{margin-bottom:12px;}
.cat-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.cat-name{font-weight:600;}
.cat-amt{font-family:ui-monospace,Menlo,monospace;}
.bar-bg{height:6px;background:#EAE6D9;border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.tx-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tx-search{position:relative;flex:1;}
.tx-search input{width:100%;padding:7px 8px 7px 26px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;box-sizing:border-box;font-family:inherit;}
.tx-search .icon{position:absolute;left:8px;top:9px;color:var(--muted);font-size:12px;}
select, input{font-family:inherit;}
.tx-controls select{padding:7px 8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.tx-list{max-height:380px;overflow-y:auto;}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin-bottom:6px;border-radius:6px;}
.tx-item.entrata{background:#E9F3E4;}
.tx-item.uscita{background:#FBEEEC;}
.tx-desc{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.tx-cat{font-size:11px;color:var(--muted);}
.tx-amt{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;}
.tx-amt.entrata{color:var(--green);}
.tx-amt.uscita{color:var(--rust);}
.tx-del{border:none;background:none;cursor:pointer;color:#B9B2A0;font-size:14px;padding:2px 6px;}
.add-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.empty{color:#9C9585;font-size:13px;}
.modal-bg{position:fixed;inset:0;background:rgba(31,45,61,0.4);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:#fff;border-radius:12px;padding:24px;width:340px;max-width:90vw;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-close{border:none;background:none;cursor:pointer;font-size:18px;}
.form-grid{display:grid;gap:10px;}
.form-grid input, .form-grid select{padding:9px 10px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;width:100%;box-sizing:border-box;}
.form-row{display:flex;gap:8px;}
.hidden{display:none !important;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:6px 4px;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;}
td{padding:8px 4px;border-bottom:1px solid #EFEBDF;}
.esito{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;}
.range-toggle{display:flex;gap:6px;}
.range-btn{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:#EAE6D9;color:var(--navy);font-family:inherit;}
.range-btn.active{background:var(--navy);color:#fff;}
.budget-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EFEBDF;}
.budget-per-month{font-size:12px;color:#9C9585;font-family:ui-monospace,Menlo,monospace;}
.budget-input-wrap{position:relative;}
.budget-input-wrap span{position:absolute;left:8px;top:8px;font-size:13px;color:#9C9585;}
.budget-input-wrap input{width:120px;padding:6px 8px 6px 20px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;text-align:right;}
.budget-total{display:flex;justify-content:space-between;padding-top:14px;font-weight:700;}
.saldo-input{width:100px;padding:4px 6px;border-radius:5px;border:1px solid var(--border-soft);font-size:12px;}
.footer-note{color:var(--muted);font-size:12px;margin-top:30px;text-align:center;}
.statement-box{margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:10px;background:#FAF9F5;}
.statement-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0;}
.statement-result{margin-top:14px;display:grid;gap:10px;}
.statement-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.statement-kpi{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;}
.statement-kpi small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;}
.statement-kpi b{display:block;margin-top:4px;font-family:ui-monospace,Menlo,monospace;}
.statement-list{max-height:230px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px 10px;}
.statement-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EFEBDF;font-size:12px;}
.statement-row:last-child{border-bottom:0;}
@media(max-width:700px){.statement-summary{grid-template-columns:1fr;}}
.chart-canvas{width:100%;height:280px;display:block;}
.admin-cat-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #EFEBDF;}
.admin-cat-row input[type="text"]{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.admin-cat-row label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
.admin-del{border:none;background:none;cursor:pointer;color:var(--rust);font-size:14px;padding:2px 8px;}
.admin-add-row{display:flex;gap:8px;margin-top:14px;}
.admin-add-row input{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.warn-box{background:#FCEFCB;border:1px solid #E8D28A;border-radius:8px;padding:10px 12px;font-size:12px;color:#8A6D1F;margin-bottom:14px;}
.danger-zone{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);}
.danger-btn{padding:8px 14px;border-radius:6px;border:1px solid var(--rust);background:#fff;color:var(--rust);font-size:12px;font-weight:600;cursor:pointer;}
#printReport{display:none;}
#lockScreen.hidden{display:none;}
#lockScreen{position:fixed;inset:0;background:var(--cream);z-index:200;display:flex;align-items:center;justify-content:center;}
#firebaseAuthScreen.hidden{display:none;}
#firebaseAuthScreen{position:fixed;inset:0;background:var(--cream);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(31,45,61,.14);padding:26px;width:min(390px,100%);}
.auth-card input{width:100%;box-sizing:border-box;margin:6px 0;padding:11px;border:1px solid var(--border);border-radius:7px;font:inherit;}
.lock-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px;width:320px;max-width:90vw;text-align:center;}
.lock-box h2{font-family:ui-serif,Georgia,serif;margin:0 0 6px;color:var(--navy);}
.lock-box p{font-size:12px;color:var(--muted);margin:0 0 18px;}
.lock-box input{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border-soft);font-size:15px;text-align:center;box-sizing:border-box;margin-bottom:10px;}
.lock-box button{width:100%;padding:10px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.lock-error{color:var(--rust);font-size:12px;min-height:16px;margin-top:6px;}
#reminderBanner{background:#FCEFCB;border:1px solid #E8D28A;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#8A6D1F;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
#reminderBanner button{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;}
#reminderBanner .send-btn{background:var(--navy);color:#fff;}
#reminderBanner .dismiss-btn{background:transparent;color:#8A6D1F;text-decoration:underline;}
.header-row{position:sticky;top:0;z-index:30;background:rgba(247,244,236,.94);backdrop-filter:blur(12px);padding:12px 0 10px;margin:-12px 0 0;border-bottom:1px solid rgba(216,211,196,.7);align-items:center;}
.tab-btn{border-color:transparent;border-radius:9px;padding:9px 12px;color:#596575;transition:.18s ease;}
.tab-btn:hover{background:#ECE8DE;color:var(--navy);}
.tab-btn.active{box-shadow:0 4px 12px rgba(31,45,61,.18);}
.tab-btn.admin-tab{margin-left:6px;border-left:1px solid var(--border-soft);border-radius:0 9px 9px 0;}
.dashboard-top{display:grid;grid-template-columns:1.1fr 2fr;gap:14px;margin-bottom:14px;}
.balance-hero{background:linear-gradient(135deg,#1F2D3D 0%,#344A61 100%);color:#fff;border:none;box-shadow:0 10px 28px rgba(31,45,61,.18);}
.balance-hero .summary-label{color:rgba(255,255,255,.68);}
.balance-hero .balance-main{font-family:ui-monospace,Menlo,monospace;font-size:32px;font-weight:800;letter-spacing:-1px;margin:8px 0 4px;}
.balance-hero .balance-meta{font-size:12px;color:rgba(255,255,255,.72);}
.dashboard-top .summary-grid{margin:0;}
.dashboard-top .summary-card{justify-content:center;border:none;box-shadow:0 3px 14px rgba(31,45,61,.06);}
.goals-card{margin-bottom:18px;border:1px solid #D8E8DD;box-shadow:0 5px 18px rgba(46,125,79,.08);overflow:visible;}
.goals-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.goals-head h3{font-family:ui-sans-serif,system-ui,sans-serif;font-size:17px;margin:0;}
.goals-edit{border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:12px;}
.goal-track-wrap{position:relative;padding:28px 0 32px;margin:8px 8px 0;}
.goal-track{height:12px;border-radius:999px;background:#E8E5DD;overflow:hidden;box-shadow:inset 0 1px 2px rgba(31,45,61,.08);}
.goal-track-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#B8860B,#2E7D4F);transition:width .35s ease;}
.goal-marker{position:absolute;top:17px;transform:translateX(-50%);text-align:center;min-width:92px;}
.goal-dot{width:20px;height:20px;border-radius:50%;margin:0 auto 7px;background:#fff;border:4px solid var(--gold);box-shadow:0 2px 7px rgba(31,45,61,.16);}
.goal-marker.done .goal-dot{border-color:var(--green);background:var(--green);}
.goal-marker b{display:block;font-size:12px;white-space:nowrap;}
.goal-marker span{display:block;font-size:10px;color:var(--muted);white-space:nowrap;margin-top:2px;}
.goals-editor{display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:12px;border-top:1px solid var(--border);}
.goals-editor.open{display:flex;}
.tx-item{background:#fff!important;border:1px solid #ECE8DE;border-left:4px solid var(--border-soft);border-radius:9px;transition:.15s ease;}
.tx-item.entrata{border-left-color:var(--green);}.tx-item.uscita{border-left-color:var(--rust);}
.tx-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,45,61,.08);}
.tx-actions .tx-del{opacity:0;transition:.15s ease;}
.tx-item:hover .tx-actions .tx-del,.tx-actions .tx-del:focus{opacity:1;}
.amex-badge{display:inline-flex;border-radius:999px;padding:1px 6px;margin-left:4px;background:#E8EDF8;color:#31558F;font-weight:700;font-size:9px;letter-spacing:.2px;}
.section-toolbar{background:#fff;border:1px solid var(--border);padding:10px;border-radius:10px;box-shadow:0 3px 12px rgba(31,45,61,.04);}
.mobile-more,.mobile-more-menu{display:none;}
.report-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:20px;}
.report-header h1{font-family:ui-serif,Georgia,serif;font-size:24px;margin:0;}
.report-header .meta{font-size:11px;color:var(--muted);text-align:right;}
.report-summary{display:flex;gap:20px;margin-bottom:22px;}
.report-summary div{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.report-summary .lbl{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;}
.report-summary .val{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;}
.report-section-title{font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:700;margin:22px 0 8px;color:var(--navy);}
.report-table{width:100%;border-collapse:collapse;font-size:12px;}
.report-table th{text-align:left;padding:5px 6px;border-bottom:2px solid var(--navy);font-size:10px;text-transform:uppercase;color:var(--muted);}
.report-table td{padding:5px 6px;border-bottom:1px solid #EFEBDF;}
.report-table tr.tot td{border-top:2px solid var(--navy);border-bottom:none;font-weight:700;padding-top:8px;}
@media (max-width:900px){.dashboard-top{grid-template-columns:1fr}.dashboard-top .summary-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:700px){
  .wrap{padding-bottom:94px;}
  .header-row{position:static;border-bottom:none;padding-top:0;}
  .header-row .tabs{position:fixed;z-index:80;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;overflow:visible;box-shadow:0 -5px 20px rgba(31,45,61,.10);}
  .tab-btn{font-size:10px;padding:7px 2px;display:block;overflow:hidden;text-overflow:ellipsis;}
  .tab-btn:nth-child(5),.tab-btn:nth-child(6),.tab-btn:nth-child(7){display:none;}
  .mobile-more{display:block;border:0;background:transparent;color:#596575;font-size:10px;font-weight:700;border-radius:9px;}
  .mobile-more-menu.open{display:grid;position:fixed;z-index:90;right:10px;bottom:68px;width:190px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:7px;box-shadow:0 10px 30px rgba(31,45,61,.20);}
  .mobile-more-menu button{border:0;background:transparent;text-align:left;padding:11px;border-radius:8px;font:600 12px inherit;color:var(--navy);}
  .mobile-more-menu button:hover{background:var(--cream);}
  .tab-btn.admin-tab{margin:0;border:0;border-radius:9px;}
  .dashboard-top .summary-grid{grid-template-columns:repeat(3,1fr);gap:7px;}
  .dashboard-top .summary-card{padding:11px 8px;}
  .dashboard-top .summary-value{font-size:17px;}.dashboard-top .summary-label{font-size:9px;}
  .balance-hero .balance-main{font-size:29px;}
  .goals-head{display:block;}.goals-head>div:last-child{margin-top:5px;}
  .goal-marker{min-width:70px}.goal-marker b{font-size:10px}.goal-marker span{font-size:9px;}
  .tx-actions .tx-del{opacity:1;}
  .tx-controls .add-btn{position:fixed;right:16px;bottom:78px;z-index:75;width:48px;height:48px;border-radius:50%;font-size:0;display:flex;justify-content:center;box-shadow:0 6px 18px rgba(31,45,61,.28);}
  .tx-controls .add-btn::before{content:'+';font-size:27px;font-weight:400;}
}
@media print{
  body *{visibility:hidden;}
  #printReport, #printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;}
  .footer-note{display:none;}
}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

};
let db = null, auth = null, sharedDocRef = null, movimentiColRef = null, cloudReady = false;
try {
  if (typeof firebase !== "undefined") {
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    sharedDocRef = db.collection("bilancio_familiare").doc("shared_data");
    // Ogni movimento è un documento a sé in questa collezione, non più una riga
    // dentro un array unico: cancellare/modificare un movimento tocca SOLO il suo

// Restituisce il valore applicabile a un dato anno da un elenco di scaglioni
// {anno, val}: prende l'ultimo scaglione con "anno" <= anno richiesto (oltre
// l'ultimo scaglione noto, resta fisso su quel valore per mancanza di dati più recenti).
function valoreScaglione(tiers, anno){
  const ordinati = tiers.slice().sort((a,b)=>a.anno-b.anno);
  let scelto = ordinati[0];
  ordinati.forEach(t => { if (t.anno <= anno) scelto = t; });
  return scelto.val;
}

// Ordina "più recenti in alto" usando dati veri, non l'ordine dell'array (che con
// la sincronizzazione a documenti separati non riflette più l'ordine di
// inserimento). Le voci con data di inserimento vera vengono prima, ordinate tra
// loro dalla più recente; le voci storiche (senza createdAt, importate in blocco)
// usano come riferimento stabile l'indice del loro id "seed-N" — che rispecchia
// l'ordine originale della migrazione storica.
function ordinaPerRecenti(arr){
  const indiceSeed = (t) => (t.id && t.id.indexOf("seed-")===0) ? parseInt(t.id.slice(5), 10) : -1;
  return arr.slice().sort((a,b) => {
    // Le ricorrenze sono generate automaticamente: createdAt indica quando il
    // browser le ha materializzate, non quando l'utente le ha registrate. Non
    // devono quindi scavalcare i movimenti inseriti davvero a mano.
    const autoA = !!a.ricorrenteGruppo, autoB = !!b.ricorrenteGruppo;
    if (autoA !== autoB) return autoA ? 1 : -1;
    if (autoA && autoB) {
      const periodoA = (Number(a.anno)||0)*10000 + (Number(a.mese)||0)*100 + (Number(a.giorno)||0);
      const periodoB = (Number(b.anno)||0)*10000 + (Number(b.mese)||0)*100 + (Number(b.giorno)||0);
      if (periodoA !== periodoB) return periodoB - periodoA;
      return String(a.descrizione||"").localeCompare(String(b.descrizione||""), "it");
    }
    const ca = a.createdAt || 0, cb = b.createdAt || 0;
    if (ca !== cb) return cb - ca;
    return indiceSeed(b) - indiceSeed(a);
  });
}

function entrataPrevistaMese(budget, voce, mese){
  // Il valore inserito nel Budget e' una media annua normalizzata su 12 mesi:
  // la tredicesima e' gia compresa e serve solo a ricostruire il flusso di cassa.
  return (budget["ENT::"+voce] || 0) / 12;
}
function flussoStipendioCassa(mediaMensile,tredicesima,mese){
  return Number(mediaMensile||0)-Number(tredicesima||0)/12+(mese===12?Number(tredicesima||0):0);
}

function rettificaTredicesimeCassa(anno, mese){
  const budget = state.budgetAnnuale[anno] || {};
  let rettifica = 0;
  state.vociEntrata.forEach(voce => {
    const tredicesima = Number(budget["13::"+voce] || 0);
    if (!tredicesima) return;
    const cerca = voce.toLowerCase();
    const presente = state.transazioni.some(t => t.anno===anno && t.mese===mese && t.categoria==="Entrate" && String(t.descrizione||"").toLowerCase().includes(cerca));
    if (!presente) return;
    // Movimento registrato = media annua / 12. Sul conto arrivano invece
    // 12 mensilita' ordinarie, piu' la tredicesima nel mese configurato (dicembre).
    rettifica += flussoStipendioCassa(0,tredicesima,mese);
  });
  return rettifica;
}

const PENDING_MOVIMENTI_KEY = "bilancio_pending_movimenti_v1";
function leggiPendingMovimenti(){
  try {
    const p = JSON.parse(localStorage.getItem(PENDING_MOVIMENTI_KEY) || "{}");
    return {set: p.set || {}, del: p.del || {}};
  } catch(e){ return {set:{}, del:{}}; }
}
function salvaPendingMovimenti(p){
  if (Object.keys(p.set).length===0 && Object.keys(p.del).length===0) localStorage.removeItem(PENDING_MOVIMENTI_KEY);
  else localStorage.setItem(PENDING_MOVIMENTI_KEY, JSON.stringify(p));
}
function segnaPendingSet(t){
  const p = leggiPendingMovimenti();
  p.set[t.id] = t; delete p.del[t.id]; salvaPendingMovimenti(p);
}
function segnaPendingDelete(id){
  const p = leggiPendingMovimenti();
  p.del[id] = true; delete p.set[id]; salvaPendingMovimenti(p);
}
function confermaPending(id, tipo){
  const p = leggiPendingMovimenti();
  delete p[tipo][id]; salvaPendingMovimenti(p);
}

// ============================================================
// RICORRENTI: genera automaticamente i movimenti mancanti per ogni
// regola ricorrente attiva, dal mese di inizio fino al mese corrente
// (o fino al mese di fine, se la regola è stata chiusa).
// ============================================================
function monthsBetweenInclusive(y1,m1,y2,m2){
  const out = [];
  let y=y1, m=m1;
  while (y<y2 || (y===y2 && m<=m2)){
    out.push([y,m]);
    m++; if (m>12){ m=1; y++; }
  }
  return out;
}

function generaMovimentiRicorrenti(){
  if (!state.ricorrenti || state.ricorrenti.length===0) return;
  const now = new Date();
  let curY = now.getFullYear(), curM = now.getMonth()+1;
  // estendi la generazione almeno fino al mese che l'utente sta navigando (permette di vedere le ricorrenze anche nei mesi futuri)
  if (state.selYear != null && state.selMonth != null) {
    if (state.selYear > curY || (state.selYear===curY && state.selMonth > curM)) { curY = state.selYear; curM = state.selMonth; }
  }
  const nuoviGenerati = [];

  state.ricorrenti.forEach(rule => {
    const endY = rule.alAnno || curY, endM = rule.alAnno ? rule.alMese : curM;
    // non generare oltre il mese limite (oggi, o il mese navigato se più avanti), anche se la regola è ancora aperta
    let cappedEndY = endY, cappedEndM = endM;
    if (endY > curY || (endY===curY && endM > curM)) { cappedEndY = curY; cappedEndM = curM; }
    if (rule.dalAnno > cappedEndY || (rule.dalAnno===cappedEndY && rule.dalMese > cappedEndM)) return;

    const months = monthsBetweenInclusive(rule.dalAnno, rule.dalMese, cappedEndY, cappedEndM);
    months.forEach(([y,m]) => {
      // id deterministico (gruppo+anno+mese): se due dispositivi generano la
      // stessa ricorrenza per lo stesso mese prima di sincronizzarsi, ottengono
      // comunque lo stesso id, quindi la sincronizzazione non può duplicarla.
      const idDeterministico = "ric-" + rule.gruppoId + "-" + y + "-" + m;
      const saltato = (rule.mesiSaltati||[]).some(s => s.anno===y && s.mese===m);
      if (saltato) return; // l'utente ha cancellato apposta questo mese: non ricrearlo
      const exists = state.transazioni.some(t => t.id===idDeterministico || (t.ricorrenteGruppo===rule.gruppoId && t.anno===y && t.mese===m));
      if (!exists){
        const nuovo = {
          id: idDeterministico, anno:y, mese:m, categoria:rule.categoria, descrizione:rule.descrizione,
          importo: rule.importo, ricorrenteGruppo: rule.gruppoId, generatedAt: Date.now()
        };
        state.transazioni.push(nuovo);
        nuoviGenerati.push(nuovo);
      }
    });
  });

  if (nuoviGenerati.length > 0) salvaMovimentiBulk(nuoviGenerati, []);
}

function getYears(){
  const s = new Set(state.transazioni.map(t=>t.anno));
  const arr = Array.from(s);
  const minY = arr.length ? Math.min(...arr) : 2019;
  const maxY = arr.length ? Math.max(...arr) : 2026;
  const out = [];
  for (let y=minY; y<=maxY+2; y++) out.push(y);
  return out;
}

// Alcune spese (es. il mutuo) vengono registrate/previste ogni mese ma la banca
// le addebita davvero solo ogni 3 mesi in un'unica rata. Per il confronto col
// saldo conto reale (Saldo Conto) serve il ritmo VERO di addebito, non quello
// registrato — questa funzione calcola la differenza da applicare mese per mese.
function aggiustamentoTrimestraleUscite(anno, mese){
  if (!state.speseTrimestrali || state.speseTrimestrali.length === 0) return 0;
  let delta = 0;
  // Protezione ulteriore: anche se un vecchio dispositivo ha appena rimesso
  // online copie della stessa configurazione, il calcolo la considera una volta sola.
  normalizzaSpeseTrimestrali(state.speseTrimestrali).forEach(cfg => {
    const match = (cfg.descrizioneMatch || "").toLowerCase();
    if (!match) return;
    const registrato = state.transazioni
      .filter(t => t.anno===anno && t.mese===mese && t.categoria!=="Entrate" && t.descrizione.toLowerCase().includes(match))
      .reduce((s,t)=>s+t.importo, 0);
    // mesi trascorsi dal mese di riferimento (può essere negativo se anno/mese precede l'ancora)
    const diffMesi = (anno*12+mese) - (cfg.prossimaRataAnno*12+cfg.prossimaRataMese);
    const isMesePagamento = ((diffMesi % 3) + 3) % 3 === 0;
    const realeDelMese = isMesePagamento ? registrato*3 : 0;
    delta += (realeDelMese - registrato);
  });
  return delta;
}

function riepilogoCassaMese(anno, mese){
  const entrateNormalizzate = state.transazioni.filter(t => t.anno===anno && t.mese===mese && t.categoria==="Entrate").reduce((s,t)=>s+t.importo,0);
  const entrate = entrateNormalizzate + rettificaTredicesimeCassa(anno, mese);
  const configurazioni = normalizzaSpeseTrimestrali(state.speseTrimestrali || []);
  const eTrimestrale = t => configurazioni.find(cfg => String(t.descrizione||"").toLowerCase().includes(String(cfg.descrizioneMatch||"").toLowerCase()));
  let uscite = 0;
  state.transazioni.filter(t=>t.categoria!=="Entrate").forEach(t => {
    if (eTrimestrale(t)) return;
    const addebito = t.amex ? shiftMonth(t.anno,t.mese,1) : {anno:t.anno,mese:t.mese};
    if (addebito.anno===anno && addebito.mese===mese) uscite += t.importo;
  });
  configurazioni.forEach(cfg => {
    const diff = (anno*12+mese) - (cfg.prossimaRataAnno*12+cfg.prossimaRataMese);
    if ((((diff%3)+3)%3)!==0) return;
    for(let indietro=0; indietro<3; indietro++){
      const periodo=shiftMonth(anno,mese,-indietro);
      uscite += state.transazioni.filter(t => t.categoria!=="Entrate" && t.anno===periodo.anno && t.mese===periodo.mese && String(t.descrizione||"").toLowerCase().includes(String(cfg.descrizioneMatch||"").toLowerCase())).reduce((s,t)=>s+t.importo,0);
    }
  });
  return {entrate, uscite, risparmio:entrate-uscite};
}

function datiObiettiviRisparmio(){
  const saldi = Object.entries(state.saldoConto || {}).filter(([,v])=>v && Number.isFinite(Number(v.saldo))).sort((a,b)=>a[0].localeCompare(b[0]));
  if (!saldi.length) return {saldo:null, media:null, periodo:null, obiettivi:[]};
  const [periodo, ultimo] = saldi[saldi.length-1];
  const [annoSaldo,meseSaldo] = periodo.split("-").map(Number);
  // La barra obiettivi usa esattamente il "Risparmio" mostrato dall'app nei
  // sei mesi conclusi, senza rettifiche di cassa per Amex, mutuo o tredicesima.
  const media = paceMedioRisparmioRecente(6);
  const saldo = Number(ultimo.saldo);
  const obiettivi = (state.obiettiviRisparmio||[]).map(valore=>{
    const raggiunto = saldo>=valore;
    const mesi = raggiunto ? 0 : (media>0 ? Math.ceil((valore-saldo)/media) : null);
    const data = mesi==null ? null : shiftMonth(annoSaldo,meseSaldo,mesi);
    return {valore,raggiunto,mesi,data,pct:Math.max(0,Math.min(100,(saldo/valore)*100))};
  });
  return {saldo,media,periodo,obiettivi};
}

function renderObiettiviRisparmio(){
  const d=datiObiettiviRisparmio();
  const inputs=(state.obiettiviRisparmio||[10000,20000,30000]).map((v,i)=>`<div class="budget-input-wrap"><span>&euro;</span><input type="text" inputmode="decimal" class="obiettivo-risparmio-input" data-index="${i}" value="${v}" style="width:90px"></div>`).join('');
  const editor=`<div class="goals-editor" id="goalsEditor"><span class="sub" style="margin:0">Obiettivi:</span>${inputs}<button class="range-btn" id="salvaObiettiviBtn">Salva</button></div>`;
  if(d.saldo==null) return `<div class="card goals-card"><div class="goals-head"><div><h3>&#127919; Obiettivi liquidità</h3><p class="sub" style="margin:4px 0 0">Inserisci un saldo reale in “Saldo Conto” per vedere avanzamento e previsioni.</p></div><button class="goals-edit" id="toggleGoalsEditor">&#9998; Modifica</button></div>${editor}</div>`;
  const massimo=Math.max(...d.obiettivi.map(o=>o.valore),1), avanzamento=Math.max(0,Math.min(100,d.saldo/massimo*100));
  const markers=d.obiettivi.map(o=>{
    const pos=Math.max(5,Math.min(95,o.valore/massimo*100));
    const stato=o.raggiunto?'Raggiunto':(o.data?`${MESI[o.data.mese-1].slice(0,3)} ${o.data.anno}`:'Non stimabile');
    return `<div class="goal-marker ${o.raggiunto?'done':''}" style="left:${pos}%"><div class="goal-dot"></div><b>${eur(o.valore)}</b><span>${stato}</span></div>`;
  }).join('');
  const prossimo=d.obiettivi.find(o=>!o.raggiunto), mancano=prossimo?Math.max(0,prossimo.valore-d.saldo):0;
  return `<div class="card goals-card"><div class="goals-head"><div><h3>&#127919; Obiettivi liquidità</h3><p class="sub" style="margin:4px 0 0">Media risparmio app, ultimi 6 mesi conclusi: <b style="color:${d.media>=0?GREEN:RUST}">${eur(d.media)}/mese</b> · saldo aggiornato a ${d.periodo}</p></div><div style="text-align:right"><button class="goals-edit" id="toggleGoalsEditor">&#9998; Modifica</button>${prossimo?`<div class="sub" style="margin:4px 0 0">Al prossimo mancano <b style="color:${NAVY}">${eur(mancano)}</b></div>`:'<div class="sub" style="color:'+GREEN+';margin:4px 0 0"><b>Tutti raggiunti</b></div>'}</div></div><div class="goal-track-wrap"><div class="goal-track"><div class="goal-track-fill" style="width:${avanzamento}%"></div></div>${markers}</div>${editor}</div>`;
}

// Calcola il ritmo medio di risparmio usando SOLO mesi effettivamente conclusi
// (esclude il mese in corso, che è parziale e falserebbe la media).
function paceMedioRisparmioRecente(nMesi){
  const now = new Date();
  const oggiAnno = now.getFullYear(), oggiMese = now.getMonth()+1;
  const mesiConclusi = getMonthlySummary().filter(m => m.anno < oggiAnno || (m.anno===oggiAnno && m.mese < oggiMese));
  const ultimi = mesiConclusi.slice(-nMesi);
  return ultimi.length ? ultimi.reduce((s,m)=>s+m.risparmio,0)/ultimi.length : 0;
}

function getMonthlySummary(){
  const map = {};
  state.transazioni.forEach(t => {
    const k = monthKey(t.anno, t.mese);
    if (!map[k]) map[k] = {anno:t.anno, mese:t.mese, entrate:0, uscite:0};
    if (t.categoria === "Entrate") map[k].entrate += t.importo; else map[k].uscite += t.importo;
  });
  const arr = Object.values(map).sort((a,b)=> a.anno-b.anno || a.mese-b.mese);
  const reset = state.risparmioReset; // {anno, mese, valore} oppure null
  let cum = 0;
  return arr.map(m => {
    const risparmio = m.entrate - m.uscite;
    if (reset && m.anno===reset.anno && m.mese===reset.mese) {
      cum = (reset.valore || 0) + risparmio;
    } else {
      cum += risparmio;
    }
    return {...m, risparmio, cumulato:cum, key:monthKey(m.anno,m.mese), label: MESI[m.mese-1].slice(0,3)+" "+String(m.anno).slice(2)};
  });
}

// CANVAS CHARTS (zero external dependencies)
// ============================================================
function setupCanvas(canvas){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = rect.width || canvas.parentElement.clientWidth || 600;
  const h = parseInt(canvas.dataset.h || "280", 10);
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  return {ctx, w, h};
}

function niceStep(range){
  if (range <= 0) return 1;
  const rough = range / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1; else if (norm < 3) step = 2; else if (norm < 7) step = 5; else step = 10;
  return step * mag;
}

// Grafico a torta nativo (canvas), per la ripartizione delle spese per categoria.
// slices: [{label, value, color}]
function drawPieChart(canvas, slices){
  const {ctx, w, h} = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const totale = slices.reduce((s,d)=>s+d.value, 0);
  if (totale <= 0) return;

  const legendW = w > 480 ? 200 : 0; // su schermi stretti la legenda va sotto, non a fianco
  const cx = legendW ? (w - legendW) / 2 : w / 2;
  const cy = legendW ? h / 2 : h / 2 - 60;
  const raggio = Math.min(cx, cy) - 16;

  let angolo = -Math.PI / 2;
  slices.forEach(s => {
    const frazione = s.value / totale;
    const angoloFine = angolo + frazione * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, raggio, angolo, angoloFine);
    ctx.closePath();
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.strokeStyle = "#FBF9F3";
    ctx.lineWidth = 2;
    ctx.stroke();
    // etichetta percentuale solo se la fetta è abbastanza grande da leggerla
    if (frazione > 0.045) {
      const angoloMedio = (angolo + angoloFine) / 2;
      const lx = cx + Math.cos(angoloMedio) * raggio * 0.65;
      const ly = cy + Math.sin(angoloMedio) * raggio * 0.65;
      ctx.fillStyle = "#fff";
      ctx.font = "600 11px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(Math.round(frazione*100)+"%", lx, ly);
    }
    angolo = angoloFine;
  });

  // legenda: a fianco su schermi larghi, sotto la torta su schermi stretti
  ctx.font = "12px -apple-system, sans-serif";
  ctx.textBaseline = "middle";
  if (legendW) {
    let ly = cy - (slices.length * 20)/2 + 10;
    slices.forEach(s => {
      ctx.fillStyle = s.color;
      ctx.fillRect(w - legendW + 6, ly - 6, 12, 12);
      ctx.fillStyle = MUTED;
      ctx.textAlign = "left";
      ctx.fillText(`${s.label} (${eur(s.value)})`, w - legendW + 24, ly);
      ly += 20;
    });
  } else {
    let lx = 10, ly = h - (Math.ceil(slices.length/2) * 20) - 6;
    const startLy = ly;
    slices.forEach((s, i) => {
      ctx.fillStyle = s.color;
      ctx.fillRect(lx, ly - 6, 10, 10);
      ctx.fillStyle = MUTED;
      ctx.textAlign = "left";
      ctx.fillText(s.label, lx + 16, ly);
      ly += 20;
      if (i % 2 === 1) { ly = startLy; lx += w/2; }
    });
  }
}

function drawLineChart(canvas, labels, datasets, opts){
  opts = opts || {};
  const {ctx, w, h} = setupCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const padL = 54, padR = 14, padT = 14, padB = labels.length ? 46 : 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let allVals = [];
  datasets.forEach(ds => ds.data.forEach(v => { if (v!=null) allVals.push(v); }));
  if (allVals.length === 0) allVals = [0,1];
  let min = Math.min(0, ...allVals), max = Math.max(...allVals);
  if (max === min) max = min + 1;
  const step = niceStep(max - min);
  min = Math.floor(min/step)*step; max = Math.ceil(max/step)*step;

  const xForIdx = i => padL + (labels.length<=1 ? plotW/2 : (plotW * i/(labels.length-1)));
  const yForVal = v => padT + plotH - ((v-min)/(max-min))*plotH;

  // gridlines + y labels
  ctx.strokeStyle = GRID; ctx.fillStyle = MUTED; ctx.font = "11px ui-sans-serif,sans-serif"; ctx.lineWidth=1;
  const nLines = Math.round((max-min)/step);
  for (let i=0;i<=nLines;i++){
    const v = min + i*step;
    const y = yForVal(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.textAlign="right"; ctx.fillText(fmtCompact(v), padL-8, y+4);
  }
  // x labels (sparse if many)
  const maxLabels = Math.floor(plotW/55);
  const labelStep = Math.max(1, Math.ceil(labels.length/Math.max(1,maxLabels)));
  ctx.textAlign="center"; ctx.fillStyle = MUTED;
  labels.forEach((lab,i) => {
    if (i % labelStep === 0 || i===labels.length-1){
      ctx.fillText(lab, xForIdx(i), h-padB+16);
    }
  });

  // lines
  datasets.forEach(ds => {
    ctx.strokeStyle = ds.color; ctx.lineWidth = ds.width || 2;
    if (ds.dash) ctx.setLineDash(ds.dash); else ctx.setLineDash([]);
    ctx.beginPath();
    let started = false;
    ds.data.forEach((v,i) => {
      if (v==null) { started=false; return; }
      const x = xForIdx(i), y = yForVal(v);
      if (!started){ ctx.moveTo(x,y); started=true; } else { ctx.lineTo(x,y); }
    });
    ctx.stroke();
  });

  // legend
  if (opts.legend !== false){
    let lx = padL, ly = 8;
    ctx.font = "11px ui-sans-serif,sans-serif";
    datasets.forEach(ds => {
      ctx.fillStyle = ds.color;
      ctx.fillRect(lx, ly-8, 10, 10);
      ctx.fillStyle = NAVY; ctx.textAlign="left";
      ctx.fillText(ds.label, lx+14, ly+1);
      lx += 14 + ctx.measureText(ds.label).width + 16;
    });
  }
}

function fmtCompact(v){
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v%1000===0?0:1)+"k";
  return String(Math.round(v));
}

// ---------- rendering ----------
// Costruisce un selettore stabile per un elemento, per poterlo ritrovare dopo
// che il DOM è stato rigenerato da capo.
function selettoreElemento(el){
  if (el.id) return "#" + CSS.escape(el.id);
  let sel = el.tagName.toLowerCase();
  if (el.className) sel += "." + String(el.className).trim().split(/\s+/).filter(Boolean).map(c=>CSS.escape(c)).join(".");
  Array.from(el.attributes).forEach(attr => {
    if (attr.name.indexOf("data-")===0) sel += `[${attr.name}="${CSS.escape(attr.value)}"]`;
  });
  return sel;
}

function render(){
  // Se l'utente sta scrivendo in un campo quando arriva un ridisegno causato da
  // qualcos'altro (es. una sincronizzazione in arrivo, non collegata a quello che
  // sta facendo), il DOM viene rigenerato da capo e quello che stava scrivendo
  // — non ancora confermato — andrebbe perso. Lo salviamo prima e lo rimettiamo
  // dopo, così un ridisegno "di passaggio" non cancella mai nulla che l'utente
  // non abbia ancora confermato lui stesso.
  const content = document.getElementById("content");
  const activeEl = document.activeElement;
  let daPreservare = null;
  if (activeEl && content && content.contains(activeEl) && (activeEl.tagName==="INPUT" || activeEl.tagName==="TEXTAREA")) {
    try {
      daPreservare = {
        selettore: selettoreElemento(activeEl),
        valore: activeEl.value,
        selStart: activeEl.selectionStart,
        selEnd: activeEl.selectionEnd
      };
    } catch(e) { daPreservare = null; }
  }
  renderTabs();
  document.getElementById("subtitle").textContent =
    "Il tuo registro finanziario — " + state.transazioni.length + " movimenti registrati.";
  if (state.tab === "mese") content.innerHTML = renderMeseView();
  else if (state.tab === "andamento") content.innerHTML = renderAndamentoView();
  else if (state.tab === "budget") content.innerHTML = renderBudgetView();
  else if (state.tab === "saldo") content.innerHTML = renderSaldoView();
  else if (state.tab === "ricorrenti") content.innerHTML = renderRicorrentiView();
  else if (state.tab === "stipendi") content.innerHTML = renderStipendiView();
  else if (state.tab === "admin") content.innerHTML = renderAdminView();
  attachHandlers();
  if (state.tab === "andamento") drawAndamentoCharts();
  if (daPreservare) {
    try {
      const el2 = content.querySelector(daPreservare.selettore);
      if (el2) {
        el2.value = daPreservare.valore;
        el2.focus();
        if (typeof daPreservare.selStart === "number" && el2.setSelectionRange) el2.setSelectionRange(daPreservare.selStart, daPreservare.selEnd);
      }
    } catch(e) { /* selettore non valido: ignora, non blocca il resto */ }
  }
}

}

function currentTx(){
  return state.transazioni.filter(t => t.anno===state.selYear && t.mese===state.selMonth);
}

function renderMeseView(){
  const years = getYears();
  const liquidita = datiObiettiviRisparmio();
  const tx = currentTx();
  const entrate = tx.filter(t=>t.categoria==="Entrate").reduce((s,t)=>s+t.importo,0);
  const uscite = tx.filter(t=>t.categoria!=="Entrate").reduce((s,t)=>s+t.importo,0);
  const risparmio = entrate - uscite;
  const scostamentiMese = calcolaScostamenti(state.selYear, state.selMonth);

  const budgetCorrente = state.budgetAnnuale[state.selYear] || {};
  const entratePreviste = state.vociEntrata.reduce((s,v)=>s+entrataPrevistaMese(budgetCorrente,v,state.selMonth),0);
  const uscitePreviste = state.categorieBudget.reduce((s,c)=>s+(budgetCorrente[c]||0),0) / 12;
  const risparmioPrevisto = entratePreviste - uscitePreviste;
  const pctVar = (reale, previsto) => (!previsto) ? null : ((reale - previsto) / Math.abs(previsto)) * 100;
  const pctEntrate = pctVar(entrate, entratePreviste);
  const pctUscite = pctVar(uscite, uscitePreviste);
  const pctRisparmio = pctVar(risparmio, risparmioPrevisto);
  const pctBadge = (pct, goodIsUp) => {
    if (pct === null) return '';
    const positivo = goodIsUp ? pct >= 0 : pct <= 0;
    const segno = pct >= 0 ? '+' : '';
    return `<div style="font-size:12px;font-weight:600;color:${positivo?GREEN:RUST};margin-top:2px">${segno}${pct.toFixed(1)}% vs previsto</div>`;
  };

  const catMap = {}; state.categorie.forEach(c=>catMap[c]=0);
  tx.forEach(t => { if (t.categoria!=="Entrate") catMap[t.categoria]=(catMap[t.categoria]||0)+t.importo; });
  const yearBudget = state.budgetAnnuale[state.selYear] || {};
  const catSpend = state.categorie.map(c => ({
    categoria:c, speso:catMap[c]||0,
    budget: state.categorieBudget.includes(c) ? (yearBudget[c]||0)/12 : null
  })).filter(c => c.speso>0 || c.budget).sort((a,b)=>b.speso-a.speso);

  // "più recenti in alto": ordinamento esplicito su dati veri (createdAt, con
  // fallback sull'indice storico), non più sull'ordine dell'array.
  const matchesSearch = (t) => !state.search || t.descrizione.toLowerCase().includes(state.search.toLowerCase());
  const sourceTx = state.searchAllHistory && state.search ? state.transazioni : tx;
  const entrateList = ordinaPerRecenti(sourceTx.filter(t => t.categoria==="Entrate" && matchesSearch(t)));
  const usciteList = ordinaPerRecenti(sourceTx.filter(t => {
    if (t.categoria==="Entrate") return false;
    if (state.filterCat !== "Tutte" && t.categoria !== state.filterCat) return false;
    return matchesSearch(t);
  }));
  const showDateBadge = state.searchAllHistory && state.search;

  const txRow = (t) => {
    const isE = t.categoria==="Entrate";
    const infoTitle = [
      (!t.ricorrenteGruppo && t.createdAt) ? `Inserito: ${fmtDataOra(t.createdAt)}` : '',
      (!t.ricorrenteGruppo && t.updatedAt && t.updatedAt !== t.createdAt) ? `Modificato: ${fmtDataOra(t.updatedAt)}` : ''
    ].filter(Boolean).join(' — ');
    const dataInserimentoBreve = (!t.ricorrenteGruppo && t.createdAt) ? new Date(t.createdAt).toLocaleDateString("it-IT", {day:"2-digit",month:"2-digit",year:"numeric"}) : null;
    return `<div class="tx-item ${isE?'entrata':'uscita'}" ${infoTitle?`title="${escapeHtml(infoTitle)}"`:''}>
      <div style="min-width:0">
        <div class="tx-desc">${t.giorno?`<span style="color:${NAVY};font-weight:600">${String(t.giorno).padStart(2,'0')}</span> `:''}${t.ricorrenteGruppo?'&#128257; ':''}${escapeHtml(t.descrizione)}${t.allegatoId?` <a href="#" data-open-allegato="${t.allegatoId}" title="${escapeHtml(t.allegatoNome||'Allegato')}" style="text-decoration:none">&#128206;</a>`:''}</div>
        <div class="tx-cat">${escapeHtml(t.categoria)}${t.amex?'<span class="amex-badge">AMEX · +1 MESE</span>':''}${etichettaStato(t)}${showDateBadge?' · '+MESI[t.mese-1].slice(0,3)+' '+t.anno:''}</div>
        ${t.ricorrenteGruppo ? `<div style="font-size:11px;color:#8A8072;margin-top:2px">Generata automaticamente</div>` : (dataInserimentoBreve ? `<div style="font-size:11px;color:#8A8072;margin-top:2px">Registrato il ${dataInserimentoBreve}</div>` : '')}
      </div>
      <div class="tx-actions" style="display:flex;align-items:center;gap:6px">
        <span class="tx-amt ${isE?'entrata':'uscita'}">${isE?'+':'\u2212'}${eur(t.importo)}</span>
        <button class="tx-del" data-edit-tx="${t.id}" title="Modifica" style="font-size:14px;padding:4px 8px">&#9998;</button>
        ${!t.ricorrenteGruppo ? `<button class="tx-del" data-mark-recurrent="${t.id}" title="Rendi ricorrente" style="font-size:16px;padding:4px 8px">&#128257;</button>` : ''}
        <button class="tx-del" data-del="${t.id}" ${state.pendingDeleteId===t.id ? `style="background:${RUST};color:#fff;padding:2px 8px;border-radius:4px"` : ''}>${state.pendingDeleteId===t.id ? 'Conferma?' : '&#10005;'}</button>
      </div>
    </div>`;
  };

  return `
  <div class="month-nav">
    <button class="nav-btn" id="prevMonth">&#8249;</button>
    <select class="big-select" id="selMonth">${MESI.map((m,i)=>`<option value="${i+1}" ${state.selMonth===i+1?'selected':''}>${m}</option>`).join('')}</select>
    <select class="big-select" id="selYear">${years.map(y=>`<option value="${y}" ${state.selYear===y?'selected':''}>${y}</option>`).join('')}</select>
    <button class="nav-btn" id="nextMonth">&#8250;</button>
  </div>
  <div class="dashboard-top">
    <div class="card balance-hero"><div class="summary-label">Liquidità effettiva</div><div class="balance-main">${liquidita.saldo==null?'—':eur(liquidita.saldo)}</div><div class="balance-meta">${liquidita.periodo?'Ultimo saldo reale · '+liquidita.periodo:'Inseriscila in Saldo Conto'}</div></div>
    <div class="summary-grid">
      <div class="card summary-card"><div class="summary-label">Entrate</div><div class="summary-value" style="color:${GREEN}">${eur(entrate)}</div>${pctBadge(pctEntrate, true)}</div>
      <div class="card summary-card"><div class="summary-label">Uscite</div><div class="summary-value" style="color:${RUST}">${eur(uscite)}</div>${pctBadge(pctUscite, false)}</div>
      <div class="card summary-card"><div class="summary-label">Risparmio</div><div class="summary-value" style="color:${risparmio>=0?GREEN:RUST}">${eur(risparmio)}</div>${pctBadge(pctRisparmio, true)}</div>
    </div>
  </div>
  ${renderObiettiviRisparmio()}
  <div style="margin:-4px 0 16px;display:flex;justify-content:flex-end">
    <button id="reportPdfBtnHome" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid ${scostamentiMese.length ? RUST : 'var(--border-soft)'};cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;background:${scostamentiMese.length ? RUST : '#fff'};color:${scostamentiMese.length ? '#fff' : NAVY}">
      ${scostamentiMese.length ? `&#9888; ${scostamentiMese.length} scostament${scostamentiMese.length===1?'o':'i'} ${scostamentiMese.length===1?'importante':'importanti'} dal budget — genera il report PDF` : `&#128196; Genera report PDF del mese`}
    </button>
  </div>

  <div class="tx-controls section-toolbar" style="margin-bottom:16px">
    <div class="tx-search"><span class="icon">&#128269;</span>
      <input id="searchInput" placeholder="Cerca descrizione..." value="${escapeHtml(state.search)}"></div>
    <select id="filterCatSelect">
      <option ${state.filterCat==="Tutte"?"selected":""}>Tutte</option>
      ${state.categorie.map(c=>`<option ${state.filterCat===c?"selected":""}>${c}</option>`).join('')}

    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:${MUTED};white-space:nowrap;cursor:pointer">
      <input type="checkbox" id="searchAllHistoryChk" ${state.searchAllHistory?'checked':''}> tutto lo storico

  <div class="three-col">
    <div class="card">
      <h3>Spesa per categoria</h3>

        const pct = c.budget ? Math.min(100,(c.speso/c.budget)*100) : null;
        const over = c.budget && c.speso > c.budget;
        return `<div class="cat-row">
          <div class="cat-row-top"><span class="cat-name">${c.categoria}</span>
            <span class="cat-amt" style="color:${over?RUST:NAVY}">${eur(c.speso)}${c.budget?' / '+eur(c.budget):''}</span></div>
          ${c.budget!=null ? `<div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${over?RUST:colorForCat(c.categoria,0)}"></div></div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <h3 style="color:${GREEN}">Entrate <span class="sub" style="font-weight:400">${showDateBadge?'(risultati su tutto lo storico)':'(più recenti in alto)'}</span></h3>
      <div class="tx-list">
        ${entrateList.length===0 ? '<p class="empty">Nessuna entrata trovata.</p>' : entrateList.map(txRow).join('')}
      </div>
    </div>
    <div class="card">
      <h3 style="color:${RUST}">Uscite <span class="sub" style="font-weight:400">${showDateBadge?'(risultati su tutto lo storico)':'(più recenti in alto)'}</span></h3>
      <div class="tx-list">
        ${usciteList.length===0 ? '<p class="empty">Nessuna uscita trovata.</p>' : usciteList.map(txRow).join('')}
      </div>
    </div>
  </div>
  <div id="modalRoot"></div>
  `;
}

function renderAndamentoView(){
  const years = Array.from(new Set(state.transazioni.map(t=>t.anno))).sort();
  const annoSel = state.riepilogoAnnoSel || years[years.length-1];
  // Esclude mesi futuri rispetto a oggi (potrebbero avere già movimenti ricorrenti
  // pre-generati se in passato si è navigato avanti nel calendario): non sono
  // ancora "successi" davvero, non devono contare come mese migliore/peggiore o
  // pesare sulle medie.
  const oggiPerRiepilogo = new Date();
  const oggiAnnoR = oggiPerRiepilogo.getFullYear(), oggiMeseR = oggiPerRiepilogo.getMonth()+1;
  const nonFuturoR = (t) => t.anno < oggiAnnoR || (t.anno===oggiAnnoR && t.mese <= oggiMeseR);
  const txAnno = state.transazioni.filter(t=>t.anno===annoSel && nonFuturoR(t));
  const mesiRegistrati = getMonthlySummary().filter(m=>m.anno===annoSel && nonFuturoR(m));
  const usciteTotaliAnno = txAnno.filter(t=>t.categoria!=="Entrate").reduce((s,t)=>s+t.importo,0);

  const paceMedioRisparmioDisplay = paceMedioRisparmioRecente(6);

  const catTotals = state.categorie.map(cat => {
    const tot = txAnno.filter(t=>t.categoria===cat).reduce((s,t)=>s+t.importo,0);
    const nMesi = mesiRegistrati.length || 1;
    return {categoria: cat, totale: tot, media: tot/nMesi, pct: usciteTotaliAnno ? (tot/usciteTotaliAnno)*100 : 0};
  }).filter(c => c.totale > 0).sort((a,b) => b.totale - a.totale);

  const meseMigliore = mesiRegistrati.length ? mesiRegistrati.reduce((a,b)=> b.risparmio>a.risparmio ? b : a) : null;
  const misePeggiore = mesiRegistrati.length ? mesiRegistrati.reduce((a,b)=> b.risparmio<a.risparmio ? b : a) : null;
  const categoriaTop = catTotals[0] || null;
  const consigli = generaConsigli();
  const iconePerTipo = {warn: "&#9888;", good: "&#10003;", tip: "&#128161;"};
  const coloriPerTipo = {warn: RUST, good: GREEN, tip: GOLD};

  return `
  ${consigli.length ? `
  <div class="card" style="margin-bottom:20px">
    <h3>Consigli</h3>
    ${consigli.map(c => `
      <div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #EFEBDF;align-items:flex-start">
        <span style="color:${coloriPerTipo[c.tipo]};font-size:15px;flex-shrink:0">${iconePerTipo[c.tipo]}</span>
        <span style="font-size:13px;line-height:1.5">${c.testo}</span>
      </div>
    `).join('')}
  </div>` : ''}
  <div class="card" style="margin-bottom:20px">
    <div class="card-title-row"><h3 style="margin-bottom:0">Andamento mensile</h3>
      <div class="range-toggle">
        <button class="range-btn ${state.andamentoRange==='12m'?'active':''}" data-range="12m">Ultimi 12 mesi</button>
        <button class="range-btn ${state.andamentoRange==='all'?'active':''}" data-range="all">Tutto lo storico</button>
      </div>
    </div>
    <p class="sub" style="margin-top:0;margin-bottom:10px">Proiezione 6 mesi basata sul risparmio medio recente: <b style="color:${paceMedioRisparmioDisplay>=0?GREEN:RUST}">${paceMedioRisparmioDisplay>=0?'+':''}${eur(paceMedioRisparmioDisplay)}/mese</b></p>
    <canvas class="chart-canvas" id="trendChart" data-h="280"></canvas>
  </div>
  <div class="card" style="margin-bottom:20px">
    <div class="card-title-row"><h3 style="margin-bottom:0">Risparmio mensile per anno</h3></div>
    <div id="yearFilterRow" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"></div>
    <canvas class="chart-canvas" id="yearCompareChart" data-h="280"></canvas>
  </div>

  <div class="card">
    <div class="card-title-row"><h3 style="margin-bottom:0">Riepilogo annuale</h3>
      <select class="big-select" id="riepilogoAnnoSelect" style="font-size:14px">${years.map(y=>`<option value="${y}" ${annoSel===y?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="summary-grid" style="margin-top:14px;margin-bottom:18px">
      <div class="card summary-card" style="box-shadow:none;border:1px solid var(--border)">
        <div class="summary-label">Mese migliore</div>
        <div class="summary-value" style="font-size:18px;color:${GREEN}">${meseMigliore ? MESI[meseMigliore.mese-1]+' '+meseMigliore.anno : '—'}</div>
        <div class="sub">${meseMigliore ? eur(meseMigliore.risparmio)+' risparmiati' : ''}</div>
      </div>
      <div class="card summary-card" style="box-shadow:none;border:1px solid var(--border)">
        <div class="summary-label">Mese peggiore</div>
        <div class="summary-value" style="font-size:18px;color:${RUST}">${misePeggiore ? MESI[misePeggiore.mese-1]+' '+misePeggiore.anno : '—'}</div>
        <div class="sub">${misePeggiore ? eur(misePeggiore.risparmio)+' risparmiati' : ''}</div>
      </div>
      <div class="card summary-card" style="box-shadow:none;border:1px solid var(--border)">
        <div class="summary-label">Categoria che pesa di più</div>
        <div class="summary-value" style="font-size:18px;color:${NAVY}">${categoriaTop ? escapeHtml(categoriaTop.categoria) : '—'}</div>
        <div class="sub">${categoriaTop ? eur(categoriaTop.totale)+' — '+categoriaTop.pct.toFixed(1)+'% delle uscite' : ''}</div>
      </div>
    </div>
    <canvas class="chart-canvas" id="catPieChart" data-h="280" style="margin-bottom:16px"></canvas>
    <table class="report-table">
      <thead><tr><th>Categoria</th><th>Media mensile</th><th>Totale anno</th><th>% sulle uscite</th></tr></thead>
      <tbody>
        ${catTotals.length===0 ? '<tr><td colspan="4">Nessun dato per questo anno.</td></tr>' : catTotals.map(c => `
          <tr><td>${escapeHtml(c.categoria)}</td><td>${eur(c.media)}</td><td>${eur(c.totale)}</td><td>${c.pct.toFixed(1)}%</td></tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  `;
}

function drawAndamentoCharts(){
  const data = getMonthlySummary();
  const shown = state.andamentoRange === "12m" ? data.slice(-12) : data;

  // proiezione: estende il risparmio cumulato di 6 mesi nel futuro usando il ritmo medio recente
  // (solo mesi effettivamente conclusi, per non falsare la media col mese in corso)
  const MESI_PROIEZIONE = 6;
  const paceMedioRisparmio = paceMedioRisparmioRecente(6);
  const ultimoDato = data[data.length-1];
  const labelsProiezione = [];
  let py = ultimoDato ? ultimoDato.anno : new Date().getFullYear();
  let pm = ultimoDato ? ultimoDato.mese : new Date().getMonth()+1;
  for (let i=0;i<MESI_PROIEZIONE;i++){
    pm++; if (pm>12){pm=1; py++;}
    labelsProiezione.push(MESI[pm-1].slice(0,3)+" "+String(py).slice(2));
  }
  const cumulatoProiezione = [];
  let cum = ultimoDato ? ultimoDato.cumulato : 0;
  for (let i=0;i<MESI_PROIEZIONE;i++){ cum += paceMedioRisparmio; cumulatoProiezione.push(cum); }

  const allLabels = shown.map(d=>d.label).concat(labelsProiezione);
  const padStorico = (arr) => arr.concat(new Array(MESI_PROIEZIONE).fill(null));
  const proiezioneSerie = new Array(shown.length-1).fill(null).concat([ultimoDato?ultimoDato.cumulato:null]).concat(cumulatoProiezione);

  const c1 = document.getElementById("trendChart");
  if (c1) drawLineChart(c1, allLabels, [
    {label:"Entrate", data:padStorico(shown.map(d=>d.entrate)), color:GREEN},
    {label:"Uscite", data:padStorico(shown.map(d=>d.uscite)), color:RUST},
    {label:"Risparmio cumulato", data:padStorico(shown.map(d=>d.cumulato)), color:GOLD},
    {label:`Proiezione (${paceMedioRisparmio>=0?'+':''}${eur(paceMedioRisparmio)}/mese)`, data:proiezioneSerie, color:NAVY, width:2, dash:[5,4]}
  ]);

  const allYears = Array.from(new Set(data.map(d=>d.anno))).sort();
  if (state.andamentoYears === null) state.andamentoYears = [...allYears];

  const filterRow = document.getElementById("yearFilterRow");
  if (filterRow) {
    filterRow.innerHTML = allYears.map((y,i) => {
      const checked = state.andamentoYears.includes(y);
      const color = FALLBACK_PALETTE[i % FALLBACK_PALETTE.length];
      return `<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;cursor:pointer">
        <input type="checkbox" class="year-filter-chk" data-year="${y}" ${checked?'checked':''}>
        <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span>${y}
      </label>`;
    }).join('') + `<button class="range-btn" id="yearFilterAll">Tutti</button><button class="range-btn" id="yearFilterNone">Nessuno</button><button class="range-btn ${state.andamentoShowMedia?'active':''}" id="mediaToggle">&#8213; Media</button>`;

    filterRow.querySelectorAll(".year-filter-chk").forEach(chk => {
      chk.onchange = () => {
        const y = Number(chk.dataset.year);
        if (chk.checked) { if (!state.andamentoYears.includes(y)) state.andamentoYears.push(y); }
        else { state.andamentoYears = state.andamentoYears.filter(v=>v!==y); }
        drawYearCompareChart(data, allYears);
      };
    });
    const allBtn = document.getElementById("yearFilterAll");
    if (allBtn) allBtn.onclick = () => { state.andamentoYears = [...allYears]; drawAndamentoCharts(); };
    const noneBtn = document.getElementById("yearFilterNone");
    if (noneBtn) noneBtn.onclick = () => { state.andamentoYears = []; drawAndamentoCharts(); };
    const mediaBtn = document.getElementById("mediaToggle");
    if (mediaBtn) mediaBtn.onclick = () => { state.andamentoShowMedia = !state.andamentoShowMedia; drawAndamentoCharts(); };
  }

  drawYearCompareChart(data, allYears);

  // Grafico a torta: ripartizione spese per categoria nel Riepilogo Annuale
  const pieCanvas = document.getElementById("catPieChart");
  if (pieCanvas) {
    const annoSelPie = state.riepilogoAnnoSel || Array.from(new Set(state.transazioni.map(t=>t.anno))).sort().pop();
    const oggiPie = new Date();
    const nonFuturoPie = (t) => t.anno < oggiPie.getFullYear() || (t.anno===oggiPie.getFullYear() && t.mese <= oggiPie.getMonth()+1);
    const txAnnoPie = state.transazioni.filter(t=>t.anno===annoSelPie && nonFuturoPie(t));
    const slices = state.categorie.map((cat,i) => ({
      label: cat,
      value: txAnnoPie.filter(t=>t.categoria===cat).reduce((s,t)=>s+t.importo,0),
      color: colorForCat(cat, i)
    })).filter(s => s.value > 0).sort((a,b) => b.value - a.value);
    drawPieChart(pieCanvas, slices);
  }
}

function percentile(sortedArr, p){
  if (sortedArr.length === 0) return null;
  if (sortedArr.length === 1) return sortedArr[0];
  const idx = p * (sortedArr.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi]-sortedArr[lo]) * (idx-lo);
}

// ============================================================
// CONSIGLI: suggerimenti generati dai dati reali (categorie in
// crescita, risparmio sotto obiettivo, margini di risparmio)
// ============================================================
function generaConsigli(){
  const consigli = [];
  const oggiConsigli = new Date();
  const nonFuturoConsigli = (m) => m.anno < oggiConsigli.getFullYear() || (m.anno===oggiConsigli.getFullYear() && m.mese <= oggiConsigli.getMonth()+1);
  const data = getMonthlySummary().filter(nonFuturoConsigli);
  if (data.length < 2) return consigli;

  const recenti = data.slice(-3);
  const nRecenti = recenti.length;
  const annoCorrente = data[data.length-1].anno;

  const storico = data.slice(0, -3);
  state.categorieBudget.forEach(cat => {
    const speseRecenti = recenti.map(m => state.transazioni.filter(t=>t.anno===m.anno && t.mese===m.mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0));
    const mediaRecente = speseRecenti.reduce((s,v)=>s+v,0)/nRecenti;
    if (mediaRecente < 30) return;
    const speseStoriche = storico.map(m => state.transazioni.filter(t=>t.anno===m.anno && t.mese===m.mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0)).filter(v=>v>0);
    if (speseStoriche.length < 3) return;
    const mediaStorica = trimmedMean95(speseStoriche);
    if (mediaStorica > 0 && mediaRecente > mediaStorica * 1.25) {
      const pct = ((mediaRecente - mediaStorica) / mediaStorica) * 100;
      consigli.push({tipo:"warn", testo: `La spesa in <b>${escapeHtml(cat)}</b> è cresciuta del ${pct.toFixed(0)}% rispetto alla tua media storica (${eur(mediaRecente)}/mese contro ${eur(mediaStorica)}/mese).`});
    }
  });

  const budgetAnno = state.budgetAnnuale[annoCorrente] || {};
  const entratePreviste = state.vociEntrata.reduce((s,v)=>s+(budgetAnno["ENT::"+v]||0),0)/12;
  const uscitePreviste = state.categorieBudget.reduce((s,c)=>s+(budgetAnno[c]||0),0)/12;
  const risparmioPrevisto = entratePreviste - uscitePreviste;
  const risparmioMedioRecente = recenti.reduce((s,m)=>s+m.risparmio,0)/nRecenti;
  if (risparmioPrevisto > 0 && risparmioMedioRecente < risparmioPrevisto * 0.8) {
    consigli.push({tipo:"warn", testo: `Il risparmio medio degli ultimi ${nRecenti} mesi (${eur(risparmioMedioRecente)}) è sotto l'obiettivo di budget (${eur(risparmioPrevisto)}/mese).`});
  } else if (risparmioPrevisto > 0 && risparmioMedioRecente > risparmioPrevisto * 1.1) {
    consigli.push({tipo:"good", testo: `Stai risparmiando più del previsto: ${eur(risparmioMedioRecente)}/mese in media contro un obiettivo di ${eur(risparmioPrevisto)}.`});
  }

  let peggiore = null;
  state.categorieBudget.forEach(cat => {
    const previstoMensile = (budgetAnno[cat]||0)/12;
    if (!previstoMensile) return;
    const speseRecenti = recenti.map(m => state.transazioni.filter(t=>t.anno===m.anno && t.mese===m.mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0));
    const mediaRecente = speseRecenti.reduce((s,v)=>s+v,0)/nRecenti;
    const eccesso = mediaRecente - previstoMensile;
    if (eccesso > 0 && (!peggiore || eccesso > peggiore.eccesso)) peggiore = {cat, eccesso, mediaRecente, previstoMensile};
  });
  if (peggiore) {
    consigli.push({tipo:"tip", testo: `La voce con più margine di risparmio è <b>${escapeHtml(peggiore.cat)}</b>: in media ${eur(peggiore.eccesso)}/mese oltre il budget previsto.`});
  }

  return consigli.slice(0, 5);
}

// ============================================================
// CALCOLATORE STIPENDIO NETTO — motore di calcolo
// Stima IRPEF, contributi, regime "rientro dei cervelli" (art. 44
// DL 78/2010, 90% esente 2019-2030), detrazioni lavoro dipendente.
// I parametri (aliquote, tabelle stipendiali) sono tutti modificabili
// in Admin: questi sono valori indicativi, non consulenza fiscale.
// ============================================================
function calcolaIrpefScaglioni(imponibile){
  if (imponibile <= 0) return 0;
  if (imponibile <= 28000) return imponibile * 0.23;
  if (imponibile <= 50000) return 28000*0.23 + (imponibile-28000)*0.35;
  return 28000*0.23 + 22000*0.35 + (imponibile-50000)*0.43;
}

// Formula indicativa delle detrazioni da lavoro dipendente (Art. 13 TUIR, semplificata)
function calcolaDetrazioniLavoroDipendente(imponibile){
  if (imponibile <= 0) return 0;
  if (imponibile <= 15000) return Math.max(690, imponibile>0 ? 1955 * (imponibile/15000) : 0);
  if (imponibile <= 28000) return 1910 + 1190 * (28000-imponibile)/13000;
  if (imponibile <= 50000) return 1910 * (50000-imponibile)/22000;
  return 0;
}

// Scompone il lordo annuo nelle sue componenti. Per la scuola il tabellare è su
// 12 mensilità, la tredicesima è 1/12 del tabellare, e la RPD è una voce a sé
// (12 mensilità, fasce di anzianità proprie, esclusa dalla tredicesima).
function componentiLordo(persona, anno){
  const anniServizio = Math.max(0, anno - persona.annoInizioRuolo);
  if (persona.tipo === "universita") {
    const classe = Math.floor(anniServizio / (persona.scattoIntervallo||2));
    const riga = persona.tabella[Math.min(classe, persona.tabella.length-1)];
    const tabellare = riga ? riga.lordoAnnuo : 0;
    return {anniServizio, tabellare, tredicesima: 0, rpdAnnuo: 0, totale: tabellare};
  }
  const riga = persona.tabella.find(f => anniServizio >= f.da && anniServizio <= f.a) || persona.tabella[persona.tabella.length-1];
  let tabellare = riga ? (riga.tiers ? valoreScaglione(riga.tiers, anno) : riga.lordoAnnuo) : 0;
  const tabellaRpd = persona.rpd || DEFAULT_RPD_SCUOLA;
  const rigaRpd = tabellaRpd.find(f => anniServizio >= f.da && anniServizio <= f.a) || tabellaRpd[tabellaRpd.length-1];
  let rpdMensile = rigaRpd ? (rigaRpd.tiers ? valoreScaglione(rigaRpd.tiers, anno) : rigaRpd.mensile) : 0;
  // Il vecchio meccanismo "aumentoCCNL" (stima approssimata) si applica solo alle
  // righe che NON hanno ancora gli scaglioni ufficiali (dati precedenti al CCNL
  // caricato) — per le righe con "tiers" i numeri reali sono già corretti per anno.
  const aum = persona.aumentoCCNL;
  if (aum && anno >= aum.annoEffetto && !(riga && riga.tiers)) {
    tabellare = tabellare * (1 + (aum.tabellarePct||0)/100);
  }
  if (aum && anno >= aum.annoEffetto && !(rigaRpd && rigaRpd.tiers)) {
    rpdMensile = rpdMensile + (aum.rpdDeltaMensile||0);
  }
  const tredicesima = persona.tredicesima === false ? 0 : tabellare/12;
  const rpdAnnuo = rpdMensile * 12;
  return {anniServizio, tabellare, tredicesima, rpdAnnuo, totale: tabellare + tredicesima + rpdAnnuo};
}

function trovaLordoAnnuo(persona, anno){
  return componentiLordo(persona, anno).totale;
}

function calcolaAnnoStipendio(persona, anno, cfg){
  const comp = componentiLordo(persona, anno);
  const lordoAnnuo = comp.totale;
  const contributiInps = lordoAnnuo * (cfg.inpsAliquota/100);
  const imponibilePieno = lordoAnnuo - contributiInps;
  const agevolato = anno >= cfg.rientroCervelli.annoInizio && anno <= cfg.rientroCervelli.annoFine;
  const imponibileIrpef = agevolato ? imponibilePieno * (1 - cfg.rientroCervelli.percentuale/100) : imponibilePieno;
  const irpefLorda = calcolaIrpefScaglioni(imponibileIrpef);
  const detrazioni = calcolaDetrazioniLavoroDipendente(imponibileIrpef);
  const irpefNetta = Math.max(0, irpefLorda - detrazioni);
  const addizionali = imponibileIrpef * ((cfg.addizionaleRegionale + cfg.addizionaleComunale)/100);
  const nettoAnnuo = lordoAnnuo - contributiInps - irpefNetta - addizionali;
  return {
    anno, anniServizio: comp.anniServizio, lordoAnnuo, contributiInps, imponibileIrpef, irpefNetta, addizionali,
    nettoAnnuo, nettoMensile12: nettoAnnuo/12, agevolato,
    tabellare: comp.tabellare, tredicesima: comp.tredicesima, rpdAnnuo: comp.rpdAnnuo
  };
}

// Detrazione ristrutturazione edilizia (o altro bonus casa a rate fisse): la quota
// annua è fissa per legge (spesa × % / n. rate), ma si può recuperare solo fino alla
// capienza IRPEF di quell'anno — l'eventuale eccedenza NON si riporta agli anni
// successivi oltre alle rate previste: va persa in modo definitivo.
// Piano di ammortamento "alla francese" (rata costante), simulato mese per mese
// per poter gestire le estinzioni anticipate parziali (che ricalcolano la rata
// o accorciano la durata a seconda della modalità scelta).
function pianoAmmortamentoDettagliato(det){
  const tassoMensile = (det.tassoAnnuo/100)/12;
  let mesiResiduiTotali = det.durataAnni*12;
  let rata = tassoMensile===0 ? det.importoMutuo/mesiResiduiTotali : det.importoMutuo * tassoMensile / (1-Math.pow(1+tassoMensile,-mesiResiduiTotali));
  let capitale = det.importoMutuo;
  const eventi = (det.estinzioniAnticipate||[]).slice().sort((a,b)=> (a.anno*12+a.mese)-(b.anno*12+b.mese));
  let eventoIdx = 0;
  const righe = [];
  let anno = det.annoInizio, mese = 1;
  let mesiTrascorsi = 0;
  const limiteSicurezza = det.durataAnni*12 + 12; // evita loop infiniti in casi limite
  while (capitale > 0.5 && mesiTrascorsi < limiteSicurezza){
    const interesse = capitale * tassoMensile;
    let quotaCapitale = rata - interesse;
    if (quotaCapitale > capitale) quotaCapitale = capitale;
    capitale = Math.max(0, capitale - quotaCapitale);
    let estinzioneExtra = 0, modalitaApplicata = null;
    while (eventoIdx < eventi.length && eventi[eventoIdx].anno===anno && eventi[eventoIdx].mese===mese){
      const ev = eventi[eventoIdx];
      const extra = Math.min(ev.importo, capitale);
      capitale = Math.max(0, capitale - extra);
      estinzioneExtra += extra;
      modalitaApplicata = ev.modalita;
      if (capitale > 0.5){
        const mesiResiduiDopo = mesiResiduiTotali - (mesiTrascorsi+1);
        if (ev.modalita === "riduci_rata" && mesiResiduiDopo > 0){
          rata = tassoMensile===0 ? capitale/mesiResiduiDopo : capitale * tassoMensile / (1-Math.pow(1+tassoMensile,-mesiResiduiDopo));
        }
        // "riduci_durata": la rata resta invariata, il piano si accorcia da sé
      }
      eventoIdx++;
    }
    righe.push({anno, mese, rata, interesse, quotaCapitale, estinzioneExtra, modalitaApplicata, capitaleResiduo: capitale});
    mesiTrascorsi++;
    mese++; if (mese>12){ mese=1; anno++; }
  }
  return righe;
}

// Aggrega il piano mensile per anno solare.
function pianoAmmortamentoAnnuale(det){
  const mensile = pianoAmmortamentoDettagliato(det);
  const map = {};
  mensile.forEach(r => {
    if (!map[r.anno]) map[r.anno] = {anno:r.anno, interessi:0, capitaleRimborsato:0, estinzioniExtra:0, rateMensili:[], capitaleResiduoFine:0};
    map[r.anno].interessi += r.interesse;
    map[r.anno].capitaleRimborsato += r.quotaCapitale;
    map[r.anno].estinzioniExtra += r.estinzioneExtra;
    map[r.anno].rateMensili.push(r.rata);
    map[r.anno].capitaleResiduoFine = r.capitaleResiduo;
  });
  return Object.values(map).sort((a,b)=>a.anno-b.anno).map(a => ({
    ...a, rataMediaMensile: a.rateMensili.reduce((s,v)=>s+v,0)/a.rateMensili.length
  }));
}

function pianoAmmortamentoMutuo(det){
  return pianoAmmortamentoAnnuale(det).map(a => a.interessi);
}

function interessiMutuoAnno(det, annoReale){
  if (annoReale < det.annoInizio) return 0;
  const riga = pianoAmmortamentoAnnuale(det).find(a => a.anno === annoReale);
  return riga ? riga.interessi : 0;
}

// Elenca le quote "lorde" (prima del limite di capienza IRPEF) di tutte le
// detrazioni attive in un dato anno.
function calcolaQuoteDetrazioni(anno, cfg){
  const voci = [];
  const r = cfg.detrazioneRistrutturazione;
  if (r && r.attiva) {
    const annoFine = r.annoInizio + r.anniRateizzazione - 1;
    if (anno >= r.annoInizio && anno <= annoFine) {
      voci.push({tipo:'ristrutturazione', label:'Ristrutturazione', quota: (r.importoSpesa*(r.percentuale/100))/r.anniRateizzazione, applicaA: r.applicaA});
    }
  }
  const m = cfg.detrazioneMutuo;
  if (m && m.attiva) {
    const interessiAnno = interessiMutuoAnno(m, anno);
    if (interessiAnno > 0.5) {
      const base = Math.min(interessiAnno, m.tettoInteressiAnnui);
      voci.push({tipo:'mutuo', label:'Interessi mutuo', quota: base*(m.percentuale/100), applicaA: m.applicaA, interessiAnno});
    }
  }
  return voci;
}

// Applica il limite di capienza IRPEF a tutte le detrazioni attive quell'anno,
// condividendo correttamente la capienza tra voci a carico della stessa persona
// (altrimenti si conterebbe due volte la stessa capacità di detrarre).
function calcolaRecuperoDetrazioni(anno, cfg, capienzaP1, capienzaP2){
  const voci = calcolaQuoteDetrazioni(anno, cfg);
  let residuoP1 = capienzaP1, residuoP2 = capienzaP2;
  const dettaglio = voci.map(v => {
    let capienzaDisp;
    let recuperatoPersona1 = 0, recuperatoPersona2 = 0;
    if (v.applicaA === "persona1") capienzaDisp = residuoP1;
    else if (v.applicaA === "persona2") capienzaDisp = residuoP2;
    else capienzaDisp = residuoP1 + residuoP2;
    const recuperato = Math.min(v.quota, Math.max(0, capienzaDisp));
    const perso = v.quota - recuperato;
    if (v.applicaA === "persona1") { residuoP1 -= recuperato; recuperatoPersona1 = recuperato; }
    else if (v.applicaA === "persona2") { residuoP2 -= recuperato; recuperatoPersona2 = recuperato; }
    else {
      const daP1 = Math.min(residuoP1, recuperato);
      residuoP1 -= daP1;
      const daP2 = recuperato - daP1;
      residuoP2 -= daP2;
      recuperatoPersona1 = daP1; recuperatoPersona2 = daP2;
    }
    return {...v, recuperato, perso, recuperatoPersona1, recuperatoPersona2};
  });
  const totaleRecuperato = dettaglio.reduce((s,d)=>s+d.recuperato,0);
  const totalePerso = dettaglio.reduce((s,d)=>s+d.perso,0);
  const totaleQuota = dettaglio.reduce((s,d)=>s+d.quota,0);
  return {dettaglio, totaleRecuperato, totalePerso, totaleQuota, attiva: dettaglio.length>0};
}

// Quota del recupero attribuibile a una persona, rispettando la capienza realmente
// consumata dal calcolo precedente (non una ripartizione fittizia 50/50).
function recuperoPerPersona(dettaglio, personaKey){
  return dettaglio.reduce((s,d) => {
    return s + (personaKey === "persona1" ? (d.recuperatoPersona1 || 0) : (d.recuperatoPersona2 || 0));
  }, 0);
}

function trimmedMean95(vals){
  const clean = vals.filter(v => v!=null);
  if (clean.length === 0) return null;
  if (clean.length <= 3) return clean.reduce((s,v)=>s+v,0)/clean.length;
  const sorted = [...clean].sort((a,b)=>a-b);
  const lower = percentile(sorted, 0.025), upper = percentile(sorted, 0.975);
  const inRange = clean.filter(v => v>=lower && v<=upper);
  const use = inRange.length ? inRange : clean;
  return use.reduce((s,v)=>s+v,0)/use.length;
}

function drawYearCompareChart(data, allYears){
  const selected = allYears.filter(y => state.andamentoYears.includes(y));
  // I mesi futuri rispetto a oggi possono avere già un valore (es. ricorrenze
  // pre-generate perché in passato si è navigato avanti nel calendario), ma non
  // sono ancora "successi" davvero: non vanno disegnati come se lo fossero.
  const oggiCompare = new Date();
  const oggiAnnoCompare = oggiCompare.getFullYear(), oggiMeseCompare = oggiCompare.getMonth()+1;
  const eFuturo = (anno, mese) => anno > oggiAnnoCompare || (anno===oggiAnnoCompare && mese > oggiMeseCompare);
  const byMonth = MESI.map((m,i) => {
    const row = {mese:m.slice(0,3)};
    selected.forEach(y => {
      if (eFuturo(y, i+1)) { row[y] = null; return; }
      const rec = data.find(d=>d.anno===y && d.mese===i+1);
      row[y]= rec? rec.risparmio : null;
    });
    return row;
  });
  const datasets = selected.map((y) => {
    const i = allYears.indexOf(y);
    return {label:String(y), data:byMonth.map(r=>r[y]), color: FALLBACK_PALETTE[i % FALLBACK_PALETTE.length]};
  });
  if (state.andamentoShowMedia && allYears.length > 0) {
    const byMonthAll = MESI.map((m,i) => {
      const vals = allYears.filter(y => !eFuturo(y, i+1)).map(y => { const rec = data.find(d=>d.anno===y && d.mese===i+1); return rec ? rec.risparmio : null; }).filter(v=>v!=null);
      return trimmedMean95(vals);
    });
    datasets.push({label:"Media storica (senza picchi)", data:byMonthAll, color: NAVY, width:3, dash:[7,4]});
  }
  const c2 = document.getElementById("yearCompareChart");
  if (c2) drawLineChart(c2, byMonth.map(r=>r.mese), datasets);
}

  const entratePreviste = state.vociEntrata.reduce((s,v)=>s+(current["ENT::"+v]||0),0);
  const totaleUscitePreviste = state.categorieBudget.reduce((s,c)=>s+(current[c]||0),0);
  const risparmioPrevisto = entratePreviste - totaleUscitePreviste;

  // "Reale (finora)" deve riflettere solo attività GIÀ accaduta: esclude mesi
  // futuri rispetto a oggi anche se hanno già movimenti (es. ricorrenze
  // pre-generate perché in passato si è navigato avanti nel calendario) — quei
  // mesi non sono ancora "successi" davvero, non vanno contati come reali.
  const oggi = new Date();
  const oggiAnno = oggi.getFullYear(), oggiMese = oggi.getMonth()+1;
  const nonFuturo = (t) => t.anno < oggiAnno || (t.anno===oggiAnno && t.mese <= oggiMese);

  const entrateReali = state.transazioni.filter(t=>t.anno===year && t.categoria==="Entrate" && nonFuturo(t)).reduce((s,t)=>s+t.importo,0);
  const usciteReali = state.transazioni.filter(t=>t.anno===year && t.categoria!=="Entrate" && nonFuturo(t)).reduce((s,t)=>s+t.importo,0);
  const risparmioReale = entrateReali - usciteReali;

  const mesiRegistratiAnno = getMonthlySummary().filter(d=>d.anno===year && nonFuturo(d)).length || 1;
  const fattoreProiezione = 12 / Math.min(mesiRegistratiAnno, 12);
  const proiezioneEntrate = entrateReali * fattoreProiezione;
  const proiezioneUscite = usciteReali * fattoreProiezione;
  const proiezioneRisparmio = proiezioneEntrate - proiezioneUscite;

  const mediaRealeCat = (cat) => {

  return `
