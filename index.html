<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src https://bilancio-lacavagiroletti.firebaseapp.com blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Bilancio Familiare</title>
<meta name="description" content="Bilancio familiare personale — entrate, uscite, budget e saldo conto">
<style>
:root{
  --navy:#1F2D3D; --cream:#F7F4EC; --green:#2E7D4F; --rust:#A34A3D; --gold:#B8860B;
  --border:#E5E0D3; --border-soft:#D8D3C4; --muted:#7A7362;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--navy);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}
h1{font-family:ui-serif,Georgia,serif;font-size:28px;font-weight:700;margin:0;letter-spacing:-0.5px;}
.sub{color:var(--muted);font-size:13px;margin:4px 0 24px;}
.header-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;}
.tab-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--border-soft);background:transparent;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn:focus-visible,.nav-btn:focus-visible,.add-btn:focus-visible,.range-btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(184,134,11,.35);outline-offset:2px;}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;}
.card h3{font-family:ui-serif,Georgia,serif;font-size:16px;font-weight:700;margin:0 0 14px;color:var(--navy);}
.month-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:24px;}
.nav-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-soft);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
.big-select{font-family:ui-serif,Georgia,serif;font-size:19px;font-weight:700;border:none;background:transparent;color:var(--navy);cursor:pointer;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:26px;}
.summary-card{display:flex;flex-direction:column;gap:6px;}
.summary-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
.summary-value{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:700;}
/* minmax(0,…): le colonne non si allargano col contenuto, così un pulsante più
   lungo (es. "Conferma?" al posto della x) non fa slittare tutte le righe. */
.two-col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:20px;align-items:start;}
.three-col{display:grid;grid-template-columns:minmax(0,0.85fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;}
@media (max-width:900px){.three-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}}
@media (max-width:820px){.two-col{grid-template-columns:minmax(0,1fr);} .summary-grid{grid-template-columns:1fr;} .three-col{grid-template-columns:minmax(0,1fr);}}
@media (max-width:700px){
  .wrap{padding:18px 12px 64px;}
  .header-row{display:block;}
  h1{font-size:25px;margin-bottom:12px;}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{flex:0 0 auto;white-space:nowrap;}
  .card{padding:14px;overflow-x:auto;}
  .month-nav{gap:10px;margin-bottom:18px;}
  .summary-value{font-size:23px;}
  table{min-width:620px;}
  .tx-list{max-height:460px;overscroll-behavior:contain;}
  .tx-desc{max-width:180px;}
  #reminderBanner{align-items:flex-start;}
}
.cat-row{margin-bottom:12px;}
.cat-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.cat-name{font-weight:600;}
.cat-amt{font-family:ui-monospace,Menlo,monospace;}
.bar-bg{height:6px;background:#EAE6D9;border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.tx-controls{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tx-search{position:relative;flex:1;}
.tx-search input{width:100%;padding:7px 8px 7px 26px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;box-sizing:border-box;font-family:inherit;}
.tx-search .icon{position:absolute;left:8px;top:9px;color:var(--muted);font-size:12px;}
select, input{font-family:inherit;}
.tx-controls select{padding:7px 8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.tx-list{max-height:380px;overflow-y:auto;}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin-bottom:6px;border-radius:6px;}
.tx-item.entrata{background:#E9F3E4;}
.tx-item.uscita{background:#FBEEEC;}
.tx-desc{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px;}
.tx-cat{font-size:11px;color:var(--muted);}
.tx-amt{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:13px;}
.tx-amt.entrata{color:var(--green);}
.tx-amt.uscita{color:var(--rust);}
.tx-del{border:none;background:none;cursor:pointer;color:#B9B2A0;font-size:14px;padding:2px 6px;}
.add-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.empty{color:#9C9585;font-size:13px;}
.modal-bg{position:fixed;inset:0;background:rgba(31,45,61,0.4);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal{background:#fff;border-radius:12px;padding:24px;width:340px;max-width:90vw;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-close{border:none;background:none;cursor:pointer;font-size:18px;}
.form-grid{display:grid;gap:10px;}
.form-grid input, .form-grid select{padding:9px 10px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;width:100%;box-sizing:border-box;}
.form-row{display:flex;gap:8px;}
.hidden{display:none !important;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{padding:6px 4px;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;}
td{padding:8px 4px;border-bottom:1px solid #EFEBDF;}
.esito{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;}
.range-toggle{display:flex;gap:6px;}
.range-btn{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:#EAE6D9;color:var(--navy);font-family:inherit;}
.range-btn.active{background:var(--navy);color:#fff;}
.budget-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EFEBDF;}
.budget-per-month{font-size:12px;color:#9C9585;font-family:ui-monospace,Menlo,monospace;}
.budget-input-wrap{position:relative;}
.budget-input-wrap span{position:absolute;left:8px;top:8px;font-size:13px;color:#9C9585;}
.budget-input-wrap input{width:120px;padding:6px 8px 6px 20px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;text-align:right;}
.budget-total{display:flex;justify-content:space-between;padding-top:14px;font-weight:700;}
.footer-note{color:var(--muted);font-size:12px;margin-top:30px;text-align:center;}
.statement-box{margin-top:18px;padding:16px;border:1px solid var(--border);border-radius:10px;background:#FAF9F5;}
.statement-upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0;}
.statement-result{margin-top:14px;display:grid;gap:10px;}
.statement-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.statement-kpi{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;}
.statement-kpi small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;}
.statement-kpi b{display:block;margin-top:4px;font-family:ui-monospace,Menlo,monospace;}
.statement-list{max-height:230px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px 10px;}
.statement-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EFEBDF;font-size:12px;}
.statement-row:last-child{border-bottom:0;}
@media(max-width:700px){.statement-summary{grid-template-columns:1fr;}}
.chart-canvas{width:100%;height:280px;display:block;}
.admin-cat-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #EFEBDF;}
.admin-cat-row input[type="text"]{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.admin-cat-row label{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;}
.admin-del{border:none;background:none;cursor:pointer;color:var(--rust);font-size:14px;padding:2px 8px;}
.admin-add-row{display:flex;gap:8px;margin-top:14px;}
.admin-add-row input{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border-soft);font-size:13px;}
.warn-box{background:#FCEFCB;border:1px solid #E8D28A;border-radius:8px;padding:10px 12px;font-size:12px;color:#8A6D1F;margin-bottom:14px;}
.danger-zone{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);}
.danger-btn{padding:8px 14px;border-radius:6px;border:1px solid var(--rust);background:#fff;color:var(--rust);font-size:12px;font-weight:600;cursor:pointer;}
#printReport{display:none;}
#lockScreen.hidden{display:none;}
#lockScreen{position:fixed;inset:0;background:var(--cream);z-index:200;display:flex;align-items:center;justify-content:center;}
#firebaseAuthScreen.hidden{display:none;}
#firebaseAuthScreen{position:fixed;inset:0;background:var(--cream);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(31,45,61,.14);padding:26px;width:min(390px,100%);}
.auth-card input{width:100%;box-sizing:border-box;margin:6px 0;padding:11px;border:1px solid var(--border);border-radius:7px;font:inherit;}
.lock-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px;width:320px;max-width:90vw;text-align:center;}
.lock-box h2{font-family:ui-serif,Georgia,serif;margin:0 0 6px;color:var(--navy);}
.lock-box p{font-size:12px;color:var(--muted);margin:0 0 18px;}
.lock-box input{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border-soft);font-size:15px;text-align:center;box-sizing:border-box;margin-bottom:10px;}
.lock-box button{width:100%;padding:10px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.lock-error{color:var(--rust);font-size:12px;min-height:16px;margin-top:6px;}
#reminderBanner{background:#FCEFCB;border:1px solid #E8D28A;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#8A6D1F;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
#reminderBanner button{padding:6px 12px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;}
#reminderBanner .send-btn{background:var(--navy);color:#fff;}
#reminderBanner .dismiss-btn{background:transparent;color:#8A6D1F;text-decoration:underline;}
.header-row{position:sticky;top:0;z-index:30;background:rgba(247,244,236,.94);backdrop-filter:blur(12px);padding:12px 0 10px;margin:-12px 0 0;border-bottom:1px solid rgba(216,211,196,.7);align-items:center;}
.tab-btn{border-color:transparent;border-radius:9px;padding:9px 12px;color:#596575;transition:.18s ease;}
.tab-btn:hover{background:#ECE8DE;color:var(--navy);}
.tab-btn.active{box-shadow:0 4px 12px rgba(31,45,61,.18);}
.tab-btn.admin-tab{margin-left:6px;border-left:1px solid var(--border-soft);border-radius:0 9px 9px 0;}
.dashboard-top{display:grid;grid-template-columns:1.1fr 2fr;gap:14px;margin-bottom:14px;}
.balance-hero{background:linear-gradient(135deg,#1F2D3D 0%,#344A61 100%);color:#fff;border:none;box-shadow:0 10px 28px rgba(31,45,61,.18);}
.balance-hero .summary-label{color:rgba(255,255,255,.68);}
.balance-hero .balance-main{font-family:ui-monospace,Menlo,monospace;font-size:32px;font-weight:800;letter-spacing:-1px;margin:8px 0 4px;}
.balance-hero .balance-meta{font-size:12px;color:rgba(255,255,255,.72);}
.dashboard-top .summary-grid{margin:0;}
.dashboard-top .summary-card{justify-content:center;border:none;box-shadow:0 3px 14px rgba(31,45,61,.06);}
.goals-card{margin-bottom:18px;border:1px solid #D8E8DD;box-shadow:0 5px 18px rgba(46,125,79,.08);overflow:visible;}
.goals-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.goals-head h3{font-family:ui-sans-serif,system-ui,sans-serif;font-size:17px;margin:0;}
.goals-edit{border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:700;font-size:12px;}
.goal-track-wrap{position:relative;padding:28px 0 32px;margin:8px 8px 0;}
.goal-track{height:12px;border-radius:999px;background:#E8E5DD;overflow:hidden;box-shadow:inset 0 1px 2px rgba(31,45,61,.08);}
.goal-track-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#B8860B,#2E7D4F);transition:width .35s ease;}
.goal-marker{position:absolute;top:17px;transform:translateX(-50%);text-align:center;min-width:92px;}
.goal-dot{width:20px;height:20px;border-radius:50%;margin:0 auto 7px;background:#fff;border:4px solid var(--gold);box-shadow:0 2px 7px rgba(31,45,61,.16);}
.goal-marker.done .goal-dot{border-color:var(--green);background:var(--green);}
.goal-marker b{display:block;font-size:12px;white-space:nowrap;}
.goal-marker span{display:block;font-size:10px;color:var(--muted);white-space:nowrap;margin-top:2px;}
.goals-editor{display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:12px;border-top:1px solid var(--border);}
.goals-editor.open{display:flex;}
.tx-item{background:#fff!important;border:1px solid #ECE8DE;border-left:4px solid var(--border-soft);border-radius:9px;transition:.15s ease;}
.tx-item.entrata{border-left-color:var(--green);}.tx-item.uscita{border-left-color:var(--rust);}
.tx-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,45,61,.08);}
.tx-actions .tx-del{opacity:0;transition:.15s ease;}
.tx-item:hover .tx-actions .tx-del,.tx-actions .tx-del:focus{opacity:1;}
.amex-badge{display:inline-flex;border-radius:999px;padding:1px 6px;margin-left:4px;background:#E8EDF8;color:#31558F;font-weight:700;font-size:9px;letter-spacing:.2px;}
.section-toolbar{background:#fff;border:1px solid var(--border);padding:10px;border-radius:10px;box-shadow:0 3px 12px rgba(31,45,61,.04);}
.mobile-more,.mobile-more-menu{display:none;}
.report-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:20px;}
.report-header h1{font-family:ui-serif,Georgia,serif;font-size:24px;margin:0;}
.report-header .meta{font-size:11px;color:var(--muted);text-align:right;}
.report-summary{display:flex;gap:20px;margin-bottom:22px;}
.report-summary div{flex:1;border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.report-summary .lbl{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:0.5px;}
.report-summary .val{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:700;}
.report-section-title{font-family:ui-serif,Georgia,serif;font-size:15px;font-weight:700;margin:22px 0 8px;color:var(--navy);}
.report-table{width:100%;border-collapse:collapse;font-size:12px;}
.report-table th{text-align:left;padding:5px 6px;border-bottom:2px solid var(--navy);font-size:10px;text-transform:uppercase;color:var(--muted);}
.report-table td{padding:5px 6px;border-bottom:1px solid #EFEBDF;}
.report-table tr.tot td{border-top:2px solid var(--navy);border-bottom:none;font-weight:700;padding-top:8px;}
@media (max-width:900px){.dashboard-top{grid-template-columns:1fr}.dashboard-top .summary-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:700px){
  .wrap{padding-bottom:94px;}
  .header-row{position:static;border-bottom:none;padding-top:0;}
  .header-row .tabs{position:fixed;z-index:80;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;overflow:visible;box-shadow:0 -5px 20px rgba(31,45,61,.10);}
  .tab-btn{font-size:10px;padding:7px 2px;display:block;overflow:hidden;text-overflow:ellipsis;}
  .tab-btn:nth-child(5),.tab-btn:nth-child(6),.tab-btn:nth-child(7),.tab-btn:nth-child(8){display:none;}
  .mobile-more{display:block;border:0;background:transparent;color:#596575;font-size:10px;font-weight:700;border-radius:9px;}
  .mobile-more-menu.open{display:grid;position:fixed;z-index:90;right:10px;bottom:68px;width:190px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:7px;box-shadow:0 10px 30px rgba(31,45,61,.20);}
  .mobile-more-menu button{border:0;background:transparent;text-align:left;padding:11px;border-radius:8px;font:600 12px inherit;color:var(--navy);}
  .mobile-more-menu button:hover{background:var(--cream);}
  .tab-btn.admin-tab{margin:0;border:0;border-radius:9px;}
  .dashboard-top .summary-grid{grid-template-columns:repeat(3,1fr);gap:7px;}
  .dashboard-top .summary-card{padding:11px 8px;}
  .dashboard-top .summary-value{font-size:17px;}.dashboard-top .summary-label{font-size:9px;}
  .balance-hero .balance-main{font-size:29px;}
  .goals-head{display:block;}.goals-head>div:last-child{margin-top:5px;}
  .goal-marker{min-width:70px}.goal-marker b{font-size:10px}.goal-marker span{font-size:9px;}
  .tx-actions .tx-del{opacity:1;}
  .tx-controls .add-btn{position:fixed;right:16px;bottom:78px;z-index:75;width:48px;height:48px;border-radius:50%;font-size:0;display:flex;justify-content:center;box-shadow:0 6px 18px rgba(31,45,61,.28);}
  .tx-controls .add-btn::before{content:'+';font-size:27px;font-weight:400;}
}
@media print{
  body *{visibility:hidden;}
  #printReport, #printReport *{visibility:visible;}
  #printReport{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;}
  .footer-note{display:none;}
}
/* Cassaforte */
.cf-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px 14px;margin:12px 0}
.cf-campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.cf-campo input,.cf-campo select,.cf-campo textarea,.cf-cerca{font:inherit;font-size:14px;color:var(--navy);padding:8px 10px;border:1px solid var(--border-soft);border-radius:8px;background:#fff;min-width:0}
.cf-largo{grid-column:1/-1}
.cf-cerca{width:100%;box-sizing:border-box;margin:12px 0}
.cf-errore{color:var(--rust);font-weight:600;font-size:13px}
.cf-ok{color:var(--green);font-weight:600;font-size:13px}
.cf-recupero{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:1px;padding:14px;border:2px dashed var(--gold);border-radius:8px;background:#FBF6E7;word-break:break-all;text-align:center}
.cf-voce{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.cf-voce-testa{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.cf-riga{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;border-top:1px solid var(--border);font-size:13px}
.cf .card-title-row{flex-wrap:wrap;gap:8px}
.cf-riga .sub{margin:0}
.cf-etichetta{color:var(--muted);flex:0 0 130px}
.cf-valore{font-family:ui-monospace,Menlo,monospace;word-break:break-all;flex:1 1 140px;min-width:0}
.cf-riga a{flex:1 1 140px;min-width:0;word-break:break-all}
.cf-note{white-space:pre-wrap;font-size:13px;color:var(--navy);padding-top:6px;border-top:1px solid var(--border)}
