    ${state.vociEntrata.length===0 ? '<p class="empty">Nessuna voce di entrata configurata. Vai in Admin per aggiungerne una.</p>' : state.vociEntrata.map(v => {

          <div style="display:flex;align-items:center;gap:8px">
            <div class="budget-input-wrap"><span>&euro;</span>
              <input type="text" inputmode="decimal" class="budget-entrata-input" data-voce="${escapeHtml(v)}" value="${prevMensile? (Math.round(prevMensile*100)/100) : ''}" placeholder="0" style="border-color:${GREEN}"></div>

function operazioniCassaAttese(anno, mese){
  const out=[];
  const budget=state.budgetAnnuale[anno]||{};
  const trimestrali=normalizzaSpeseTrimestrali(state.speseTrimestrali||[]);
  const eTrimestrale=t=>trimestrali.find(cfg=>String(t.descrizione||"").toLowerCase().includes(String(cfg.descrizioneMatch||"").toLowerCase()));
  state.transazioni.filter(t=>t.categoria==="Entrate"&&t.anno===anno&&t.mese===mese).forEach(t=>{
    let importo=t.importo;
    const voce=state.vociEntrata.find(v=>String(t.descrizione||"").toLowerCase().includes(v.toLowerCase()));
    if(voce){
      const tred=Number(budget["13::"+voce]||0);
      if(tred)importo=flussoStipendioCassa(importo,tred,mese);
    }
    out.push({segno:1,importo,descrizione:t.descrizione,giorno:t.giorno||null,tipo:voce?"stipendio":"entrata",id:t.id});
  });
  state.transazioni.filter(t=>t.categoria!=="Entrate"&&!eTrimestrale(t)).forEach(t=>{
    const cash=t.amex?shiftMonth(t.anno,t.mese,1):{anno:t.anno,mese:t.mese};
    if(cash.anno===anno&&cash.mese===mese)out.push({segno:-1,importo:t.importo,descrizione:t.descrizione,giorno:t.giorno||null,tipo:t.amex?"amex":"uscita",id:t.id});
  });
  trimestrali.forEach(cfg=>{
    const diff=(anno*12+mese)-(cfg.prossimaRataAnno*12+cfg.prossimaRataMese);
    if((((diff%3)+3)%3)!==0)return;
    let totale=0;
    for(let i=0;i<3;i++){
      const p=shiftMonth(anno,mese,-i);
      totale+=state.transazioni.filter(t=>t.categoria!=="Entrate"&&t.anno===p.anno&&t.mese===p.mese&&String(t.descrizione||"").toLowerCase().includes(String(cfg.descrizioneMatch||"").toLowerCase())).reduce((s,t)=>s+t.importo,0);
    }
    if(totale)out.push({segno:-1,importo:totale,descrizione:cfg.descrizioneMatch||"Rata trimestrale",giorno:null,tipo:"trimestrale",id:"trim-"+anno+"-"+mese+"-"+cfg.descrizioneMatch});
  });
  return out;
}

function numeroItaliano(s){
  let v=String(s||"").replace(/\s/g,"").replace(/[€EUR]/gi,"");
  const parentesi=/^\(.*\)$/.test(v);v=v.replace(/[()]/g,"");
  if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");
  const n=Number(v.replace(/[^0-9+\-.]/g,""));
  return Number.isFinite(n)?(parentesi?-Math.abs(n):n):null;
}
function normalizzaTestoMatch(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();}
function similaritaDescrizione(a,b){
  const stop=new Set(["pagamento","addebito","accredito","bonifico","carta","operazione","euro","del","della","con"]);
  const A=new Set(normalizzaTestoMatch(a).split(" ").filter(x=>x.length>2&&!stop.has(x))),B=new Set(normalizzaTestoMatch(b).split(" ").filter(x=>x.length>2&&!stop.has(x)));
  if(!A.size||!B.size)return 0;let comuni=0;A.forEach(x=>{if(B.has(x))comuni++;});return comuni/Math.max(A.size,B.size);
}
async function estraiOperazioniPdf(file){
  const pdfjsLib=await caricaPdfJs();
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const righe=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),content=await page.getTextContent(),byY={};
    content.items.forEach(it=>{const y=Math.round((it.transform&&it.transform[5])||0);(byY[y]=byY[y]||[]).push(it);});
    Object.keys(byY).sort((a,b)=>b-a).forEach(y=>righe.push(byY[y].sort((a,b)=>(a.transform?.[4]||0)-(b.transform?.[4]||0)).map(x=>x.str).join(" ").replace(/\s+/g," ").trim()));
  }
  const ops=[];
  const dataRx=/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/;
  // Consideriamo solo importi seguiti da simbolo/valuta: evita di scambiare
  // orari, numeri pratica e date presenti nelle descrizioni BPER per importi.
  const impRx=/[+\-]?\s*(?:\d{1,3}(?:\.\d{3})*|\d+)\,\d{2}\s*(?:€|EUR)|[+\-]?\s*(?:\d{1,3}(?:,\d{3})*|\d+)\.\d{2}\s*(?:€|EUR)/gi;
  righe.forEach(r=>{
    const dm=r.match(dataRx);if(!dm||dm.index>2)return;
    const dopoData=r.slice(dm.index+dm[0].length,dm.index+dm[0].length+1);if(dopoData==="/")return;
    const tokens=r.match(impRx)||[];if(!tokens.length)return;
    let token=tokens[tokens.length-1],importo=numeroItaliano(token);if(importo===null||Math.abs(importo)<0.01)return;
    if(!/^[+\-]/.test(token.trim())){
      const positivo=/accredito|stipend|emolument|entrata|rimborso|bonifico ricevuto|versamento/i.test(r);
      importo=positivo?Math.abs(importo):-Math.abs(importo);
    }
    const anno=Number(dm[3].length===2?"20"+dm[3]:dm[3]);
    ops.push({giorno:Number(dm[1]),mese:Number(dm[2]),anno,importo,descrizione:r.replace(dm[0],"").replace(token,"").trim(),riga:r,pending:/da contabilizzare/i.test(r)});
  });
  return {ops,righeTotali:righe.length,pagine:pdf.numPages};
}
let pdfjsPromise=null;
async function caricaPdfJs(){
  if(!pdfjsPromise)pdfjsPromise=import("./pdf.mjs");
  const lib=await pdfjsPromise;
  lib.GlobalWorkerOptions.workerSrc="./pdf.worker.mjs";
  return lib;
}
function trovaResponsabiliScostamento(lista,target,valore){
  const tolleranza=1,items=lista.filter(x=>valore(x)>0).slice(0,180),risultati=[];
  const aggiungi=indici=>{
    const chiave=indici.join("-");
    if(!risultati.some(r=>r.chiave===chiave))risultati.push({chiave,items:indici.map(i=>items[i]),totale:indici.reduce((s,i)=>s+valore(items[i]),0)});
  };
  for(let i=0;i<items.length&&risultati.length<8;i++)if(Math.abs(valore(items[i])-target)<=tolleranza)aggiungi([i]);
  for(let i=0;i<items.length&&risultati.length<8;i++)for(let j=i+1;j<items.length&&risultati.length<8;j++)if(Math.abs(valore(items[i])+valore(items[j])-target)<=tolleranza)aggiungi([i,j]);
  for(let i=0;i<items.length&&risultati.length<8;i++){
    const richiesti=new Map();
    for(let j=i+1;j<items.length;j++){
      const necessario=target-valore(items[i])-valore(items[j]);
      const cent=Math.round(necessario*100);
      for(let d=-Math.ceil(tolleranza*100);d<=Math.ceil(tolleranza*100);d++){
        const k=richiesti.get(cent+d);
        if(k!=null&&k!==j){aggiungi([i,k,j].sort((a,b)=>a-b));break;}
      }
      richiesti.set(Math.round(valore(items[j])*100),j);
      if(risultati.length>=8)break;
    }
  }
  return risultati;
}
function confrontaEstratto(ops,anno,mese){
  const banca=ops.filter(o=>o.anno===anno&&o.mese===mese),app=operazioniCassaAttese(anno,mese);
  const bancaEntrate=banca.filter(o=>o.importo>0),bancaUscite=banca.filter(o=>o.importo<0);
  const appEntrate=app.filter(o=>o.segno>0),appUscite=app.filter(o=>o.segno<0);
  const totBancaEntrate=bancaEntrate.reduce((s,o)=>s+o.importo,0),totBancaUscite=bancaUscite.reduce((s,o)=>s+Math.abs(o.importo),0);
  const totAppEntrate=appEntrate.reduce((s,o)=>s+o.importo,0),totAppUscite=appUscite.reduce((s,o)=>s+o.importo,0);
  const diffEntrate=totBancaEntrate-totAppEntrate,diffUscite=totBancaUscite-totAppUscite;
  const cerca=(diff,bancaLista,appLista,bancaValore,appValore)=>{
    if(Math.abs(diff)<=1)return [];
    return diff>0
      ? trovaResponsabiliScostamento(bancaLista,Math.abs(diff),bancaValore).map(r=>({...r,origine:"banca"}))
      : trovaResponsabiliScostamento(appLista,Math.abs(diff),appValore).map(r=>({...r,origine:"app"}));
  };
  return {anno,mese,banca,app,pending:banca.filter(o=>o.pending),totBancaEntrate,totBancaUscite,totAppEntrate,totAppUscite,diffEntrate,diffUscite,
    responsabiliEntrate:cerca(diffEntrate,bancaEntrate,appEntrate,o=>o.importo,o=>o.importo),
    responsabiliUscite:cerca(diffUscite,bancaUscite,appUscite,o=>Math.abs(o.importo),o=>o.importo)};
}

function aggiornaImportoRicorrente(gid, nuovoImporto, daAnno, daMese){
  const segs = state.ricorrenti.filter(r => r.gruppoId===gid);
  const open = segs.find(r => !r.alAnno);
  if (open) {
    const [py, pm] = prevMonth(daAnno, daMese);
    if (py < open.dalAnno || (py===open.dalAnno && pm < open.dalMese)) {
      // il nuovo inizio è prima o uguale al segmento aperto: aggiorna direttamente l'importo del segmento aperto
      open.importo = nuovoImporto;
    } else {
      open.alAnno = py; open.alMese = pm;
      state.ricorrenti.push({id:uid(), gruppoId:gid, categoria:open.categoria, descrizione:open.descrizione,
        importo:nuovoImporto, dalAnno:daAnno, dalMese:daMese, alAnno:null, alMese:null});
    }
  } else {
    state.ricorrenti.push({id:uid(), gruppoId:gid, categoria:segs[0].categoria, descrizione:segs[0].descrizione,
      importo:nuovoImporto, dalAnno:daAnno, dalMese:daMese, alAnno:null, alMese:null});
  }
  // rimuove eventuali movimenti auto-generati futuri con importo vecchio che ricadono nel nuovo segmento
  const idsRimossi = [];
  state.transazioni = state.transazioni.filter(t => {
    if (t.ricorrenteGruppo !== gid) return true;
    const afterStart = t.anno > daAnno || (t.anno===daAnno && t.mese >= daMese);
    const daRimuovere = afterStart && t.importo !== nuovoImporto;
    if (daRimuovere) idsRimossi.push(t.id);
    return !daRimuovere;
  });
  saveRicorrenti();
  salvaMovimentiBulk([], idsRimossi);
  generaMovimentiRicorrenti();
}

function interrompiRicorrente(gid, alAnno, alMese){
  const segs = state.ricorrenti.filter(r => r.gruppoId===gid);
  const open = segs.find(r => !r.alAnno);
  if (open) { open.alAnno = alAnno; open.alMese = alMese; }
  // rimuove i movimenti auto-generati oltre la data di stop
  const idsRimossi = [];
  state.transazioni = state.transazioni.filter(t => {
    if (t.ricorrenteGruppo !== gid) return true;
    const afterStop = t.anno > alAnno || (t.anno===alAnno && t.mese > alMese);
    if (afterStop) idsRimossi.push(t.id);
    return !afterStop;
  });
  saveRicorrenti();
  salvaMovimentiBulk([], idsRimossi);
}

function renderStipendiView(){
  const cfg = state.stipendi;
  const oggiAnno = new Date().getFullYear();
  const p1 = cfg.persona1, p2 = cfg.persona2;
  const oggi1 = calcolaAnnoStipendio(p1, oggiAnno, cfg);
  const oggi2 = calcolaAnnoStipendio(p2, oggiAnno, cfg);
  const totaleOggi = oggi1.nettoMensile12 + oggi2.nettoMensile12;
  const detrOggi = calcolaRecuperoDetrazioni(oggiAnno, cfg, oggi1.irpefNetta, oggi2.irpefNetta);
  const recuperoOggiP1 = recuperoPerPersona(detrOggi.dettaglio, "persona1");
  const recuperoOggiP2 = recuperoPerPersona(detrOggi.dettaglio, "persona2");
  const oggi1ConDetrazioni = oggi1.nettoMensile12 + recuperoOggiP1/12;
  const oggi2ConDetrazioni = oggi2.nettoMensile12 + recuperoOggiP2/12;

  const anniProiezione = [];
  for (let i=0; i<cfg.orizzonteAnni; i++) anniProiezione.push(oggiAnno+i);
  const righe = anniProiezione.map(anno => {
    const rp1 = calcolaAnnoStipendio(p1, anno, cfg);
    const rp2 = calcolaAnnoStipendio(p2, anno, cfg);
    const detr = calcolaRecuperoDetrazioni(anno, cfg, rp1.irpefNetta, rp2.irpefNetta);
    return {anno, p1: rp1, p2: rp2, detr};
  });

  const agevolazioneAttiva = oggiAnno >= cfg.rientroCervelli.annoInizio && oggiAnno <= cfg.rientroCervelli.annoFine;
  const anniRimastiAgevolazione = agevolazioneAttiva ? cfg.rientroCervelli.annoFine - oggiAnno + 1 : 0;

  const det = cfg.detrazioneRistrutturazione;
  const detTotaleDetraibile = det && det.attiva ? det.importoSpesa * (det.percentuale/100) : 0;
  const soloRistr = (r) => r.detr.dettaglio.filter(d=>d.tipo==='ristrutturazione');
  const detTotaleRecuperato = righe.reduce((s,r)=>s+soloRistr(r).reduce((a,d)=>a+d.recuperato,0), 0);
  const detTotalePerso = righe.reduce((s,r)=>s+soloRistr(r).reduce((a,d)=>a+d.perso,0), 0);

  const mut = cfg.detrazioneMutuo;
  const soloMutuo = (r) => r.detr.dettaglio.filter(d=>d.tipo==='mutuo');
  const mutTotaleQuota = righe.reduce((s,r)=>s+soloMutuo(r).reduce((a,d)=>a+d.quota,0), 0);
  const mutTotaleRecuperato = righe.reduce((s,r)=>s+soloMutuo(r).reduce((a,d)=>a+d.recuperato,0), 0);
  const mutTotalePerso = righe.reduce((s,r)=>s+soloMutuo(r).reduce((a,d)=>a+d.perso,0), 0);
  const pianoMutuo = mut && mut.attiva ? pianoAmmortamentoMutuo(mut) : [];
  const interessiTotaliMutuo = pianoMutuo.reduce((s,v)=>s+v,0);

  return `
  <div class="card" style="margin-bottom:20px">
    <h3>Stipendio netto — situazione ${oggiAnno}</h3>
    <p class="sub" style="margin-top:-8px;margin-bottom:16px">Stima calcolata su tabelle stipendiali e aliquote indicative (modificabili in Admin). Non sostituisce il cedolino ufficiale o una consulenza fiscale.</p>
    <div class="summary-grid">
      <div class="card summary-card"><div class="summary-label">${escapeHtml(p1.nome)} — ${escapeHtml(p1.ruolo)}</div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <div class="summary-value" style="font-size:20px;color:${NAVY}">${eur(oggi1.nettoMensile12)}/mese</div>
          ${recuperoOggiP1>0.5 ? `<div style="font-size:13px;color:${GREEN}">+ detrazioni = <b>${eur(oggi1ConDetrazioni)}</b>/mese</div>` : ''}
        </div>
        <div class="sub">Lordo ${eur(oggi1.lordoAnnuo)}/anno · anzianità ${oggi1.anniServizio} anni ${oggi1.agevolato?'· 🎓 rientro cervelli attivo':''}</div>
      </div>
      <div class="card summary-card"><div class="summary-label">${escapeHtml(p2.nome)} — ${escapeHtml(p2.ruolo)}</div>
        <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
          <div class="summary-value" style="font-size:20px;color:${NAVY}">${eur(oggi2.nettoMensile12)}/mese</div>
          ${recuperoOggiP2>0.5 ? `<div style="font-size:13px;color:${GREEN}">+ detrazioni = <b>${eur(oggi2ConDetrazioni)}</b>/mese</div>` : ''}
        </div>
        <div class="sub">Lordo ${eur(oggi2.lordoAnnuo)}/anno · anzianità ${oggi2.anniServizio} anni ${oggi2.agevolato?'· 🎓 rientro cervelli attivo':''}</div>
        <div class="sub" style="font-size:11px;margin-top:4px">Tabellare ${eur(oggi2.tabellare)} + 13ª ${eur(oggi2.tredicesima)} + RPD ${eur(oggi2.rpdAnnuo)} (${eur(oggi2.rpdAnnuo/12)}/mese)</div>
      </div>
      <div class="card summary-card"><div class="summary-label">Totale famiglia</div>
        <div class="summary-value" style="font-size:20px;color:${GREEN}">${eur(totaleOggi)}/mese</div>
        <div class="sub">Netto combinato, su 12 mensilità</div>
      </div>
    </div>
    ${agevolazioneAttiva ? `<p class="sub" style="margin-top:14px;margin-bottom:0">🎓 Regime "rientro dei cervelli" attivo fino al ${cfg.rientroCervelli.annoFine} (ancora ${anniRimastiAgevolazione} anni), poi la tassazione torna piena.</p>` : ''}
  </div>

  ${det && det.attiva ? `
  <div class="card" style="margin-bottom:20px">
    <h3>Detrazione ristrutturazione edilizia</h3>
    <p class="sub" style="margin-top:-8px;margin-bottom:14px">Spesa ${eur(det.importoSpesa)} al ${det.percentuale}% = ${eur(detTotaleDetraibile)} detraibili in ${det.anniRateizzazione} rate annuali fisse da ${eur(detTotaleDetraibile/det.anniRateizzazione)} (${det.annoInizio}–${det.annoInizio+det.anniRateizzazione-1}), a carico di ${det.applicaA==="entrambi"?"entrambi (capienza sommata)":escapeHtml(cfg[det.applicaA].nome)}.</p>
    <div class="summary-card" style="max-width:260px">
      <div class="summary-label">Recuperabile stimato (totale)</div>
      <div class="summary-value" style="font-size:18px;color:${GREEN}">${eur(detTotaleRecuperato)}</div>
      <div class="sub">su ${eur(detTotaleDetraibile)} totali</div>
    </div>
  </div>` : ''}

  ${mut && mut.attiva ? `
  <div class="card" style="margin-bottom:20px">
    <div class="card-title-row"><h3 style="margin-bottom:0">Detrazione interessi mutuo prima casa</h3>
      <button class="range-btn" id="toggleDettaglioMutuo">${state.mostraDettaglioMutuo ? 'Nascondi dettaglio' : 'Vedi dettaglio mutuo'}</button></div>
    <p class="sub" style="margin-top:-8px;margin-bottom:14px">Mutuo ${eur(mut.importoMutuo)} al ${mut.tassoAnnuo}% su ${mut.durataAnni} anni dal ${mut.annoInizio}, piano di ammortamento a rata costante — gli interessi (e quindi la detrazione) calano di anno in anno. Detraibile il ${mut.percentuale}% degli interessi, fino a un tetto di ${eur(mut.tettoInteressiAnnui)}/anno (quindi max ${eur(mut.tettoInteressiAnnui*mut.percentuale/100)}/anno), a carico di ${mut.applicaA==="entrambi"?"entrambi (capienza sommata)":escapeHtml(cfg[mut.applicaA].nome)}.</p>
    <div class="summary-grid">
      <div class="card summary-card" style="box-shadow:none;border:1px solid var(--border)">
        <div class="summary-label">Interessi totali sul mutuo</div>
        <div class="summary-value" style="font-size:18px;color:${NAVY}">${eur(interessiTotaliMutuo)}</div>
        <div class="sub">su tutta la durata effettiva</div>
      </div>
      <div class="card summary-card" style="box-shadow:none;border:1px solid var(--border)">
        <div class="summary-label">Recuperabile stimato (${cfg.orizzonteAnni} anni proiettati)</div>
        <div class="summary-value" style="font-size:18px;color:${GREEN}">${eur(mutTotaleRecuperato)}</div>
        <div class="sub">su ${eur(mutTotaleQuota)} potenzialmente detraibili</div>
      </div>
    </div>
    ${state.mostraDettaglioMutuo ? renderDettaglioMutuo(mut, cfg) : ''}
  </div>` : ''}

  <div class="card">
    <h3>Evoluzione anno per anno</h3>
    <p class="sub" style="margin-top:-8px;margin-bottom:14px">Proiezione su ${cfg.orizzonteAnni} anni in base agli scatti di anzianità previsti e al regime fiscale applicabile in ciascun anno.</p>
    <table class="report-table">
      <thead><tr><th>Anno</th><th>${escapeHtml(p1.nome)}<br>lordo/anno</th><th>${escapeHtml(p1.nome)}<br>netto/mese</th><th>${escapeHtml(p2.nome)}<br>lordo/anno<br><span style="font-weight:400">(tabellare + 13ª + RPD)</span></th><th>${escapeHtml(p2.nome)}<br>netto/mese</th><th>Totale netto/mese</th><th>Recupero<br>detrazioni</th><th>Regime</th></tr></thead>
      <tbody>
        ${righe.map(r => {
          const tot = r.p1.nettoMensile12 + r.p2.nettoMensile12;
          const ccnlAttivo = p2.aumentoCCNL && r.anno >= p2.aumentoCCNL.annoEffetto;
          let regime = r.p1.agevolato || r.p2.agevolato ? '🎓 agevolato' : '—';
          if (ccnlAttivo && r.anno === p2.aumentoCCNL.annoEffetto) regime += '<br>📈 CCNL 2027';
          const detCell = r.detr.attiva ? `<span style="color:${GREEN}">${eur(r.detr.totaleRecuperato)}</span>` : '<span class="sub">—</span>';
          const recP1 = recuperoPerPersona(r.detr.dettaglio, "persona1");
          const recP2 = recuperoPerPersona(r.detr.dettaglio, "persona2");
          const p1NettoCell = recP1>0.5 ? `${eur(r.p1.nettoMensile12)}<br><span class="sub" style="color:${GREEN}">${eur(r.p1.nettoMensile12+recP1/12)} con detr.</span>` : eur(r.p1.nettoMensile12);
          const p2NettoCell = recP2>0.5 ? `${eur(r.p2.nettoMensile12)}<br><span class="sub" style="color:${GREEN}">${eur(r.p2.nettoMensile12+recP2/12)} con detr.</span>` : eur(r.p2.nettoMensile12);
          return `<tr>
            <td style="font-weight:600">${r.anno}</td>
            <td>${eur(r.p1.lordoAnnuo)}</td><td>${p1NettoCell}</td>
            <td title="Tabellare ${eur(r.p2.tabellare)} + 13ª ${eur(r.p2.tredicesima)} + RPD ${eur(r.p2.rpdAnnuo)}">${eur(r.p2.lordoAnnuo)}</td><td>${p2NettoCell}</td>
            <td style="font-weight:700;color:${GREEN}">${eur(tot)}</td>
            <td style="font-size:12px">${detCell}</td>
            <td style="font-size:11px">${regime}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <p class="sub" style="margin-top:12px;margin-bottom:0">Passa il mouse sull'importo recuperato per il dettaglio per voce. Per modificare tabelle stipendiali, aliquote, il regime agevolato o le detrazioni, vai in Admin → "Configurazione stipendi".</p>
  </div>
  `;
}


function renderRicorrentiView(){
  const groups = {};
  state.ricorrenti.forEach(r => {
    if (!groups[r.gruppoId]) groups[r.gruppoId] = [];
    groups[r.gruppoId].push(r);
  });
  const groupIds = Object.keys(groups).sort((a,b) => {
    const fa = groups[a][0], fb = groups[b][0];
    return (fa.descrizione||"").localeCompare(fb.descrizione||"");
  });

  return `
  <div class="card" style="margin-bottom:20px">
    <div class="card-title-row"><h3 style="margin-bottom:0">Spese ed entrate ricorrenti</h3>
      <button class="add-btn" id="openAddRicorrente">+ Nuova ricorrenza</button></div>
    <p class="sub" style="margin-top:-8px;margin-bottom:16px">Le voci ricorrenti si riportano da sole ogni mese con lo stesso importo, fino ad oggi. Se l'importo cambia, usa "Aggiorna importo": lo storico resta invariato, solo i mesi da lì in poi useranno il nuovo valore.</p>
    ${groupIds.length===0 ? '<p class="empty">Nessuna voce ricorrente configurata.</p>' : groupIds.map(gid => {
      const segs = groups[gid].sort((a,b)=> a.dalAnno-b.dalAnno || a.dalMese-b.dalMese);
      const first = segs[0];
      const isEntrata = first.categoria === "Entrate";
      return `<div style="border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div><span style="font-weight:700">${escapeHtml(first.descrizione)}</span>
            <span class="sub" style="margin-left:8px">${escapeHtml(first.categoria)}</span></div>
          <div style="display:flex;gap:6px">
            <button class="range-btn" data-update-gruppo="${gid}">Aggiorna importo</button>
            <button class="range-btn" data-stop-gruppo="${gid}">Interrompi</button>
            <button class="admin-del" data-delete-gruppo="${gid}">&#128465;</button>
          </div>
        </div>
        ${segs.map(s => `<div style="font-size:12px;color:var(--muted);padding:2px 0">
          ${meseAnnoLabel(s.dalAnno,s.dalMese)} &rarr; ${s.alAnno ? meseAnnoLabel(s.alAnno,s.alMese) : 'in corso'}
          <span style="font-family:ui-monospace,monospace;font-weight:700;color:${isEntrata?GREEN:RUST};margin-left:8px">${eur(s.importo)}</span>
        </div>`).join('')}
      </div>`;
    }).join('')}
  </div>
  <div id="ricorrentiModalRoot"></div>
  `;
}

function renderAdminView(){
  const usageCounts = {};
  state.transazioni.forEach(t => { usageCounts[t.categoria] = (usageCounts[t.categoria]||0)+1; });
  const hasPassword = !!localStorage.getItem("bilancio_password_hash");
  const pending=leggiPendingMovimenti(), pendingCount=Object.keys(pending.set).length+Object.keys(pending.del).length;
  const normalizza=s=>String(s||"").toLowerCase().trim().replace(/\s+/g," ");
  const gruppiVarie={};
  state.transazioni.filter(t=>t.categoria==="Varie").forEach(t=>{ const k=normalizza(t.descrizione); if(k.length>=4){ if(!gruppiVarie[k]) gruppiVarie[k]={nome:t.descrizione.trim(),n:0}; gruppiVarie[k].n++; }});
  const suggerimentiVarie=Object.entries(gruppiVarie).filter(([,v])=>v.n>=3).sort((a,b)=>b[1].n-a[1].n).slice(0,8);

  return `
  <div class="card" style="margin-bottom:20px">
    <div class="card-title-row"><h3 style="margin-bottom:0">Stato e sicurezza</h3><span class="sub">versione ${APP_VERSION}</span></div>
    <div class="summary-grid" style="margin:12px 0">
      <div><b>${state.transazioni.length}</b><div class="sub">movimenti locali</div></div>
      <div><b style="color:${pendingCount?RUST:GREEN}">${pendingCount}</b><div class="sub">modifiche in attesa</div></div>

    </div>
    <p class="sub" style="margin:0">Ultima sincronizzazione riuscita: <b>${fmtDataOra(Number(localStorage.getItem("bilancio_ultima_sync_ok")))||"non ancora verificata"}</b>. Le operazioni di ripristino richiedono il cloud e creano prima uno snapshot di sicurezza.</p>
    <div id="cloudIntegrityStatus" class="sub" style="margin-top:8px">Controllo coerenza cloud...</div>
    <button class="range-btn" id="selfTestBtn" style="margin-top:10px">Esegui controlli interni</button><span id="selfTestResult" class="sub" style="margin-left:8px"></span>
  </div>

  <div class="card" style="margin-bottom:20px">
    <h3>Cestino e registro attività</h3>
    <p class="sub" style="margin-top:-8px">I movimenti eliminati restano recuperabili per ${CESTINO_GIORNI} giorni.</p>

const ALLEGATO_MAX_BYTES = 700000; // ~700KB: resta sotto il limite di 1MB per documento Firestore una volta convertito in base64

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // già in formato data: URL
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function salvaAllegato(file){
  if (!db) throw new Error("Cloud non disponibile");
  const dataUrl = await fileToBase64(file);
  const id = uid();
  await db.collection("bilancio_familiare_allegati").doc(id).set({
    data: dataUrl, nome: file.name, createdAt: Date.now()
  });
  return id;
}

async function eliminaAllegato(id){
  if (!db || !id) return;
  try { await db.collection("bilancio_familiare_allegati").doc(id).delete(); } catch(e) { console.error("Errore eliminazione allegato", e); }
}

function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(",");
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : "application/pdf";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type: mime});
}

async function apriAllegato(id){
  if (!db) { alert("Cloud non disponibile: impossibile aprire l'allegato."); return; }
  try {
    const doc = await db.collection("bilancio_familiare_allegati").doc(id).get();
    if (!doc.exists) { alert("Allegato non trovato (potrebbe essere stato rimosso)."); return; }
    const blob = dataUrlToBlob(doc.data().data);
    const blobUrl = URL.createObjectURL(blob);
    window.open(blobUrl, "_blank");
    setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
  } catch(e) { alert("Errore nell'apertura dell'allegato: " + e.message); }
}

document.addEventListener("click", (e) => {
  const link = e.target.closest("[data-open-allegato]");
  if (link) { e.preventDefault(); apriAllegato(link.dataset.openAllegato); }
});

function aggiornaSuggerimentiDescrizione(){
  const catSel = document.getElementById("formCategoria");
  const datalist = document.getElementById("descrizioneSuggestions");
  if (!catSel || !datalist) return;
  const cat = catSel.value;
  const counts = {};
  state.transazioni.forEach(t => {
    if (t.categoria !== cat) return;
    const key = t.descrizione.trim();
    if (!key) return;
    counts[key] = (counts[key]||0) + 1;
  });
  const suggestions = Object.keys(counts).sort((a,b) => counts[b]-counts[a]).slice(0, 20);
  datalist.innerHTML = suggestions.map(s => `<option value="${escapeHtml(s)}"></option>`).join('');
}

function checkBudgetLive(excludeId){
  const catSel = document.getElementById("formCategoria");
  const impInput = document.getElementById("formImporto");
  const meseSel = document.getElementById("formMese");
  const annoInput = document.getElementById("formAnno");
  const warnDiv = document.getElementById("formBudgetWarning");
  if (!catSel || !warnDiv) return;
  const cat = catSel.value;
  const importo = parseImporto(impInput.value) || 0;
  const mese = Number(meseSel.value), anno = Number(annoInput.value);
  if (!state.categorieBudget.includes(cat) || !importo) { warnDiv.innerHTML = ""; return; }
  const previsto = ((state.budgetAnnuale[anno]||{})[cat] || 0) / 12;
  if (!previsto) { warnDiv.innerHTML = ""; return; }
  const speso = state.transazioni.filter(t => t.anno===anno && t.mese===mese && t.categoria===cat && t.id!==excludeId).reduce((s,t)=>s+t.importo,0);
  const totale = speso + importo;
  if (totale > previsto) {
    warnDiv.innerHTML = `<div style="background:#FBEEEC;border:1px solid ${RUST};border-radius:6px;padding:8px 10px;font-size:12px;color:${RUST}">
      &#9888; Con questo movimento, "${escapeHtml(cat)}" arriva a ${eur(totale)} contro un budget di ${eur(previsto)}/mese (${eur(totale-previsto)} in più).
    </div>`;
  } else {
    warnDiv.innerHTML = "";
  }
}

// ---------- event handling ----------
function attachHandlers(){
  document.querySelectorAll(".tab-btn").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  const mobileMoreBtn=document.getElementById("mobileMoreBtn"), mobileMoreMenu=document.getElementById("mobileMoreMenu");
  if(mobileMoreBtn) mobileMoreBtn.onclick=()=>mobileMoreMenu.classList.toggle("open");
  document.querySelectorAll("[data-mobile-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.mobileTab;render();});

  if (state.tab === "mese") {
    const prevBtn = document.getElementById("prevMonth");
    const nextBtn = document.getElementById("nextMonth");
    if (prevBtn) prevBtn.onclick = () => { goMonth(-1); };
    if (nextBtn) nextBtn.onclick = () => { goMonth(1); };
    const selM = document.getElementById("selMonth"); if (selM) selM.onchange = e => { state.selMonth = Number(e.target.value); generaMovimentiRicorrenti(); render(); };
    const selY = document.getElementById("selYear"); if (selY) selY.onchange = e => { state.selYear = Number(e.target.value); generaMovimentiRicorrenti(); render(); };
    const searchInput = document.getElementById("searchInput");
    if (searchInput) searchInput.oninput = e => { state.search = e.target.value; renderKeepFocus('searchInput'); };
    const filterSel = document.getElementById("filterCatSelect");
    if (filterSel) filterSel.onchange = e => { state.filterCat = e.target.value; render(); };
    const allHistChk = document.getElementById("searchAllHistoryChk");
    if (allHistChk) allHistChk.onchange = e => { state.searchAllHistory = e.target.checked; render(); };
    document.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = () => {
        const id = b.dataset.del;
        if (state.pendingDeleteId === id) {
          if(!operazioneDistruttivaConsentita()) return;
          clearTimeout(window._timeoutConfermaCancellazione);
          const t = state.transazioni.find(x => x.id === id);
          if (t && t.ricorrenteGruppo) {
            const rule = state.ricorrenti.find(r => r.gruppoId === t.ricorrenteGruppo);
            if (rule) {
              if (!rule.mesiSaltati) rule.mesiSaltati = [];
              if (!rule.mesiSaltati.some(s => s.anno===t.anno && s.mese===t.mese)) rule.mesiSaltati.push({anno: t.anno, mese: t.mese});
              saveRicorrenti();
            }
          }
          state.pendingDeleteId = null;
          if (t) {
            state.cestino.unshift({...t, deletedAt:Date.now()});
            pulisciCestinoScaduto();
            registraAudit("Movimento eliminato", `${t.descrizione} — ${eur(t.importo)}`);
          }
          cancellaMovimento(id);
          render();
          return;
        }
        // Prima pressione: chiedo conferma tramite lo stato dell'app (non una modifica
        // diretta del bottone), così sopravvive anche se nel frattempo arriva un
        // ridisegno automatico dovuto alla sincronizzazione col cloud.
        state.pendingDeleteId = id;
        render();
        clearTimeout(window._timeoutConfermaCancellazione);
        window._timeoutConfermaCancellazione = setTimeout(() => {
          if (state.pendingDeleteId === id) { state.pendingDeleteId = null; render(); }
        }, 4000);
      };
    });
    document.querySelectorAll("[data-mark-recurrent]").forEach(b => b.onclick = () => {
      const t = state.transazioni.find(x => x.id === b.dataset.markRecurrent);
      if (!t) { alert("Movimento non trovato, riprova."); return; }
      const gruppoId = uid();
      t.ricorrenteGruppo = gruppoId;
      state.ricorrenti.push({id:uid(), gruppoId, categoria:t.categoria, descrizione:t.descrizione, importo:t.importo, dalAnno:t.anno, dalMese:t.mese, alAnno:null, alMese:null});
      salvaMovimento(t); saveRicorrenti();
      generaMovimentiRicorrenti();
      render();
      alert(`Fatto: "${t.descrizione}" (${eur(t.importo)}) è ora ricorrente. La trovi anche nel tab \u{1F501} Ricorrenti.`);
    });

    const openModalFor = (editTx) => {
      document.getElementById("modalRoot").innerHTML = renderAddModal(editTx);
      document.getElementById("closeModal").onclick = () => { document.getElementById("modalRoot").innerHTML = ""; };
      document.getElementById("modalBg").onclick = (e) => { if (e.target.id==="modalBg") document.getElementById("modalRoot").innerHTML=""; };
      const excludeId = editTx ? editTx.id : null;
      document.getElementById("formCategoria").onchange = () => { checkBudgetLive(excludeId); aggiornaSuggerimentiDescrizione(); };
      document.getElementById("formImporto").oninput = () => checkBudgetLive(excludeId);
      document.getElementById("formMese").onchange = () => checkBudgetLive(excludeId);
      checkBudgetLive(excludeId);
      aggiornaSuggerimentiDescrizione();
      let allegatoRimosso = false;
      let vecchioAllegatoId = null;
      const rimuoviBtn = document.getElementById("rimuoviAllegatoBtn");
      if (rimuoviBtn) rimuoviBtn.onclick = () => {
        allegatoRimosso = true;
        vecchioAllegatoId = rimuoviBtn.dataset.oldAllegatoId || null;
        rimuoviBtn.closest("div").style.display = "none";
      };

      document.getElementById("submitAdd").onclick = async () => {
        const anno = Number(document.getElementById("formAnno").value);
        const mese = Number(document.getElementById("formMese").value);
        const giornoVal = document.getElementById("formGiorno").value;
        const giorno = giornoVal ? Math.min(31, Math.max(1, Number(giornoVal))) : null;
        const categoria = document.getElementById("formCategoria").value;
        const descrizione = document.getElementById("formDescrizione").value.trim();
        const importo = parseImporto(document.getElementById("formImporto").value);
        const amex = document.getElementById("formAmex").checked && categoria!=="Entrate";
        if (!descrizione) { alert("Scrivi una descrizione."); return; }
        if (!importo || isNaN(importo)) { alert("Inserisci un importo valido (es. 50,00)."); return; }
        const editId = document.getElementById("submitAdd").dataset.editId;
        const fileInput = document.getElementById("formAllegato");
        const file = fileInput && fileInput.files[0];
        const statusDiv = document.getElementById("allegatoStatus");

        let target;
        if (editId) {
          target = state.transazioni.find(x => x.id === editId);
          if (target) {
            target.anno=anno; target.mese=mese; target.categoria=categoria; target.descrizione=descrizione; target.importo=importo; target.amex=amex; target.updatedAt = Date.now();
            if (giorno) target.giorno = giorno; else delete target.giorno;
          }
        } else {
          target = {id:uid(), anno, mese, categoria, descrizione, importo, amex, createdAt: Date.now(), updatedAt: Date.now()};
          if (giorno) target.giorno = giorno;
          state.transazioni.push(target);
        }
        if (allegatoRimosso) {
          delete target.allegatoId; delete target.allegatoNome;
          if (vecchioAllegatoId) eliminaAllegato(vecchioAllegatoId);
        }

        if (file) {
          if (!db) {
            alert("Il salvataggio degli allegati richiede la connessione cloud, non disponibile ora. Il movimento è stato salvato senza allegato.");
          } else if (file.type !== "application/pdf") {
            alert("Puoi allegare solo file PDF. Il movimento è stato salvato senza allegato.");
          } else if (file.size > ALLEGATO_MAX_BYTES) {
            alert(`Il file è troppo grande (${Math.round(file.size/1024)}KB). Il limite è circa ${Math.round(ALLEGATO_MAX_BYTES/1024)}KB — prova a comprimere il PDF o scansionarlo a risoluzione più bassa. Il movimento è stato salvato senza allegato.`);
          } else {
            if (statusDiv) statusDiv.textContent = "Caricamento allegato...";
            try {
              const id = await salvaAllegato(file);
              target.allegatoId = id;
              target.allegatoNome = file.name;
              if (statusDiv) statusDiv.textContent = "";
            } catch(e) {
              alert("Errore nel caricamento dell'allegato: " + e.message + ". Il movimento è stato salvato senza allegato.");
            }
          }
        }

        salvaMovimento(target);
        registraAudit(editId?"Movimento modificato":"Movimento aggiunto", `${descrizione} — ${eur(importo)}`);
        document.getElementById("modalRoot").innerHTML = "";
        render();
      };
    };

    const openAdd = document.getElementById("openAdd");
    const reportBtnHome = document.getElementById("reportPdfBtnHome");
    if (reportBtnHome) reportBtnHome.onclick = apriModalScostamenti;
    const salvaObiettiviBtn=document.getElementById("salvaObiettiviBtn");
    const toggleGoalsEditor=document.getElementById("toggleGoalsEditor");
    if(toggleGoalsEditor) toggleGoalsEditor.onclick=()=>document.getElementById("goalsEditor").classList.toggle("open");
    if(salvaObiettiviBtn) salvaObiettiviBtn.onclick=()=>{
      const valori=Array.from(document.querySelectorAll(".obiettivo-risparmio-input")).map(i=>parseImporto(i.value)).filter(v=>Number.isFinite(v)&&v>0).slice(0,3).sort((a,b)=>a-b);
      if(!valori.length){alert("Inserisci almeno un obiettivo valido.");return;}
      state.obiettiviRisparmio=valori; saveObiettiviRisparmio(); registraAudit("Obiettivi liquidità aggiornati", valori.map(eur).join(", ")); render();
    };
    if (openAdd) openAdd.onclick = () => openModalFor(null);
    document.querySelectorAll("[data-edit-tx]").forEach(b => {
      b.onclick = () => {
        const t = state.transazioni.find(x => x.id === b.dataset.editTx);
        if (t) openModalFor(t);
      };
    });
  }

  if (state.tab === "andamento") {
    document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { state.andamentoRange = b.dataset.range; render(); });
    window.onresize = () => { if (state.tab==="andamento") drawAndamentoCharts(); };
    const riepAnnoSel = document.getElementById("riepilogoAnnoSelect");
    if (riepAnnoSel) riepAnnoSel.onchange = e => { state.riepilogoAnnoSel = Number(e.target.value); render(); };
  }

  if (state.tab === "budget") {
    const ySel = document.getElementById("budgetYearSelect");
    if (ySel) ySel.onchange = e => { state.budgetYear = Number(e.target.value); render(); };
    document.querySelectorAll(".budget-cat-input").forEach(inp => {
      inp.onchange = e => {
        const cat = inp.dataset.cat;
        const mensile = parseImporto(e.target.value) || 0;

        state.budgetAnnuale[year] = {...(state.budgetAnnuale[year]||{}), [cat]: mensile*12};
        saveBudget(); render();
      };
    });
    document.querySelectorAll(".budget-entrata-input").forEach(inp => {
      inp.onchange = e => {
        const voce = inp.dataset.voce;
        const mensile = parseImporto(e.target.value) || 0;
        const year = state.budgetYear;
        state.budgetAnnuale[year] = {...(state.budgetAnnuale[year]||{}), ["ENT::"+voce]: mensile*12};
        saveBudget(); render();
      };
    });
    document.querySelectorAll(".budget-tredicesima-input").forEach(inp => {
      inp.onchange = e => {
        const voce = inp.dataset.voce;
        const importo = parseImporto(e.target.value) || 0;
        const year = state.budgetYear;
        state.budgetAnnuale[year] = {...(state.budgetAnnuale[year]||{}), ["13::"+voce]: importo};
        saveBudget(); render();
      };
    });
  }

  if (state.tab === "saldo") {
    const analyzeBtn=document.getElementById("analyzeStatementBtn");
    if(analyzeBtn)analyzeBtn.onclick=async()=>{
      const input=document.getElementById("statementPdf"),status=document.getElementById("statementStatus"),file=input&&input.files&&input.files[0];
      if(!file){alert("Seleziona prima il PDF dell'estratto conto.");return;}
      if(file.size>20*1024*1024){alert("Il PDF supera 20 MB.");return;}
      analyzeBtn.disabled=true;status.textContent="Lettura e confronto in corso…";
      try{
        const estratto=await estraiOperazioniPdf(file);
        if(!estratto.ops.length)throw new Error("Non ho trovato operazioni leggibili. Il PDF potrebbe essere una scansione oppure usare un formato non riconosciuto.");
        state.analisiEstratto=confrontaEstratto(estratto.ops,state.selYear,state.selMonth);
        state.analisiEstratto.pagine=estratto.pagine;
        status.textContent=`${estratto.pagine} pagine, ${state.analisiEstratto.banca.length} operazioni del mese rilevate`;

function renameCategoria(oldName, newName){
  const idx = state.categorie.indexOf(oldName);
  if (idx>-1) state.categorie[idx] = newName;
  const bidx = state.categorieBudget.indexOf(oldName);
  if (bidx>-1) state.categorieBudget[bidx] = newName;
  const modificati = [];
  state.transazioni.forEach(t => { if (t.categoria===oldName) { t.categoria = newName; t.updatedAt = Date.now(); modificati.push(t); } });
  Object.keys(state.budgetAnnuale).forEach(y => {
    const yr = state.budgetAnnuale[y];
    if (yr && Object.prototype.hasOwnProperty.call(yr, oldName)) { yr[newName] = yr[oldName]; delete yr[oldName]; }
  });
  if (state.filterCat === oldName) state.filterCat = newName;
  saveCategorie(); saveCategorieBudget(); saveBudget();
  salvaMovimentiBulk(modificati, []);
  registraAudit("Categoria rinominata", `${oldName} → ${newName} (${modificati.length} movimenti)`);
  render();
}

// Riporta i movimenti "storici" (senza createdAt) agli id canonici "seed-N" in
// base al contenuto (anno/mese/categoria/descrizione/importo), e individua le
// copie IN ECCESSO rispetto a quante volte quel contenuto compare davvero
// nell'elenco originale TX_SEED — così, a differenza di un semplice conteggio
// "più di uno = duplicato", non tocca mai spese genuinamente identiche per
// coincidenza che erano già presenti nello storico originale. Non tocca mai le
// voci inserite/modificate dall'utente (hanno sempre createdAt).
function analizzaStoricoENormalizza(lista){
  const indiceSeed = {};
  TX_SEED.forEach((t,i) => {
    const chiave = `${t[0]}|${t[1]}|${t[2]}|${t[3]}|${t[4]}`;
    (indiceSeed[chiave] = indiceSeed[chiave] || []).push("seed-"+i);
  });
  const usati = new Set();
  lista.forEach(t => { if (t.id && t.id.indexOf("seed-")===0) usati.add(t.id); });
  const rinominati = []; // {vecchioId, oggetto}
  const daRimuovere = [];
  lista.forEach(t => {
    if (t.createdAt) return;
    if (t.id && t.id.indexOf("seed-")===0) return;
    const chiave = `${t.anno}|${t.mese}|${t.categoria}|${t.descrizione}|${t.importo}`;
    const candidati = indiceSeed[chiave];
    if (!candidati) return; // non fa parte dello storico originale (es. da una ricorrenza): non toccare
    const libero = candidati.find(id => !usati.has(id));
    if (libero) { const vecchioId = t.id; t.id = libero; usati.add(libero); rinominati.push({vecchioId, oggetto:t}); }
    else { daRimuovere.push(t.id); } // tutti i posti "legittimi" per questo contenuto sono gia occupati: copia in eccesso
  });
  return {rinominati, daRimuovere};
}

// Stesso principio applicato alle voci generate dalle ricorrenze: se esistono
// piu righe con lo stesso gruppo ricorrente + anno + mese (create da dispositivi
// diversi con id vecchi non deterministici), ne tiene solo una - quella con
// createdAt piu vecchio, cioe la "prima" mai creata - e riporta il suo id alla
// forma deterministica cosi non puo piu ri-duplicarsi in futuro.
// Se in passato si sono duplicate le REGOLE ricorrenti stesse (non solo le
// transazioni che generano) - es. due regole "Stipendio Chiara" con id diversi,
// create indipendentemente da due dispositivi prima che la sincronizzazione
// delle regole fosse sicura - ogni regola genera le proprie transazioni "gemelle"
// con ricorrenteGruppo diversi: la riconciliazione per mese non le riconosce
// come collegate. Qui le regole duplicate vengono unificate PRIMA: si tiene una
// sola regola "canonica" e le transazioni delle regole scartate vengono
// ri-agganciate ad essa, cosi la riconciliazione successiva le collassa insieme.
function unificaRegoleRicorrentiDuplicate(lista){
  const gruppi = {};
  state.ricorrenti.forEach(r => {
    const chiave = `${r.categoria}|${r.descrizione}|${r.importo}|${r.dalAnno}|${r.dalMese}`;
    (gruppi[chiave] = gruppi[chiave] || []).push(r);
  });
  let cambiato = false;
  const modificati = [];
  Object.values(gruppi).forEach(arr => {
    if (arr.length <= 1) return;
    arr.sort((a,b) => a.id < b.id ? -1 : 1); // ordine deterministico: stesso risultato su ogni dispositivo
    const canonica = arr[0];
    arr.slice(1).forEach(duplicata => {
      lista.forEach(t => { if (t.ricorrenteGruppo === duplicata.gruppoId) { t.ricorrenteGruppo = canonica.gruppoId; t.updatedAt = Date.now(); modificati.push(t); } });
    });
    state.ricorrenti = state.ricorrenti.filter(r => r === canonica || !arr.includes(r));
    cambiato = true;
  });
  return {cambiato, modificati};
}

function riconciliaRicorrenzeDuplicate(lista){
  const gruppi = {};
  lista.forEach(t => {
    if (!t.ricorrenteGruppo) return;
    const chiave = `${t.ricorrenteGruppo}|${t.anno}|${t.mese}`;
    (gruppi[chiave] = gruppi[chiave] || []).push(t);
  });
  const rinominati = [];
  const daRimuovere = [];
  Object.entries(gruppi).forEach(([chiave, arr]) => {
    if (arr.length <= 1) return;
    arr.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
    const [gruppoId, anno, mese] = chiave.split("|");
    const idCanonico = "ric-" + gruppoId + "-" + anno + "-" + mese;
    const sopravvissuto = arr.find(t => t.id === idCanonico) || arr[0];
    if (sopravvissuto.id !== idCanonico) { const vecchioId = sopravvissuto.id; sopravvissuto.id = idCanonico; rinominati.push({vecchioId, oggetto:sopravvissuto}); }
    arr.forEach(t => { if (t !== sopravvissuto) daRimuovere.push(t.id); });
  });
  return {rinominati, daRimuovere};
}

// Calcola tutta la pulizia necessaria su un elenco di movimenti (id storici da
// normalizzare, doppioni da rimuovere, regole ricorrenti duplicate da unificare)
// SENZA toccare lo stato globale ne la rete: restituisce l'elenco pulito piu le
// operazioni da applicare. Usata sia dal controllo manuale in Admin sia dalla
// migrazione una tantum al nuovo formato "un documento per movimento".
function calcolaPuliziaCompleta(listaOriginale){
  let lista = listaOriginale.slice();
  const daScrivere = [];
  const daCancellareSet = new Set();

  const {rinominati, daRimuovere} = analizzaStoricoENormalizza(lista);
  rinominati.forEach(({vecchioId, oggetto}) => { daCancellareSet.add(vecchioId); daScrivere.push(oggetto); });
  daRimuovere.forEach(id => daCancellareSet.add(id));
  lista = lista.filter(t => !daRimuovere.includes(t.id));

  const {modificati} = unificaRegoleRicorrentiDuplicate(lista);
  modificati.forEach(t => daScrivere.push(t));

  const {rinominati: rinominatiRic, daRimuovere: daRimuovereRic} = riconciliaRicorrenzeDuplicate(lista);
  rinominatiRic.forEach(({vecchioId, oggetto}) => { daCancellareSet.add(vecchioId); daScrivere.push(oggetto); });
  daRimuovereRic.forEach(id => daCancellareSet.add(id));
  lista = lista.filter(t => !daRimuovereRic.includes(t.id));

  return {lista, daScrivere, daCancellare: Array.from(daCancellareSet)};
}

// Controllo manuale da Admin: applica la pulizia completa allo stato attuale e
// pubblica le modifiche sul cloud (documento per documento). Con l'archiviazione
// "un documento per movimento" i doppioni non possono piu formarsi da soli in
// modo strutturale: questo resta come rete di sicurezza per casi rari (es. doppio
// clic su "Aggiungi" prima che l'app disabiliti il bottone).
function eseguiPuliziaManuale(){
  const regolePrima = state.ricorrenti.length;
  const risultato = calcolaPuliziaCompleta(state.transazioni);
  state.transazioni = risultato.lista;
  localStorage.setItem("bilancio_transazioni", JSON.stringify(state.transazioni));
  saveRicorrenti();
  salvaMovimentiBulk(risultato.daScrivere, risultato.daCancellare);
  return {
    cambiato: risultato.daScrivere.length > 0 || risultato.daCancellare.length > 0,
    rimossi: risultato.daCancellare.length,
    regoleUnificate: regolePrima - state.ricorrenti.length
  };
}

function contenutoBackup(data){
  const x={}; ["transazioni","budgetAnnuale","saldoConto","categorie","categorieBudget","vociEntrata","ricorrenti","speseTrimestrali","risparmioReset","stipendi","cestino","auditLog"].forEach(k=>x[k]=data[k]===undefined?null:data[k]);
  // Campo introdotto dopo i primi backup con checksum: se assente non viene
  // aggiunto, così i backup storici continuano a superare la verifica.
  if(data.obiettiviRisparmio!==undefined) x.obiettiviRisparmio=data.obiettiviRisparmio;
  return x;
}
async function checksumBackup(data){ return sha256(JSON.stringify(contenutoBackup(data))); }
async function exportBackup(){
  const backup = {...statoCompleto(), exportedAt:new Date().toISOString(), versione:APP_VERSION};
  backup.checksum=await checksumBackup(backup);
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "bilancio-backup-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(url);
}

function backupValido(data){
  if (!data || typeof data !== "object" || !Array.isArray(data.transazioni)) return false;
  return data.transazioni.every(t => t && typeof t.id==="string" && Number.isFinite(Number(t.anno)) && Number.isFinite(Number(t.mese)) && typeof t.categoria==="string" && typeof t.descrizione==="string" && Number.isFinite(Number(t.importo)));
}

let sostituzioneMovimentiInCorso = false;
async function sostituisciMovimentiCloud(nuovi){
  if (!movimentiColRef || !db) throw new Error("Cloud non disponibile: ripristino annullato senza modificare i dati.");
  sostituzioneMovimentiInCorso = true;
  try {
    const tutti = await movimentiColRef.get();
    const nuoviPerId = new Map(nuovi.map(t => [t.id, t]));
    const operazioni = [];
    tutti.docs.forEach(d => { if (!nuoviPerId.has(d.id)) operazioni.push({tipo:"del", id:d.id}); });
    nuovi.forEach(t => operazioni.push({tipo:"set", t}));
    for (let i=0; i<operazioni.length; i+=450){
      const batch = db.batch();
      operazioni.slice(i,i+450).forEach(op => {
        if (op.tipo==="set") batch.set(movimentiColRef.doc(op.t.id), op.t);
        else batch.delete(movimentiColRef.doc(op.id));
      });
      await batch.commit();
    }
    localStorage.removeItem(PENDING_MOVIMENTI_KEY);
  } finally {
    sostituzioneMovimentiInCorso = false;
  }
}

function importBackup(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if(!operazioneDistruttivaConsentita()) return;
      if (!backupValido(data)) throw new Error("struttura del backup non riconosciuta");
      if (data.checksum && data.checksum !== await checksumBackup(data)) throw new Error("checksum non valido: il file potrebbe essere incompleto o alterato");
      if (!data.checksum && !confirm("Questo è un backup precedente, senza verifica di integrità. Continuare comunque?")) return;
      if (!cloudReady) throw new Error("cloud non disponibile: per sicurezza il ripristino non è stato avviato");
      if (!confirm(`Importare questo backup con ${data.transazioni.length} movimenti? Sostituirà i dati attuali su tutti i dispositivi.`)) return;
      await creaSnapshotPreRipristino();
      await sostituisciMovimentiCloud(data.transazioni);
      applicaBackupEsatto(data);
      await pushToCloud();
      registraAudit("Backup importato", `${data.transazioni.length} movimenti${data.checksum?", checksum verificato":""}`);
      alert("Backup importato con successo.");
      render();
    } catch(err){ alert("Importazione non completata: " + err.message); }
  };
  reader.readAsText(file);
}

// SICUREZZA: schermo di blocco con password (deterrente base,
// non è crittografia: i dati restano in chiaro nel localStorage)
// ============================================================
async function sha256(text){
  const enc = new TextEncoder().encode("bilancio-salt::" + text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function calcolaScostamenti(year, mese){
  const current = state.budgetAnnuale[year] || {};
  const out = [];
  state.categorieBudget.forEach(cat => {
    const previsto = (current[cat]||0)/12;
    if (!previsto) return;
    const reale = state.transazioni.filter(t=>t.anno===year && t.mese===mese && t.categoria===cat).reduce((s,t)=>s+t.importo,0);
    const diff = reale - previsto; // positivo = hai speso più del previsto (male)
    const soglia = Math.max(50, previsto*0.2);
    if (diff > soglia) out.push({voce:cat, tipo:"uscita", previsto, reale, diff, pct: (diff/previsto)*100});
  });
  state.vociEntrata.forEach(v => {
    const previsto = entrataPrevistaMese(current,v,mese);
    if (!previsto) return;
    const reale = state.transazioni.filter(t=>t.anno===year && t.mese===mese && t.categoria==="Entrate" && t.descrizione.toLowerCase().includes(v.toLowerCase())).reduce((s,t)=>s+t.importo,0);
    const diff = reale - previsto; // negativo = hai incassato meno del previsto (male)
    const soglia = Math.max(50, previsto*0.2);
    if (diff < -soglia) out.push({voce:v, tipo:"entrata", previsto, reale, diff, pct: (diff/previsto)*100});
  });
  out.sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));
  return out;
}

async function pushToCloud(){
  if (!cloudReady) return;
  try {
    // merge:true (non un .set() che sostituisce tutto): così questo salvataggio
    // non rischia di cancellare campi che non gestisce più (es. il vecchio array
    // "transazioni", ancora necessario alla migrazione una tantum finché non ha
    // finito di leggerlo).
    await sharedDocRef.set({
      budgetAnnuale: state.budgetAnnuale,
      saldoConto: state.saldoConto,
      categorie: state.categorie,
      categorieBudget: state.categorieBudget,
      vociEntrata: state.vociEntrata,
      ricorrenti: state.ricorrenti,
      speseTrimestrali: state.speseTrimestrali,
      risparmioReset: state.risparmioReset,
      obiettiviRisparmio: state.obiettiviRisparmio,
      stipendi: state.stipendi,
      cestino: state.cestino,
      auditLog: state.auditLog,
      lastUpdated: Date.now()
    }, {merge: true});
    localStorage.setItem("bilancio_ultima_sync_ok", String(Date.now()));
    setCloudStatus("\u2601\uFE0F sincronizzato");
  } catch(e) {
    console.error("Errore sync cloud", e);

  }
}

// Salva UN SOLO movimento: aggiorna lo stato locale, la cache offline, e il
// cloud (un singolo documento Firestore, non l'intero elenco). Con un
// documento per movimento, due dispositivi che toccano movimenti diversi non
// si scontrano mai — e non serve più "ricordarsi" delle cancellazioni: una
// cancellazione vera su un documento vero non può tornare indietro per sbaglio.
function salvaMovimento(t){
  const idx = state.transazioni.findIndex(x => x.id === t.id);
  if (idx >= 0) state.transazioni[idx] = t; else state.transazioni.push(t);
  localStorage.setItem("bilancio_transazioni", JSON.stringify(state.transazioni));
  segnaPendingSet(t);
  if (!applyingRemoteUpdate && movimentiColRef) {
    movimentiColRef.doc(t.id).set(t)
      .then(() => { confermaPending(t.id, "set"); localStorage.setItem("bilancio_ultima_sync_ok",String(Date.now())); setCloudStatus("\u2601\uFE0F sincronizzato"); })
      .catch(e => { console.error("Errore salvataggio movimento", e); setCloudStatus("\u26A0\uFE0F offline (solo locale)"); });
  }
}

function cancellaMovimento(id){
  state.transazioni = state.transazioni.filter(x => x.id !== id);
  localStorage.setItem("bilancio_transazioni", JSON.stringify(state.transazioni));
  segnaPendingDelete(id);
  if (!applyingRemoteUpdate && movimentiColRef) {
    movimentiColRef.doc(id).delete()
      .then(() => { confermaPending(id, "del"); localStorage.setItem("bilancio_ultima_sync_ok",String(Date.now())); setCloudStatus("\u2601\uFE0F sincronizzato"); })
      .catch(e => { console.error("Errore cancellazione movimento", e); setCloudStatus("\u26A0\uFE0F offline (solo locale)"); });
  }
