// Per operazioni che toccano molti movimenti insieme (rinomina categoria,
// pulizia duplicati, generazione ricorrenze, migrazione): applica tutte le
// modifiche in un'unica operazione batch invece di tante scritture separate.
// daScrivere: array di movimenti da salvare. daCancellare: array di id da togliere.
async function salvaMovimentiBulk(daScrivere, daCancellare){
  localStorage.setItem("bilancio_transazioni", JSON.stringify(state.transazioni));
  daScrivere.forEach(segnaPendingSet);
  daCancellare.forEach(segnaPendingDelete);
  if (applyingRemoteUpdate || !movimentiColRef || (daScrivere.length===0 && daCancellare.length===0)) return;
  const operazioni = [...daScrivere.map(t=>({tipo:"set",t})), ...daCancellare.map(id=>({tipo:"del",id}))];
  try {
    for (let i=0; i<operazioni.length; i+=450){
      const batch = db.batch();
      operazioni.slice(i,i+450).forEach(op => {
        if (op.tipo==="set") batch.set(movimentiColRef.doc(op.t.id), op.t);
        else batch.delete(movimentiColRef.doc(op.id));
      });
      await batch.commit();
      operazioni.slice(i,i+450).forEach(op => confermaPending(op.tipo==="set" ? op.t.id : op.id, op.tipo==="set" ? "set" : "del"));
    }
    localStorage.setItem("bilancio_ultima_sync_ok",String(Date.now()));
    setCloudStatus("\u2601\uFE0F sincronizzato");
  } catch(e) { console.error("Errore salvataggio multiplo movimenti", e); setCloudStatus("\u26A0\uFE0F offline (solo locale)"); }
}

// Ascolta la collezione dei movimenti: Firestore segnala ESATTAMENTE cosa è
// cambiato (aggiunto/modificato/rimosso) invece di dover confrontare interi
// elenchi. Ogni dispositivo applica solo la differenza reale.
// La PRIMA volta che un dispositivo si collega, però, non basta applicare le
// "differenze": il dato locale di partenza (soprattutto su un dispositivo che
// riparte da zero) può contenere voci storiche già cancellate sul server in
// passato da un altro dispositivo — quel dispositivo non l'ha mai saputo. Il
// primo collegamento quindi sostituisce lo stato locale con la fotografia
// completa e reale del server, non solo le differenze.
let primoSnapshotMovimenti = true;
function processaSnapshotMovimenti(snapshot){
  if (sostituzioneMovimentiInCorso) return;
  applyingRemoteUpdate = true;
  if (primoSnapshotMovimenti) {
    const daServer = {};
    snapshot.forEach(doc => { daServer[doc.id] = {...doc.data(), id: doc.id}; });
    const numSulServer = Object.keys(daServer).length;
    // Prudenza: se il server risulta vuoto (o quasi) mentre in locale c'è già
    // molto di più, è molto più probabile un problema di sincronizzazione
    // temporaneo che una cancellazione reale di tutto — non svuotare il locale
    // in quel caso, aspetta un aggiornamento successivo più affidabile.
    const localeSignificativo = state.transazioni.length > 10;
    if (numSulServer === 0 && localeSignificativo) {
      applyingRemoteUpdate = false;
      return;
    }
    primoSnapshotMovimenti = false;
    // non perdere movimenti aggiunti in locale pochissimo fa (es. offline, prima
    // che il server rispondesse la prima volta) e non ancora confermati dal server
    state.transazioni.forEach(t => {
      if (!daServer[t.id] && t.createdAt && (Date.now()-t.createdAt) < 60000) daServer[t.id] = t;
    });
    // Le modifiche esplicitamente rimaste in coda hanno precedenza sul primo
    // snapshot, indipendentemente da quanto tempo il dispositivo è stato offline.
    const pending = leggiPendingMovimenti();
    Object.values(pending.set).forEach(t => { daServer[t.id] = t; });
    Object.keys(pending.del).forEach(id => { delete daServer[id]; });
    state.transazioni = Object.values(daServer);
  } else {
    snapshot.docChanges().forEach(change => {
      const id = change.doc.id;
      if (change.type === "removed") {
        state.transazioni = state.transazioni.filter(x => x.id !== id);
      } else {
        const data = change.doc.data();
        const idx = state.transazioni.findIndex(x => x.id === id);
        if (idx >= 0) state.transazioni[idx] = {...data, id}; else state.transazioni.push({...data, id});
      }
    });
  }
  localStorage.setItem("bilancio_transazioni", JSON.stringify(state.transazioni));
  applyingRemoteUpdate = false;
  sincronizzaPendingMovimenti();
  generaMovimentiRicorrenti();
  render();
  setCloudStatus("\u2601\uFE0F sincronizzato");
}
function initMovimentiSync(){
  if (!cloudReady || !movimentiColRef) return;
  movimentiColRef.onSnapshot(processaSnapshotMovimenti, (err) => {
    console.error("Errore sincronizzazione movimenti", err);
    setCloudStatus("\u26A0\uFE0F offline (solo locale)");
  });
}


// Unisce due dizionari a due livelli (es. {anno: {categoria: valore}}) senza
// perdere chiavi presenti solo da un lato. Sui conflitti diretti (stessa chiave,
// valori diversi su entrambi i lati) vince il locale, perché riflette quello con
// cui l'utente sta interagendo in questo momento su questo dispositivo.
function mergeDizionarioAnnidato(locale, remoto){
  const risultato = {};
  const tutteLeChiavi = new Set([...Object.keys(locale||{}), ...Object.keys(remoto||{})]);
  tutteLeChiavi.forEach(k => {
    const l = (locale||{})[k], r = (remoto||{})[k];
    if (l && typeof l === "object" && r && typeof r === "object") risultato[k] = {...r, ...l};
    else risultato[k] = l !== undefined ? l : r;
  });
  return risultato;
}
// Come sopra ma a un solo livello (es. saldoConto: {"2026-07": {saldo: 1234}}).
function mergeDizionarioSemplice(locale, remoto){
  return {...(remoto||{}), ...(locale||{})};
}
// Unisce due array di oggetti con id, senza perdere elementi presenti solo da
// un lato (stesso principio dei movimenti, ma senza confronto per data perché
// queste regole non cambiano quasi mai — vince il locale sui conflitti diretti).
function mergeArrayPerId(locale, remoto){
  const map = {};
  (remoto||[]).forEach(x => { map[x.id] = x; });
  (locale||[]).forEach(x => { map[x.id] = x; });
  return Object.values(map);
}
async function sincronizzaPendingMovimenti(){
  if (!movimentiColRef) return;
  const p = leggiPendingMovimenti();
  try {
    for (const t of Object.values(p.set)) {
      await movimentiColRef.doc(t.id).set(t);
      confermaPending(t.id, "set");
    }
    for (const id of Object.keys(p.del)) {
      await movimentiColRef.doc(id).delete();
      confermaPending(id, "del");
    }
  } catch(e){ console.error("Modifiche offline ancora in attesa", e); setCloudStatus("\u26A0\uFE0F offline (modifiche in attesa)"); }
}

// Le spese trimestrali erano in precedenza unite soltanto per id. Poiché la voce
// Mutuo predefinita riceveva un id casuale su ogni browser, ogni nuovo dispositivo
// ne aggiungeva una copia al cloud. La chiave semantica qui sotto identifica invece
// la stessa spesa tramite descrizione e fase del trimestre; in questo modo le copie
// già presenti vengono unificate e non possono più moltiplicare il saldo teorico.
function chiaveSpesaTrimestrale(cfg){
  const descrizione = String((cfg && cfg.descrizioneMatch) || "").trim().toLocaleLowerCase("it-IT");
  const anno = Number(cfg && cfg.prossimaRataAnno) || 0;
  const mese = Number(cfg && cfg.prossimaRataMese) || 0;
  const fase = ((anno * 12 + mese) % 3 + 3) % 3;
  return descrizione + "|" + fase;
}
function normalizzaSpeseTrimestrali(lista){
  const uniche = new Map();
  (Array.isArray(lista) ? lista : []).forEach(cfg => {
    const descrizione = String((cfg && cfg.descrizioneMatch) || "").trim();
    if (!descrizione) return;
    const pulita = {
      ...cfg,
      id: cfg.id || uid(),
      descrizioneMatch: descrizione,
      prossimaRataAnno: Number(cfg.prossimaRataAnno),
      prossimaRataMese: Number(cfg.prossimaRataMese)
    };
    const key = chiaveSpesaTrimestrale(pulita);
    if (!uniche.has(key)) uniche.set(key, pulita);
  });
  return Array.from(uniche.values());
}
function mergeSpeseTrimestrali(locale, remoto){
  // L'array locale viene dopo: a parità di spesa mantiene l'ultima configurazione
  // con cui l'utente sta lavorando, ma senza conservare doppioni con id differenti.
  return normalizzaSpeseTrimestrali([...(remoto || []), ...(locale || [])]);
}
// Come mergeArrayPerId, ma per le regole ricorrenti: se la stessa regola esiste
// da entrambi i lati, unisce anche le liste "mesiSaltati" (mesi che l'utente ha
// cancellato apposta) invece di far vincere in blocco una delle due — altrimenti
// una cancellazione fatta su un dispositivo potrebbe "sparire" se un altro
// dispositivo sincronizza nel frattempo la stessa regola senza saperlo.
function mergeRicorrenti(locale, remoto){
  const mapRemoto = {};
  (remoto||[]).forEach(x => { mapRemoto[x.id] = x; });
  const risultato = {};
  (locale||[]).forEach(x => {
    const r = mapRemoto[x.id];
    if (r) {
      const visti = new Set();
      const mesiUnivoci = [];
      [...(x.mesiSaltati||[]), ...(r.mesiSaltati||[])].forEach(s => {
        const k = s.anno + "-" + s.mese;
        if (!visti.has(k)) { visti.add(k); mesiUnivoci.push(s); }
      });
      risultato[x.id] = {...x, mesiSaltati: mesiUnivoci};
    } else {
      risultato[x.id] = x;
    }
  });
  (remoto||[]).forEach(x => { if (!risultato[x.id]) risultato[x.id] = x; });
  return Object.values(risultato);
}
// Unisce due array di stringhe semplici (es. elenco categorie) senza duplicati.
function mergeArrayStringhe(locale, remoto){
  return Array.from(new Set([...(remoto||[]), ...(locale||[])]));
}

function applyRemoteData(data){
  applyingRemoteUpdate = true;
  const mancaSpeseTrimestrali = data.speseTrimestrali === undefined;
  let speseTrimestraliRipulite = false;
  // Chi ha modificato più di recente per davvero vince i conflitti diretti — non
  // più "chi si sincronizza per ultimo", che poteva far tornare indietro una
  // modifica genuinamente più recente fatta su un altro dispositivo.
  const remotoPiuRecente = (data.lastUpdated || 0) > ultimaModificaLocale;
  // Queste configurazioni vivono in un unico documento con lastUpdated: devono
  // seguire una semantica "versione più recente vince". La vecchia unione degli
  // array rendeva impossibile cancellare categorie, ricorrenze o rate: una copia
  // più vecchia le aggiungeva di nuovo al caricamento successivo.
  if (remotoPiuRecente) {
    if (data.budgetAnnuale !== undefined) state.budgetAnnuale = data.budgetAnnuale;
    if (data.saldoConto !== undefined) state.saldoConto = data.saldoConto;
    if (Array.isArray(data.categorie)) state.categorie = data.categorie;
    if (Array.isArray(data.categorieBudget)) state.categorieBudget = data.categorieBudget;
    if (Array.isArray(data.vociEntrata)) state.vociEntrata = data.vociEntrata;
    if (Array.isArray(data.ricorrenti)) state.ricorrenti = data.ricorrenti;
    if (!mancaSpeseTrimestrali) {
      const pulite = normalizzaSpeseTrimestrali(data.speseTrimestrali);
      speseTrimestraliRipulite = pulite.length !== (data.speseTrimestrali || []).length;
      state.speseTrimestrali = pulite;
    }
    if (data.risparmioReset !== undefined) state.risparmioReset = data.risparmioReset;
    if (Array.isArray(data.obiettiviRisparmio) && data.obiettiviRisparmio.length) state.obiettiviRisparmio = data.obiettiviRisparmio;
    if (data.stipendi !== undefined) state.stipendi = data.stipendi;
    if (Array.isArray(data.cestino)) state.cestino = data.cestino;
    if (Array.isArray(data.auditLog)) state.auditLog = data.auditLog;
  }
  localStorage.setItem("bilancio_cestino",JSON.stringify(state.cestino));
  localStorage.setItem("bilancio_audit_log",JSON.stringify(state.auditLog));
  saveBudget(); saveSaldo(); saveCategorie(); saveCategorieBudget(); saveVociEntrata(); saveRicorrenti(); saveSpeseTrimestrali(); saveRisparmioReset(); saveObiettiviRisparmio(); saveStipendi();
  applyingRemoteUpdate = false;
  migraStipendiRpd(); // se i dati arrivati dal cloud sono in formato vecchio (senza scaglioni ufficiali), li aggiorna subito e li ripubblica corretti sul cloud
  generaMovimentiRicorrenti();
  render();
  setCloudStatus("\u2601\uFE0F sincronizzato");
  // Se il dispositivo aveva modifiche di configurazione più recenti rimaste
  // offline, il semplice ascolto del server non basta: le ripubblichiamo ora.
  if (!remotoPiuRecente || mancaSpeseTrimestrali || speseTrimestraliRipulite) pushToCloud();
}

function initCloudSync(){
  if (!cloudReady) { setCloudStatus("\u26A0\uFE0F cloud non configurato"); return; }
  sharedDocRef.onSnapshot((snap) => {
    if (snap.exists) {
      applyRemoteData(snap.data());
    } else {
      pushToCloud();
    }
    migrazioneMutuoDefault();
    creaSnapshotMensileSeNecessario();
    creaSnapshotGiornalieroSeNecessario();
  }, (err) => {
    console.error("Errore connessione cloud", err);
    setCloudStatus("\u26A0\uFE0F offline (solo locale)");
  });
}

// Migrazione una tantum: prima i movimenti vivevano tutti dentro un unico array
// nel documento condiviso; ora ognuno è un documento a sé nella collezione
// "bilancio_familiare_movimenti", per eliminare alla radice i conflitti da
// sincronizzazione. Legge il vecchio array (se c'è ancora), lo ripulisce con la
// stessa logica del controllo duplicati, e lo scrive nella nuova collezione.
// Se un altro dispositivo ha già completato la migrazione (la collezione nuova
// non è vuota), non fa nulla per evitare di duplicare tutto.
async function migraMovimentiAColezioneSeparata(){
  if (!cloudReady || !movimentiColRef) return;
  if (localStorage.getItem("bilancio_migrazione_movimenti_v2")) return;
  try {
    const giaPresenti = await movimentiColRef.limit(1).get();
    if (!giaPresenti.empty) { localStorage.setItem("bilancio_migrazione_movimenti_v2", "1"); return; }
    const vecchioDoc = await sharedDocRef.get();
    const vecchiaLista = (vecchioDoc.exists && vecchioDoc.data().transazioni) || [];
    if (vecchiaLista.length === 0) { localStorage.setItem("bilancio_migrazione_movimenti_v2", "1"); return; }
    const { lista: listaPulita } = calcolaPuliziaCompleta(vecchiaLista);
    saveRicorrenti(); // calcolaPuliziaCompleta può aver unificato regole ricorrenti duplicate nel frattempo
    for (let i=0; i<listaPulita.length; i+=450){
      const batch = db.batch();
      listaPulita.slice(i,i+450).forEach(t => batch.set(movimentiColRef.doc(t.id), t));
      await batch.commit();
    }
    localStorage.setItem("bilancio_migrazione_movimenti_v2", "1");
  } catch(e) { console.error("Errore migrazione movimenti alla nuova collezione", e); }
}

// Migrazione una tantum: alcune versioni precedenti dell'app potevano salvare sul
// cloud un elenco vuoto di "spese trimestrali" per un bug di sincronizzazione,
// cancellando la voce Mutuo preimpostata. Questa funzione la ripristina UNA VOLTA
// SOLA se manca, poi non interferisce più anche se l'utente la rimuove di proposito.
function migrazioneMutuoDefault(){
  if (localStorage.getItem("bilancio_mutuo_seed_v1")) return;
  localStorage.setItem("bilancio_mutuo_seed_v1", "1");
  const haGiaMutuo = state.speseTrimestrali.some(c => (c.descrizioneMatch||"").toLowerCase().includes("mutuo"));
  if (!haGiaMutuo) {
    state.speseTrimestrali.push({id: "trimestrale-mutuo-default", descrizioneMatch: "mutuo", prossimaRataAnno: 2026, prossimaRataMese: 10});
    state.speseTrimestrali = normalizzaSpeseTrimestrali(state.speseTrimestrali);
    saveSpeseTrimestrali();
    render();
  }
}

// ============================================================
// SNAPSHOT DI BACKUP SU SERVER (punti di ripristino, distinti
// dalla sincronizzazione live: uno automatico ogni mese + manuali)
// ============================================================
const snapshotsCollection = () => db.collection("bilancio_familiare_backups");

function statoCompleto(){
  return {
    transazioni: state.transazioni,
    budgetAnnuale: state.budgetAnnuale,
    saldoConto: state.saldoConto,
    categorie: state.categorie,
    categorieBudget: state.categorieBudget,
    vociEntrata: state.vociEntrata,
    ricorrenti: state.ricorrenti,
    speseTrimestrali: state.speseTrimestrali,
    risparmioReset: state.risparmioReset,
    obiettiviRisparmio: state.obiettiviRisparmio,
    stipendi: state.stipendi
    ,cestino: state.cestino
    ,auditLog: state.auditLog
  };
}

async function salvaSnapshotVerificato(id,tipo){
  const dati=statoCompleto();
  const checksum=await checksumBackup(dati);
  await snapshotsCollection().doc(id).set({...dati,createdAt:Date.now(),tipo,checksum,conteggioMovimenti:dati.transazioni.length,versione:APP_VERSION});
  localStorage.setItem("bilancio_ultimo_backup_ok",String(Date.now()));
}

async function creaSnapshotMensileSeNecessario(){
  if (!cloudReady) return;
  const now = new Date();
  const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const last = localStorage.getItem("bilancio_ultimo_backup_mensile");
  if (last === key) return;
  try {
    const ref = snapshotsCollection().doc(key);
    const esistente = await ref.get();
    if (!esistente.exists) await salvaSnapshotVerificato(key,"automatico");
    localStorage.setItem("bilancio_ultimo_backup_mensile", key);
  } catch(e) { console.error("Errore snapshot mensile", e); }
}

// Snapshot automatico giornaliero: uno per ogni giorno in cui apri l'app almeno una
// volta (non ogni singola modifica, per non moltiplicare le scritture). Tenuti per
// gli ultimi 30 giorni, poi ripuliti da soli per non far crescere lo storage all'infinito.
async function creaSnapshotGiornalieroSeNecessario(){
  if (!cloudReady) return;
  const now = new Date();
  const key = `giorno-${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const last = localStorage.getItem("bilancio_ultimo_backup_giornaliero");
  if (last === key) return;
  try {
    const ref = snapshotsCollection().doc(key);
    const esistente = await ref.get();
    if (!esistente.exists) await salvaSnapshotVerificato(key,"giornaliero");
    localStorage.setItem("bilancio_ultimo_backup_giornaliero", key);
    pulisciSnapshotGiornalieriVecchi();
  } catch(e) { console.error("Errore snapshot giornaliero", e); }
}

async function pulisciSnapshotGiornalieriVecchi(){
  if (!cloudReady) return;
  try {
    const soglia = Date.now() - 30*24*60*60*1000;
    const q = await snapshotsCollection().where("tipo","==","giornaliero").where("createdAt","<",soglia).get();
    for (const doc of q.docs) { await snapshotsCollection().doc(doc.id).delete(); }
  } catch(e) { console.error("Errore pulizia snapshot giornalieri", e); }
}

async function creaSnapshotManuale(){
  if (!cloudReady) { alert("Cloud non configurato: impossibile creare uno snapshot sul server."); return; }
  const now = new Date();
  const id = `manuale-${now.toISOString().slice(0,19).replace(/[:T]/g,"-")}`;
  try {
    await salvaSnapshotVerificato(id,"manuale");
    alert("Snapshot creato sul server.");
    render();
  } catch(e) { alert("Errore nella creazione dello snapshot: " + e.message); }
}

let cachedSnapshotsList = [];
async function caricaListaSnapshot(){
  if (!cloudReady) return [];
  try {
    const q = await snapshotsCollection().orderBy("createdAt","desc").limit(40).get();
    cachedSnapshotsList = q.docs.map(d => ({ id: d.id, ...d.data() }));
    return cachedSnapshotsList;
  } catch(e) { console.error("Errore caricamento snapshot", e); return []; }
}

async function ripristinaSnapshot(id){
  if(!operazioneDistruttivaConsentita()) return;
  if (!confirm(`Ripristinare lo snapshot del ${id}? Questo SOVRASCRIVE i dati attuali (locali e sul server) con quelli salvati in quello snapshot. Non è reversibile se non hai un altro backup più recente.`)) return;
  const snap = cachedSnapshotsList.find(s => s.id === id);
  if (!snap) { alert("Snapshot non trovato."); return; }
  try {
    if (!backupValido(snap)) throw new Error("snapshot non valido o incompleto");
    if (snap.checksum && snap.checksum !== await checksumBackup(snap)) throw new Error("checksum dello snapshot non valido");
    await creaSnapshotPreRipristino();
    await sostituisciMovimentiCloud(snap.transazioni);
    applicaBackupEsatto(snap);
    await pushToCloud();
    alert("Ripristino completato.");
    render();
  } catch(e){ alert("Ripristino annullato: " + e.message); }
}

// ============================================================
// AUTENTICAZIONE FIREBASE — protegge davvero Firestore.
// Gli account si creano solo dalla console Firebase: l'app consente il login,
// non la registrazione pubblica.
// ============================================================
let serviziCloudAvviati=false;
function mostraLoginFirebase(messaggio=""){
  const el=document.getElementById("firebaseAuthScreen");
  el.classList.remove("hidden");
  el.innerHTML=`<div class="auth-card">
    <h2 style="font-family:ui-serif,Georgia,serif;margin:0 0 8px">Accesso al Bilancio Familiare</h2>
    <p class="sub">Accedi con l'account autorizzato. I dati Firestore non sono accessibili senza autenticazione.</p>
    <input type="email" id="firebaseEmail" autocomplete="username" placeholder="E-mail">
    <input type="password" id="firebasePassword" autocomplete="current-password" placeholder="Password">
    <button class="add-btn" id="firebaseLoginBtn" style="width:100%;justify-content:center;margin-top:8px">Accedi</button>
    <button class="range-btn" id="firebaseResetBtn" style="width:100%;margin-top:8px">Password dimenticata</button>
    <p id="firebaseAuthMessage" class="sub" role="alert" style="color:${RUST};margin-bottom:0">${escapeHtml(messaggio)}</p>
  </div>`;
  const eseguiLogin=async()=>{
    const email=document.getElementById("firebaseEmail").value.trim(), password=document.getElementById("firebasePassword").value;
    const msg=document.getElementById("firebaseAuthMessage");
    if(!email||!password){msg.textContent="Inserisci e-mail e password.";return;}
    try{msg.textContent="Accesso in corso...";await auth.signInWithEmailAndPassword(email,password);}
    catch(e){console.error("Login Firebase",e);msg.textContent="Accesso non riuscito. Controlla le credenziali.";}
  };
  document.getElementById("firebaseLoginBtn").onclick=eseguiLogin;
  document.getElementById("firebasePassword").onkeydown=e=>{if(e.key==="Enter")eseguiLogin();};
  document.getElementById("firebaseResetBtn").onclick=async()=>{
    const email=document.getElementById("firebaseEmail").value.trim(), msg=document.getElementById("firebaseAuthMessage");
    if(!email){msg.textContent="Inserisci prima la tua e-mail.";return;}
    try{await auth.sendPasswordResetEmail(email);msg.style.color=GREEN;msg.textContent="Se l'account è autorizzato, riceverai l'e-mail di ripristino.";}
    catch(e){msg.textContent="Non è stato possibile inviare il ripristino.";}
  };
}
function avviaCloudAutenticato(user){
  cloudReady=true;
  document.getElementById("firebaseAuthScreen").classList.add("hidden");
  const label=document.getElementById("firebaseUserLabel"); if(label) label.textContent=`· ${user.email||"utente autenticato"}`;
  const out=document.getElementById("firebaseLogoutBtn"); if(out){out.style.display="inline-block";out.onclick=async()=>{await auth.signOut();location.reload();};}
  setCloudStatus("\u{1F512} autenticato, sincronizzazione...");
  if(!serviziCloudAvviati){
    serviziCloudAvviati=true;
    migraMovimentiAColezioneSeparata().then(()=>{initCloudSync();initMovimentiSync();});
  }
}

// ---------- init ----------
loadState();
render();
if(auth){
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e=>console.error("Persistenza Auth",e));
  auth.onAuthStateChanged(user=>{
    if(user){
      avviaCloudAutenticato(user);
      if(localStorage.getItem("bilancio_password_hash")) showLockScreen(); else maybeShowReminder();
    }else{
      cloudReady=false; serviziCloudAvviati=false;
      setCloudStatus("\u{1F512} accesso richiesto");
      const out=document.getElementById("firebaseLogoutBtn"); if(out) out.style.display="none";
      mostraLoginFirebase();
    }
  });
}else mostraLoginFirebase("Firebase Authentication non è disponibile.");

</script>
