name: Patch AMEX semplice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-amex-simple.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function confrontaEstratto(ops,anno,mese){')
          end=s.index('const bancaEntrate=', start)
          block=s[start:end]
          marker='  const isAmexBanca=o=>'
          if marker not in block:
              raise SystemExit('ERRORE: filtro AMEX non trovato')
          pre=block[:block.index(marker)]
          new_filter='''  const isAmexBanca=o=>/american|amex/i.test(String(o.descrizione||"")+" "+String(o.riga||""));\n'''
          s=s[:start]+pre+new_filter+s[end:]
          if 'Build index: 2026.08.27-07' not in s:
              raise SystemExit('ERRORE: build -07 non trovata')
          s=s.replace('Build index: 2026.08.27-07','Build index: 2026.08.27-08',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -F 'Build index: 2026.08.27-08' index.html
          grep -F 'const isAmexBanca=o=>/american|amex/i.test' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Index v2026.08.27-08: esclude ogni movimento BPER AMERICAN/AMEX'
          git push
